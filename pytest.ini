[pytest]
# tests/ is the only test location. Root-level test_*.py files used to shadow
# these (a root test_dose_conversion.py duplicated tests/test_dose_conversion.py
# by name while containing no assertions at all).
testpaths = tests
python_files = test_*.py
# Without this, `python -m pytest` only works because the module invocation
# (`-m`) puts CWD on sys.path as a side effect; a bare `pytest tests/` (no
# `-m`) fails to collect core modules (vitd_model, vitd_optimization, ...)
# because the repo root is not on sys.path. That made CLAUDE.md's own
# verification command invocation-dependent. pythonpath is a pytest>=7
# feature (pytest>=7 is already required -- see requirements.lock).
pythonpath = .
