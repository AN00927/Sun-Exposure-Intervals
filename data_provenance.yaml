# Data provenance records, one block per study/dataset, keyed under `studies:`
# by study_id. Merged from five previously-separate per-study files
# (data_provenance/bogh_2011.yaml, bogh_2012.yaml, datta_2017.yaml,
# young_2020.yaml, nhanes_seasonal.yaml) into one file during the
# documentation consolidation. Merged rather than kept separate because the
# five files shared one schema, were small, and were read by exactly one
# naive substring match (vitd_calibration.py's Young 2020 check) -- itself a
# latent bug, fixed as part of this merge to a real per-study YAML lookup.
# If the number of tracked studies grows substantially (e.g. ~10 more),
# re-splitting back into per-study files is cheap and would be a reasonable
# future call.

studies:
  Bogh2011:
    full_citation: "Bogh MKB, Schmedes AV, Philipsen PA, Thieden E, Wulf HC. Interdependence between body surface area and ultraviolet B dose in vitamin D production: a randomized controlled trial. British Journal of Dermatology. 2011;164:163-169."

    source_pdf: British Journal of Dermatology 164:163-169
    doi_or_pmid: 10.1111/j.1365-2133.2010.10082.x
    table_or_figure: Table 2 (regression model)
    page: 166

    sample_size: 92

    bsa_equation: "delta_25OHD = 7.1 - 0.223*baseline + 11.0*ln(UVB_dose) + 5.5*ln(BSA_pct)"
    bsa_term_coefficient: 5.5
    bsa_log_base: "natural log (ln)"
    bsa_units: "delta in nmol/L, baseline in nmol/L, UVB_dose in SED, BSA_pct in percent"
    dose_term_coefficient: 11.0
    dose_term_log_base: "natural log (ln)"
    intercept: 7.1
    baseline_coefficient: -0.223
    baseline_coefficient_p: 0.000024
    baseline_r_squared: 0.313
    full_model_r_squared: 0.47
    response_variable: "delta_25(OH)D in nmol/L"

    verification_status: PARTIAL
    verified_by: "Extracted from PAPER_SUMMARIES.md [14]"
    verification_date: 2026-07-28

    notes: |
      Data extracted from PAPER_SUMMARIES.md [14] (full text retrieved).
      The complete model equation is:
      delta = 7.1 - 0.223*baseline + 11.0*ln(UVB_dose) + 5.5*ln(BSA_pct)
      R² = 0.47

      Key findings:
      - Baseline 25(OH)D negatively predicts delta (higher baseline = lower response)
      - BSA and UVB dose effects are logarithmic
      - At 3.0 SED, increasing BSA from 6% to 24% gives no additional response (saturation)
      - Study used Philips TL12 tubes (280-360 nm, broadband UVB)
      - 4 exposures at 2-3 day intervals, randomized 3×3 factorial: BSA (6%, 12%, 24%) × dose (0.75, 1.5, 3.0 SED)

  Bogh2012:
    arm: NB-UVB TL01

    source_pdf: British Journal of Dermatology 167:625-630
    doi_or_pmid: 10.1111/j.1365-2133.2012.11069.x
    table_or_figure: Table 1 (main results)
    page: 627

    sample_size: 16 (completed per arm; 34 NB-UVB, 39 oral D3 randomized)

    baseline_mean: 19.2
    baseline_sd: 6
    baseline_unit: nmol/L

    final_mean: 75
    final_sd: 16.8
    final_unit: nmol/L

    delta_mean: 55.8
    delta_sd: NEEDS_VERIFICATION
    delta_unit: nmol/L

    fst_distribution:
      FST_I: NEEDS_VERIFICATION
      FST_II: NEEDS_VERIFICATION
      FST_III: NEEDS_VERIFICATION
      FST_IV: NEEDS_VERIFICATION
      FST_V: NEEDS_VERIFICATION
      FST_VI: NEEDS_VERIFICATION
      note: "High proportion non-European immigrants; exact FST counts not reported"

    bsa_exposed_fraction: ~1.0
    bsa_definition: "Full body exposure (stated as 'full body NB-UVB')"

    lamp: TL-01 (Philips)
    lamp_spectrum_source: NB-UVB 311 nm

    dose_unit_reported: J/cm²
    dose_start: 0.36
    dose_cap: 1.20
    dose_escalation_rule: "~15% increase every second session"
    dose_schedule_sessions: 18 (3×/week for 6 weeks)
    dose_cumulative_mean: 9.0
    dose_cumulative_unit: J/cm²
    dose_cumulative_sed: "49.5 erythemal SED (9.0 J/cm2 x 5.5, Rodriguez-Granados 2017 TL-01 cabinet factor)"
    dose_cumulative_vitd_effective: "~120.8 (49.5 erythemal SED x E_source 2.44); E_source is applied inside simulate(), not stored as a dose"

    assay_method: LC-MS/MS
    season: "Feb-May 2011 (winter-spring, avoiding summer)"
    latitude: "56°N (Sweden)"

    verification_status: PARTIAL
    verified_by: "Extracted from PAPER_SUMMARIES.md [17]"
    verification_date: 2026-07-28
    verified_fields:
      - baseline_mean, baseline_sd, baseline_unit
      - final_mean, final_sd, final_unit
      - delta_mean, delta_unit
      - sample_size
      - dose_start, dose_cap, dose_escalation_rule, dose_schedule_sessions
      - dose_cumulative_mean, dose_cumulative_unit, dose_cumulative_sed
      - lamp, lamp_spectrum_source
      - assay_method, season, latitude
      - bsa_exposed_fraction, bsa_definition

    unverified_fields:
      - delta_sd
      - fst_distribution (exact counts not reported)

    notes: |
      Data extracted from PAPER_SUMMARIES.md [17] (full text retrieved).
      Full body NB-UVB (TL-01) 3×/week for 6 weeks produced +55.8 nmol/L
      from baseline ~19 nmol/L. The model now PASSES this target
      (predicts +56.0) as of 2026-07-30.

      UNIT CHAIN (two distinct conversions -- do not conflate them):
        1. absolute J/cm2 -> CIE erythemal SED, factor 5.5
           (Rodriguez-Granados 2017, Waldmann UV7002 with 21x TL-01 tubes;
           see data/spectra/tl01_conversion_factor.md)
           Mean cumulative 9.0 J/cm2 -> 49.5 erythemal SED.
        2. erythemal SED -> vitamin-D-effective dose, factor 2.44
           (SOURCE_CALIBRATION_TABLE['tl01_nb_uvb']; Webb 2021 VDE:EE 2.24,
           Grigalavicius 2015 2.63, midpoint used). This is E_source inside
           simulate(), NOT a J/cm2 conversion.

      A previous version of this note used 2.63 as a J/cm2 -> SED conversion,
      giving ~23.7 SED. That mixed the two steps above and understated the
      dose ~2x. The earlier "+38.5, FAILS, E_source placeholder" diagnosis
      came from the same class of error in vitd_validation.py, which passed
      raw J/cm2 into simulate() as if it were SED.

      Caveat (Lloyd 2004): TL-01 calibration factors vary +/-60% (up to 2.7x)
      across expert medical-physics departments. Factor 5.5 is cabinet-specific.

  Datta2017:
    full_citation: "Datta P, Philipsen PA, Olsen P, Bogh MK, Johansen P, Schmedes AV, Morling N, Wulf HC. Half-life in 25(OH)D after UVB exposure depends on gender and vitamin D receptor polymorphism but mainly on the start level. Photochemical & Photobiological Sciences. 2017;16:985-995."

    source_pdf: Photochemical & Photobiological Sciences 16:985-995
    doi_or_pmid: 10.1039/C6PP00258G
    table_or_figure: Abstract + Table 2 (half-life by subgroup)
    page: 987-989

    sample_size: 22 (high-level group; plus n=14 medium, n=92 low from prior studies)

    half_life_parameterization: "Exponential decay: 25(OH)D(day T) = 25(OH)D(day 0) × e^(k×T)"
    decay_constant_k: -0.0078
    decay_constant_unit: "per day"
    baseline_dependence: "Half-life inversely related to start level"

    reported_half_lives:
      high_start_level:
        mean: 89
        range: "59-179 days"
        start_level_mean: 132
        start_level_sd: 31
        start_level_unit: "nmol/L"
        end_level_7wk: 92
        mean_decrease_per_day_pct: 0.78
        decrease_range_pct: "0.2-2.4"
      medium_start_level:
        n: 14
        mean_half_life: 148
        start_level_mean: 65
        start_level_unit: "nmol/L"
      low_start_level:
        n: 92
        mean_half_life: 199
        start_level_mean: 43
        start_level_unit: "nmol/L"

    gender_genotype_effects:
      model_r_squared: 0.878
      model_p: "2.0 × 10⁻⁴⁸"
      shortest_half_life:
        description: "Male, rs2228570 GG"
        half_life: 59
        unit: "days"
      longest_half_life:
        description: "Female, rs2228570 AA/AG"
        half_life: 179
        unit: "days"
      max_interpersonal_difference: "114 nmol/L (7 vs 121 nmol/L)"

    verification_status: PARTIAL
    verified_by: "Extracted from PAPER_SUMMARIES.md [9]"
    verification_date: 2026-07-28
    verified_fields:
      - half_life_parameterization
      - decay_constant_k, decay_constant_unit
      - baseline_dependence
      - reported_half_lives (all three levels)
      - gender_genotype_effects

    unverified_fields:
      - Full experimental protocol details (abstract only available)

    notes: |
      Data extracted from PAPER_SUMMARIES.md [9] (abstract only).
      PRIMARY SOURCE for k_decay_D in the model.

      Key findings:
      - Mean half-life 89 days for high start levels (132 nmol/L)
      - Half-life increases as start level decreases (148d at 65, 199d at 43)
      - Gender and VDR rs2228570 genotype affect half-life (59-179d range)
      - Model uses k_decay_D = ln(2)/80 ≈ 0.00866 day⁻¹ (slightly faster
        than measured 0.00779 for high-level group)
      - The power-law fit from AGENTS.md: t_half(D) = 2953 * D^(-0.72)
        captures the D-dependent half-life

      Only abstract available; full text needed for exact experimental details.

  Young2020:
    full_citation: "Young AR, Morgan KA, Ho T-W, Ojimba N, Harrison GI, Lawrence KP, Jakharia-Shah N, Wulf HC, Cruickshank JK, Philipsen PA. Melanin has a small inhibitory effect on cutaneous vitamin D synthesis: a comparison of extreme phenotypes. Journal of Investigative Dermatology. 2020;140:1418-1426.e1."

    source_pdf: Journal of Investigative Dermatology 140:1418-1426
    doi_or_pmid: 10.1016/j.jid.2019.11.019
    table_or_figure: Tables 1-2 (slope data)
    page: 1421-1422

    sample_size: 102 (44 Arimed B irradiated + 20 control; 38 TL01 irradiated + 10 control)

    fst_ii_slope: "Reference (not numerically reported; used as comparator)"
    fst_vi_slope: "Significantly less steep than FST II (P=8.33×10⁻⁹ for TL01; P≤0.005 for Arimed B)"
    fst_ii_to_vi_ratio_low: 1.29
    fst_ii_to_vi_ratio_high: 1.43
    fst_ii_to_vi_ratio_low_source: "Arimed B (2 SED/exposure, 10 SED cumulative)"
    fst_ii_to_vi_ratio_high_source: "TL01 (1.5 SED/exposure, 7.5 SED cumulative)"
    melanin_inhibition_factor: "1.3-1.4 (range across lamp sources)"
    lamp_sources: "Arimed B (solar simulator, 2 SED/exposure); TL01 (NB-UVB, 1.5 SED/exposure)"
    bsa_exposed: "85% BSA"
    exposures: "5 UVR exposures at 3-4 day intervals"

    ethnicity_ratios:
      white_european_vs_indian_subcontinent: 1.33
      white_european_vs_african: 1.18

    ita_correlation: "r = -0.903 (protected), -0.902 (exposed), P=4.47×10⁻²²"

    verification_status: PARTIAL
    verified_by: "Extracted from PAPER_SUMMARIES.md [10]"
    verification_date: 2026-07-28
    verified_fields:
      - fst_ii_to_vi_ratio_low, fst_ii_to_vi_ratio_high
      - melanin_inhibition_factor
      - lamp_sources
      - bsa_exposed
      - ethnicity_ratios
      - ita_correlation

    unverified_fields:
      - fst_ii_slope (absolute slope values not reported; only ratios)
      - fst_vi_slope (absolute slope values not reported; only ratios)

    notes: |
      Data extracted from PAPER_SUMMARIES.md [10] (full text retrieved).
      CRITICAL for K_ATTEN calibration: measured melanin vitamin D inhibition
      factor (MDIF) between FST II and VI is only ~1.3-1.4, NOT 2.0.

      Key results:
      - Arimed B: FST II vs VI ratio = 1.29
      - TL01: FST II vs VI ratio = 1.43
      - Combined MDIF: ~1.3-1.4

      This paper fundamentally challenges K_ATTEN=2.0. The measured MDIF
      of ~1.3-1.4 means melanin's inhibitory effect on vitamin D synthesis
      is small compared to its effect on erythema (8-10× protection).

      Absolute slopes (nmol/L per SED) are not reported in the summary;
      only ratios between FST groups are provided.

  NHANES_seasonal:
    use_status: EXPLORATORY_ONLY

    reason_invalid: |
      NHANES seasonal amplitude reflects behavior, clothing, latitude,
      supplement use, self-reported race, and baseline differences.
      It is not a controlled physiological validation of K_ATTEN.

    verification_status: NOT_APPLICABLE
