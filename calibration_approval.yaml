# Calibration governance.
#
# Distinguishes two things the previous version conflated:
#   - CALIBRATION: changing a scientific parameter to improve agreement with
#     data. Still gated -- requires human approval.
#   - BUG FIXES: correcting code that does not implement the documented model
#     (unit errors, state-update errors, inverted signs). NOT gated. Refusing
#     to fix a known defect because "parameters are locked" freezes in the
#     error, and the old freeze flags did exactly that.

calibration_allowed: true
bug_fixes_allowed: true

human_approved: true
approved_by: User (repository owner)
approval_date: 2026-08-09
approval_scope: >-
  Covers every entry in parameter_approvals below, each of which was reviewed
  against its own stated source, derivation function and not_covered clause.
  It does NOT extend to future parameter changes: a new entry starts at
  NEEDS_VERIFICATION regardless of this file-level flag.

allowed_calibration_parameters:
  - INTERMITTENT_BURN_EXPONENT
  - SCC_DOSE_EXPONENT
  - MELANIN_ATTENUATION_KAPPA
  - PERSONAL_DOSE_GEOMETRY_FACTOR
  - SCHMALWIESER_2025_JOGGING_ERTA
  - K_ATTEN
  - M_TAN_HEADROOM
  - SC_max_by_FST
calibration_set:
  - Elwood & Jopson 1997 (Int J Cancer 73:198) odds ratios
  - Moan et al. 1989 (Cancer Res 49:5207) biological amplification factors
  - Fajuyigbe et al. 2018 (FASEB J 32:3700) basal:whole CPD protection ratio
  - >-
    Schmalwieser et al. 2025 (Photochem Photobiol, doi 10.1111/php.14114)
    exposure-ratio-to-ambient by body site and solar elevation, jogging.
    QUANTITATIVE: Figure 5 is digitized into
    vitd_physiology.SCHMALWIESER_2025_JOGGING_ERTA.
  - >-
    Weihs et al. 2013 (Photochem Photobiol 89:1004) personal UV exposure by body
    site and posture. NO PREDICTIVE CONSTANT TAKES A VALUE FROM IT. What is
    transcribed, as of 2026-08-20, is the set of BETWEEN-SITE RATIOS the paper
    states in its Results prose (vitd_physiology.WEIHS_2013_PROSE_SITE_RATIOS):
    walking shoulders 1.70x chest and forehead; sitting thighs and shoulders
    1.60x forehead and chest; sitting-up lower legs 2.15x forehead; lying lower
    legs 1.55x forehead. Ratios only -- the prose gives no absolute ER for any
    site and no elevation resolution, so these cannot populate
    ACTIVITY_ERTA_TABLES and no dose calculation reads them. The paper is
    load-bearing for a DECISION (leaving PERSONAL_DOSE_GEOMETRY_FACTOR at 0.35)
    and for corroborating the shoulder finding, not for a number. See
    vitd_physiology, "WEIHS et al. 2013 -- PROSE-SOURCED SITE RATIOS", and note
    that the earlier Figure 6 digitization quoted in this file is WITHDRAWN.
validation_set:
  # Held out from every fit above. Used only to score the result.
  - Gandini et al. 2005 III (Eur J Cancer 41:2040) melanoma RR by skin type
  - Shih et al. 2018 (J Invest Dermatol 138:2244) pooled basal:whole CPD slopes
  - Shih et al. 2018 MED table vs Fajuyigbe whole-epidermis protection factor

# Per-parameter approvals. Each entry carries its own sign-off, so a later
# parameter cannot inherit approval from an earlier one. The file-level flag
# above summarises these; it does not substitute for them.
parameter_approvals:
  INTERMITTENT_BURN_EXPONENT:
    approved_by: User (repository owner)
    approval_date: 2026-08-08
    change: "value UNCHANGED at 3.0; provenance changed from an underived
      modelling choice to OR-anchored"
    source: >-
      Elwood & Jopson 1997 melanoma odds ratios (intermittent 1.71, sunburn
      1.91, heavy occupational 0.86). Cited values only -- the paper itself is
      NOT in Papers_and_Datasets/ (see MODEL_AND_EVIDENCE.md gap 15).
    derivation: vitd_calibration.elwood1997_intermittency_check()
    status: >-
      OR-ANCHORED TO AN INTERVAL, NOT FITTED TO A POINT. At equal cumulative SED
      the burst:continuous index ratio is C**(k-1), so
      k = 1 + ln(OR_burst/OR_occupational)/ln(C). That is one equation in two
      unknowns: C, the burst:continuous per-session dose contrast in fractions
      of MED, is never reported by the exposure-pattern literature, which
      classifies by pattern rather than by dose. Anchoring C to this model's own
      cited doses (erythema threshold vs sub-erythemal ceiling GAMMA_MED)
      produces an interval that contains the incumbent value, so the value was
      RETAINED rather than moved. Two biases oppose and neither is quantified:
      a wider true contrast lowers the implied exponent, while the non-matched
      cumulative dose between Elwood's arms raises it.
    not_covered: >-
      The FST susceptibility decay in cancer_risk() is deliberately untouched
      and remains an order-of-magnitude prior. Elwood & Jopson do not stratify
      by skin type, so there is no dose-response in that source to fit it to.
      Within-skin-type schedule rankings do not depend on it; cross-skin-type
      comparisons of absolute index values do.
    superseded_note: >-
      The 'not_covered' clause above was CLOSED on 2026-08-09 by the
      MELANIN_ATTENUATION_KAPPA entry below, which anchors that axis to
      measured basal-layer DNA damage rather than to an odds ratio. The Elwood
      anchoring itself is unchanged. Also corrected: this entry previously said
      the Elwood & Jopson paper was NOT in Papers_and_Datasets/. It is now, and
      all four odds ratios were verified against the full text, which also
      supplied a number the model had been missing -- TOTAL sun exposure
      OR = 1.18 (1.02-1.38), i.e. melanoma is almost purely a pattern effect.

  SCC_DOSE_EXPONENT:
    approved_by: User (repository owner)
    approval_date: 2026-08-09
    change: "NEW parameter, value 1.7. The SCC term was previously LINEAR in
      cumulative dose, i.e. an implicit exponent of 1.0 that no source supports."
    source: >-
      Moan, Dahlback, Henriksen & Magnus 1989, Cancer Res 49:5207-12 (PMID
      2766289): biological amplification factor Ab = 1.6-1.8 for SCC and
      2.1-2.3 for BCC, ERYTHEMALLY weighted -- the same weighting this model's
      SED carries. Corroborated by Moan 2015 (Photodermatol Photoimmunol
      Photomed 31:26-35), which fits the same power law across SCC, BCC and
      melanoma; Green 1976 (~1.8); Jones 1992 (3.0 SCC, 1.7 BCC).
    derivation: vitd_calibration.moan1989_scc_exponent_check()
    status: >-
      LITERATURE-ANCHORED to the midpoint of the only source that reports SCC
      and BCC separately, uses erythemal weighting, and cross-checks the action
      spectrum (Moan found erythemal and basal-layer-mutagenesis spectra agree
      within ~10%, which is what licenses using erythemal SED here). The wider
      literature brackets Ab at 1.3-3.0.
    not_covered: >-
      Ab is measured across AMBIENT-dose gradients between regions and is
      applied here to a personal annual cumulative dose. That transfer is an
      assumption. The epidemiology constrains the SHAPE -- super-linear, well
      above 1 -- not the transfer.

  MELANIN_ATTENUATION_KAPPA:
    approved_by: User (repository owner)
    approval_date: 2026-08-09
    change: "NEW parameter, value 0.0536715. Replaces the FST susceptibility
      prior exp(-0.45*(fst-1)), which was an admitted order-of-magnitude guess
      and was wrong in both directions: too steep across FST I-IV (3.9 against
      Gandini's measured 2.09) and too shallow across I-VI."
    source: >-
      Fajuyigbe et al. 2018, FASEB J 32:3700-3706 (PMID 29394104), ABSTRACT
      ONLY: CPD protection factors in FST VI vs fair Europeans by epidermal
      depth -- whole epidermis 8.0x, upper 5.0x, middle 16.5x, basal 59.0x.
      Fitted to the basal:whole ratio 59.0/8.0 = 7.375 and nothing else. That
      ratio is taken on the SAME subjects at the SAME exposures, so it is
      independent of whether the arms were matched on physical dose or on
      fractional MED -- an ambiguity that would otherwise disqualify the source.
      Melanin content by skin type from Shih et al. 2018 Table 1.
    derivation: vitd_calibration.skin_type_susceptibility_check()
    status: >-
      DERIVED from a Beer-Lambert depth model of CPD induction, with ONE fitted
      number, and scored against three sources it was not fitted to, all of
      which it passes: (1) Gandini 2005 III melanoma RR for skin type I vs IV,
      measured 2.09 (1.67-2.58), predicted 2.12; (2) the construction's own
      premise -- Shih's MED ratio VI:I of 7.24 must equal Fajuyigbe's measured
      equal-dose whole-epidermis protection of 8.0, and does, within 10%;
      (3) Shih's pooled basal:whole slope ratio 0.615, predicted 0.701, inside
      the interval the two wide CIs permit.
    not_covered: >-
      No epidemiological RR per erythemal episode BY SKIN TYPE exists -- a
      literature search on 2026-08-09 found the per-sunburn meta-analyses either
      pool skin types or restrict to FST I-IV. Substituting a DNA-damage
      biomarker for that missing RR is the central assumption of this axis, and
      it is an assumption, not a measurement. Fajuyigbe is abstract-only and
      carries the entire calibration (data request #12). Shih's FST V and VI
      melanin means rest on n=3 and n=1. Population incidence ratios (Ahmed
      2025: White:Black 13.1-25.8) are used as a DIRECTION check only, never as
      a target, because they confound phenotype with behaviour and
      ascertainment; the derived constitutive factor is 7.3, correctly below
      them.

  K_const:
    approved_by: User (repository owner)
    approval_date: 2026-08-17
    change: >-
      0.33 -> 0.98. Constitutive (baseline) melanin inhibition coefficient.
      Delivers an FST V:II optical factor of 2.01x and VI:I of 2.66x, against
      1.26x and 1.40x before.
    source: >-
      FOUR independent WITHIN-STUDY estimates of the same quantity -- two lab
      matched-dose, two field personal-dosimetry with the measured behavioural
      dose difference removed: Felton et al. 2016 (Br J Dermatol 175:1320-1328)
      1.473; Young et al. 2020 both arms 0.278; Kift et al. 2013 0.788;
      Darling et al. 2013 1.387. All four were already in the repo.
    derivation: >-
      scripts/kconst_recalibration.py -- equal-weight least squares in LOG
      RATIO space across the four routes. The diagnosis it rests on is
      scripts/fst_gap_decomposition.py. Consequence map:
      scripts/feasibility_map_kconst.py.
    status: >-
      CENTRAL ESTIMATE OF A RANGE, NOT A MEASURED CONSTANT. SD across the four
      routes is 0.56, so 0.98 should be read as the centre of roughly 0.3-1.5.
      It sits inside the 1.7-2.7x optical band that two independent routes
      agree on (lab matched-dose 1.5-2.9x; field-with-behaviour-removed
      1.7-2.7x).
      WHAT THE OLD 0.33 WAS: ln(1.36)/(M_VI - M_II), a static-optics inversion
      of a single Young 2020 ratio that ignored feedback and protocol entirely.
      On Felton 2016's within-study matched-dose protocol it did not merely
      under-predict the skin-type gap, it INVERTED it -- model FST II:V 0.96
      against an observed 2.14, because FST V's lower baseline (17.2 vs 36.5
      nmol/L) buys more headroom under (1 - D/D_max) than the melanin term
      removed. That inversion is gone at 0.98 (model 1.49) on every
      matched-dose contrast in the repo. Fixing a SIGN error was the primary
      justification; the magnitude change is secondary.
    not_covered: >-
      (1) BEHAVIOUR. Shade, clothing and time outdoors are a SEPARATE 2.1-2.4x
      factor living in vitd_behaviour.py, defaulting to 1.0 in scheduling mode.
      Folding them in here would require 4.3-5.7x, above every matched-dose
      measurement in existence, and would make the model wrong for exactly the
      users who act on its advice by changing their behaviour.
      (2) FST VI. Every FST V datapoint behind this number is
      Indian-subcontinent ancestry at UK latitude; every FST VI datapoint is
      lamp-based. All VI:* ratios are extrapolations onto M_baseline(VI) = 1.00,
      itself an unvalidated group-level prior. No field dosimetry exists in
      FST VI or in African-ancestry populations.
      (3) A is NOT yet recalibrated. Raising A (Phase 4, approved) increases
      synthesis per SED and will make some cells feasible again, so the
      feasibility consequence below is PROVISIONAL until the combined
      K_const + A map is re-run.
    consequence: >-
      SEVEN (skin type, session budget) cells moved from feasible to
      INFEASIBLE under the standing constraints; NONE moved the other way.
      FST III/IV/V/VI at N=104 are now blocked by the C1 erythema cap (70% MED);
      FST V at N=146 and FST VI at N=146/183 by the C7 session-length ceiling
      (144, 243 and 140 min respectively). Required minutes per day at UV index
      6 and N=365: FST I 10, II 10, III 12, IV 19, V 30, VI 42. Required dose
      inflation is graded by pigmentation: FST I x1.00, II x1.06-1.08,
      III x1.19-1.24, IV x1.47-1.67, V x2.05-2.76, VI x2.60-4.09.
      This is a RESULT, not a regression -- no constraint was relaxed, and it
      is asserted in tests/test_vitd_optimization.py::TestRecalibratedFeasibility
      so it cannot be quietly undone. It independently reproduces the
      conclusion Webb 2018 and Kift 2013 reach for FST V in the UK from
      MEASURED data: sun alone does not hold sufficiency. The model was not
      fitted to that conclusion.

  A:
    approved_by: User (repository owner)
    approval_date: 2026-08-17
    change: >-
      2.353 -> 3.114. Whole-model synthesis scale. Phase 4 item A4, implemented
      2026-08-18. Canonical derivation, with every intermediate factor written
      out, is the `A` entry of the vitd_model.py module docstring; it is not
      restated here.
    source: >-
      Young et al. 2021, PNAS 118:e2015867118, Fig. 4B -- the FULL-BODY arm at
      85% BSA, three lamps, regressions of delta-25(OH)D3 on ERYTHEMAL SED not
      forced through zero: UV6 4.97 (n=10), Arimed B 3.18 (n=19), PUVA 1.99
      (n=11). Range midpoint 3.48 nmol/L per SED. Independently cross-checked
      against the n-weighted pooled FB arm (Table 1, n=40): 34.6 -> 70.7 on a
      cumulative 10 SED = 3.61 per SED, 3.7% above the midpoint, so the two
      readings of "midpoint" agree.
    derivation: >-
      A is set so the model's MARGINAL yield for one 1 SED exposure equals
      3.48 nmol/L under the study's own conditions (FST II, exposed_bsa 0.85,
      D = 34.6, SC = 0, untanned, E_source = 1.89). Reproduced by
      vitd_validation.young2021_A_anchor() and pinned by
      tests/test_vitd_model.py::TestYoung2021AAnchor.
    status: >-
      CENTRE OF A WIDE, SOURCE-DEPENDENT RANGE, NOT A MEASURED CONSTANT. Read
      3.114 as the centre of roughly 2.9-5.1. Young's three FB slopes span 2.5x
      and that spread is the paper's OWN headline finding -- SED is a poor
      spectral predictor of vitamin D synthesis. Pairing each arm with its own
      E_source from SOURCE_CALIBRATION_TABLE gives A = 2.90 (Arimed B) and
      A = 5.06 (UV6): a 1.74x disagreement, and in the WRONG ORDER, since those
      E_source values predict UV6 slightly weaker than Arimed B while Young
      measures it 56% stronger.
      WHAT THE OLD 2.353 WAS: it preserved a 1.27 nmol/L rise for 1 SED in
      untanned FST III at 35% BSA, D = 25, computed at K_const = 0.33. That
      reference stopped being reproducible when K_const moved to 0.98 on
      2026-08-17 (the same expression now returns 1.11), so 2.353 was an
      ORPHANED constant before this change.
      AND THE GAP THAT MOTIVATED THIS WAS PARTLY SPECTRAL, NOT BIOLOGICAL: the
      "~1.85 vs 2.0-5.0" figure was computed at the DEPRECATED E_source = 1.00.
      At the current solar default the incumbent A already yielded 2.63, i.e.
      already inside Young's band. This is a x1.32 move, not the x1.5-1.9 the
      pre-2026-08-16 framing implied.
    dark_skin_flag: >-
      REQUIRED AT POINT OF USE (standing_directives.dark_skin_priority). Young
      2021 is FST I-II ONLY (n = 75; 6x I, 69x II, ZERO FST III-VI) and its
      authors explicitly disclaim generalisation: "The results from this study
      only apply to FST I/II". A is applied at every FST, so using it for
      FST V-VI is a LIGHT-SKIN EXTRAPOLATION. Mitigated but NOT removed by the
      fact that the between-FST gradient (K_const) is anchored separately on
      matched-dose FST V data, so what is extrapolated is the overall LEVEL and
      not the skin-type gradient. Any absolute 25(OH)D prediction for FST V-VI
      must carry this flag.
    consequence: >-
      Farrar 2013 (FST V -- the ONLY dark-skin quantitative check in the suite)
      moves FAIL -> PASS: delta +8.7 -> +11.2 against an observed +21.7, band
      10-35. Bogh 2012 stays PASS: +48.0 -> +51.6 against +55.8, band
      45.8-65.8. Karppinen 2017 passes in the DEFAULT feedback mode, so its
      experimental-mode override was removed. Required validation 8/10 -> 10/10.
      It also RAISES synthesis per SED and therefore partially offsets the
      K_const feasibility result; see phase4_results_2026_08_18.
    not_covered: >-
      A cannot reproduce Young's FB protocol END-TO-END. Simulating the actual
      5 x 2 SED protocol needs A ~ 8.3 (Arimed B) to reach the observed +38.6,
      and the 3.7%-BSA arms need more still; the model under-predicts Young's
      absolute rises by 2.7x (FB) to 6.2x (PB) at any A that keeps Bogh 2012
      and Farrar 2013 in band. Young 2021 and Bogh 2012 are MUTUALLY
      INCOMPATIBLE inside this dose-response structure: Bogh delivered ~6.7x
      Young's D3-effective dose from a LOWER baseline and produced only 1.45x
      the rise. This calibration matches Young's per-SED SLOPE, which is what
      the approval asked for; it does not resolve that conflict and NO value of
      A can. Young's own within-study BSA contrast (85% vs 3.7% BSA, 3.28x
      response for a 23x area ratio) also implies BSA_EXP ~ 0.38 against the
      model's 0.50 -- RECORDED, NOT ACTED ON.

  feedback_mode:
    approved_by: User (repository owner)
    approval_date: 2026-08-17
    change: >-
      'linear' -> 'biphasic'. Phase 4 item A2, implemented 2026-08-18. The hard
      synthesis ceiling max(0, 1 - D/D_max) is WITHDRAWN as the default and
      replaced by a saturating form. Full reasoning and the adopted expression
      are in the vitd_model.py module docstring, feedback_mode entry.
    source: >-
      Scholze et al. 2026, Commun Med 6:105. With bimonthly sampling they
      report that conversion of cutaneous D3 to plasma 25(OH)D3 is efficient at
      low 25(OH)D3 and "decreases markedly" above an inflection at 56 nmol/L.
      Implemented as vitd_physiology.hydroxylation_efficiency.
    why_the_linear_form_went: >-
      It asserted that cutaneous synthesis STOPS OUTRIGHT at D = D_max. No such
      switch exists -- 25(OH)D homeostasis is exerted downstream, on
      1,25(OH)2D, by CYP24A1 induction and substrate-driven catabolism, the
      latter already carried by the state-dependent k_decay_D. AND D_max = 150.0
      never had a source: it is NOT in Bogh 2010, and PMID 19812604's observed
      maximum was 116 nmol/L. This was a structural bug fix as much as a
      calibration.
    estimation_flags: >-
      [ESTIMATE] D_inflect = 56.0 is an OUTPUT of a breakpoint fitted on the
      vitamin D3 axis, not a regressor, so it carries that breakpoint's own
      (unpublished) width.
      [CHOICE] n = 2.0 is NOT fittable from a single reported breakpoint. It is
      chosen as the gentlest integer knee: g = 0.5 at the inflection, 0.80 at
      half of it, 0.20 at twice it. g(D) is never exactly zero, which is the
      entire point of the change.
    rejected_alternative: >-
      feedback_mode='saturating', g(D) = exp(-ln2 * D / D_half_feedback),
      already existed and was used only inside the Karppinen check. Rejected on
      two grounds. (1) Its scale parameter has no source: the default 50.0 is
      unattributed and the 90.0 used in the Karppinen check was FITTED to
      Karppinen, so adopting it would have made that check CIRCULAR. (2) An
      exponential is at its steepest fractional decline as D -> 0, which
      contradicts Scholze's finding that hydroxylation is EFFICIENT below the
      inflection. Measured cost of adopting it anyway, at the A the Young 2021
      anchor then requires (3.641): the Karppinen check FAILS. Mode retained
      unchanged for sensitivity work.
    consequence: >-
      REPORTED IN FULL BECAUSE IT MOVES THE HEADLINE. The interval optimum
      under net_final_D_change_per_SED (FST III, 1 SED, 84 d, D0 = 25) goes
      3 d -> 5 d and the within-5%-of-peak band goes [2,3,4] -> [3,4,5,6].
      DECOMPOSED: the feedback form ALONE (biphasic at the old A) leaves the
      FST III optimum at 3 d; the A recalibration ALONE (linear at A = 2.930)
      also leaves it at 3 d. The shift to 5 d is their INTERACTION -- more
      synthesis per session raises steady-state D, which then sits further up
      the feedback curve. The optimum stays graded by pigmentation and gets
      SHORTER with darker skin: FST I-II 5 d, III 5 d, IV 4 d, V-VI 2 d
      (incumbent 3/3/3/2/2/1 d). Interval ORDERING is near-invariant (Spearman
      rho 0.964-0.999 across FST II/III/V/VI); it is the ARGMAX that moves. So
      "recalibrating A leaves scheduling rankings unchanged" is TRUE for the
      ordering and FALSE for the reported optimum.
    correction_to_an_earlier_claim: >-
      run_all.py section 17 said the interval ordering "comes from the
      (1 - D/D_max) feedback term". That is now MEASURED to be too specific.
      The ordering comes from having a DECREASING feedback factor at all: at
      the incumbent A the argmax is 3 d under linear, biphasic and both
      saturating variants alike.
    d_max_status: >-
      D_max = 150.0 is NOT deleted -- 'linear' and 'power' still read it and
      vitd_sensitivity/scripts still sweep it -- but it is OUT OF FORCE in the
      default model. `D_max_override=` is INERT unless feedback_mode is
      explicitly set to 'linear' or 'power'. ANY sensitivity result reporting
      D_max as influential is describing a NON-DEFAULT configuration.

  K_ATTEN:
    approved_by: User (repository owner)
    approval_date: 2026-08-21
    change: >-
      REINSTATED AS ACTIVE CALIBRATED PARAMETER, 2026-08-21 (user-approved).
      Value set to 0.34, anchored to Matsuoka 1990 (PMID 2165512, n=7 within-subject
      tanned-vs-untanned arm synthesis) with biphasic feedback g(D) deconvolved
      (residual melanin attenuation 6.6%, K_ATTEN = 0.34; plausible range across
      feedback forms: [0.34, 1.00]). Removed from RETIRED_PARAMETERS.
      UPDATED 2026-08-25: M_TAN_HEADROOM moved 0.20 -> 0.238 (Ravnbak 2008) and
      derive_K_ATTEN's excess_M now reads M_TAN_HEADROOM live instead of a
      hardcoded 0.20, so K_ATTEN moved with it to 0.288972 (plausible range
      [0.288972, 0.838389]). The residual melanin attenuation percentages
      (6.6%/18.1%) are unchanged -- they do not depend on excess_M.
    mechanism: >-
      exp(-K_ATTEN * max(0, M - M_baseline)) is evaluated on every session.
      A full tan (excess_M = M_TAN_HEADROOM = 0.238) provides 6.6% attenuation
      at K_ATTEN = 0.288972 and 18.1% at K_ATTEN = 0.838389.
    source: >-
      Matsuoka et al. 1990 (J Lab Clin Med 116:87-90, PMID 2165512). Within-subject
      tanned-vs-untanned arm synthesis with biphasic feedback deconvolved.
    derivation: vitd_calibration.derive_K_ATTEN('biphasic')
    status: >-
      ANCHORED TO MATSUOKA 1990 DECONVOLUTION. Deconvolving baseline feedback
      (tanned baseline 92.1 nmol/L vs untanned 56.2 nmol/L) under the default biphasic
      mode yields residual melanin attenuation of 6.6%, implying K_ATTEN = 0.288972
      (range [0.288972, 0.838389]) at the live M_TAN_HEADROOM = 0.238.
    not_covered: >-
      Matsuoka 1990 is n=7. K_ATTEN is collinear with K_SC; this calibration provides
      the evidence-based lower bound from the only within-subject trial in existence.
      Across annual scheduling, this parameter swings steady-state 25(OH)D by ~0.3-1.0%.

  E_SOURCE_SOLAR_DEFAULT:
    approved_by: User (repository owner)
    approval_date: 2026-08-16
    change: >-
      Sun-facing entry points move from an implicit E_source = 1.00 to
      'solar_summer' = 1.89. New constant vitd_model.E_SOURCE_SOLAR_DEFAULT.
      Affects minutes_for_target() when params is not supplied, and
      vitd_analyses.analysis_sun_exposure. Roughly HALVES every recommended
      minutes figure for sun.
    source: >-
      Webb, Alghamdi, Kift & Rhodes 2021, Endocrine Connections 10:R248-R266,
      Table 1: VDE:EE for sun = 1.89 (Manchester summer), 2.01 (NZ summer),
      1.22 (NZ winter). Full text in Papers_and_Datasets/.
    derivation: >-
      None -- this is a direct table read, not a fit. The change is better
      characterised as removing an artefact than as calibrating: 1.00 was the
      backward-compatibility default when E_source was introduced under audit
      tag [C2] ("so all existing scenarios are unchanged") and was later
      retro-labelled "solar broadband reference". No solar spectrum has
      VDE:EE = 1.00; Webb's lowest published sun value is 1.22, in NEW ZEALAND
      WINTER. The old default therefore under-weighted solar vitamin D
      effectiveness by ~1.9x at every latitude and season.
    status: >-
      APPROVED WITH A KNOWN COST, ACCEPTED EXPLICITLY. See not_covered.
      Independent evidence that the direction is right: against the only
      external absolute anchor in the repo (Webb/Kift 2018, ~9 min/day for
      white Caucasians) the model moves from 49.7 min to 25.3 min. Still
      2.8x too long, but 2x closer.
      A is NOT refitted and does not need to be: it is anchored by Bogh 2012,
      which runs at the TL-01 E_source of 2.44 and passes to 0.2 nmol/L. The
      "1.27 nmol/L per SED" figure sometimes described as A's calibration
      target is computed FROM the parameters in vitd_validation.py and is a
      regression test, not an external anchor.
    not_covered: >-
      SOLAR E_source IS NOT IDENTIFIABLE FROM THIS REPO'S SOLAR CHECKS, and this
      approval does not pretend otherwise. Every solar validation supplies an
      ASSUMED daily SED that nobody measured (NHANES _SIM_SED = 0.333; Kift
      0.333 3x/week), so that assumed dose absorbs any E_source change exactly.
      Measured consequence: NHANES Part B drops from 6/6 to 4/6. The assumed
      dose was deliberately NOT retuned to keep the check green -- doing so
      would be calibration through an ungated back door. Closing this properly
      requires a real ambient UV climatology so the dose becomes derived rather
      than assumed; that is FUTURE WORK, recorded as 'Open decisions' item 12(b)
      in MODEL_AND_EVIDENCE.md. Until then the 1.89 value is a literature read
      applied on top of unmeasured doses, and absolute 25(OH)D predictions for
      solar scenarios should be read with that in mind.
      Also not covered: the seasonal variation of solar VDE:EE (1.22-2.01 across
      Webb's three entries) is NOT modelled -- one summer value is used
      year-round.

  VERNEZ_GEOMETRY_MODEL:
    approved_by: User (repository owner)
    approval_date: 2026-08-16
    change: >-
      vitd_physiology.personal_geometry_factor: the elevation-only form
      0.15 + 0.30*cos(theta) is WITHDRAWN and replaced by Vernez 2015 Eq. 1,
      exposed as vernez_exposure_ratio(vis_percent, sza_deg). The 0.35 Cockell
      scalar remains the default when sky visibility is unknown, so DEFAULT
      MODEL OUTPUT IS UNCHANGED by this entry.
    source: >-
      Vernez, Milon, Vuilleumier, Bulliard, Koechlin, Boniol & Dore 2015,
      J Expo Sci Environ Epidemiol 25:113-118, doi 10.1038/jes.2014.6,
      Equation 1. Full text now in Papers_and_Datasets/. This CLOSES data
      request #13, which this repository twice recorded as "paywalled,
      confirmed unobtainable" -- exactly the failure mode CLAUDE.md warns about.
    derivation: >-
      None -- coefficients transcribed verbatim from the paper and pinned by
      tests/test_physiology.py::TestPersonalGeometryFactor against two values
      computable from the printed equation.
    status: >-
      SOURCED, replacing an acknowledged PLACEHOLDER whose cited support was
      found on full-text read to contradict it (gap 26, assumption A23).
      Vernez fit R^2 = 0.988 (n=8515, 3 postures), held out R^2 = 0.972
      (n=5672, 2 unseen postures). The substantive finding is that sky
      visibility moves the ratio ~11.6x while solar zenith angle moves it
      ~1.18x -- the withdrawn form modelled the small term and had no posture
      argument at all.
    not_covered: >-
      (1) Vernez ER assumes UNPROTECTED SKIN, NO SHADE and CONTINUOUS EXPOSURE.
      The authors say so and show their model overpredicting farmers' faces
      (15-55% modelled vs 11-15% measured). These are ceilings for deliberate
      unshaded exposure, NOT interchangeable with behaviourally-averaged
      dosimeter numbers such as Cockell's 0.35.
      (2) Supplementary Table S1 (typical Vis by posture and body site) is NOT
      in the obtained PDF -- data request #13b. The VIS_PRESETS_PLACEHOLDER
      values in vitd_physiology.py are BACK-DERIVED by inverting Eq. 1 against
      the mean ERs printed in the Results text. They are consistent with the
      paper's outputs but are NOT its inputs and must never be cited as such.
      Any user-facing number derived from them must be labelled a placeholder.
      (3) Geometry x BSA are coupled and the model treats them as independent:
      which sites are uncovered sets BOTH the exposed area and the mean ER.
      Not addressed.

  PERSONAL_DOSE_GEOMETRY_FACTOR:
    approved_by: User (repository owner)
    approval_date: 2026-08-20
    change: >-
      value UNCHANGED at 0.35; a THIRD, measured, activity-specific and
      elevation-resolved route is added ALONGSIDE it. New in vitd_physiology:
      SCHMALWIESER_2025_JOGGING_ERTA (7 body sites x 5 solar elevations),
      ACTIVITY_ERTA_TABLES, activity_erta(), activity_erta_interval(); and new
      `activity=` / `body_site=` arguments on personal_geometry_factor(),
      vitd_objectives.sed_from_minutes() and minutes_for_target(). Nothing
      selects the new route unless a caller names an activity, so DEFAULT MODEL
      OUTPUT IS UNCHANGED by this entry.
    source: >-
      Schmalwieser, Danhel, Schmalwieser, Reimoser, Rummel, Loy, Heydenreich &
      Weihs 2025, "Erythemal UV radiation exposure during jogging", Photochem
      Photobiol, doi 10.1111/php.14114. Full text in
      Research_Papers/Schmalwieser_2025_Photo.pdf. ONE volunteer, 12 SunSaver
      dosimeters at 7 sites, cloud-free Vienna (48.247 N), 18-19 June 2025,
      solar elevations 20/30/40/50/60 deg, four cardinal-direction runs averaged
      per elevation. Corroborated on the shoulder finding, and CONTRADICTED on
      magnitude, by Weihs et al. 2013 (Photochem Photobiol 89:1004), also in
      Research_Papers/ -- see not_covered.
    derivation: >-
      None -- no fit. The paper prints no ERTA table, so Figure 5 was DIGITIZED
      from the published raster at 4x zoom (read precision ~+/-0.02, rounded to
      2 dp, already finer than the authors' own +/-15%) and every series was
      then cross-checked against the values the paper states in prose:
      shoulders "0.8 with no dependence on solar elevation" (table mean 0.808,
      spread 0.02); forearms and forehead "0.5 and 0.3" (0.484, 0.320); upper
      arms, calves, nape and thighs "starting with a value of 0.5 at 20 deg down
      to around 0.4 and 0.3 at 60 deg" (in that site order, 0.55/0.50/0.50/0.49
      at 20 deg and 0.35/0.42/0.35/0.34 at 60 deg). Pinned prose-fact by prose-fact in
      tests/test_physiology.py::TestSchmalwieser2025JoggingERTA. If the numbers
      are ever disputed, re-digitize Figure 5 -- do not re-fit.
    status: >-
      SOURCED AND MEASURED, BUT DELIBERATELY NOT PROMOTED TO THE DEFAULT, and
      that non-promotion is the substance of this approval. Every jogging site
      ERTA (0.29-0.82) sits ABOVE the 0.35 Cockell scalar, which looks like a
      case for raising it. It is not, for two reasons that only appear once both
      papers are read. (1) DIFFERENT REGIMES: Schmalwieser measures continuous,
      deliberate, unshaded exposure in one posture; Cockell's 0.35 is a
      behaviourally-averaged dosimeter number, and this repo already refuses the
      same substitution for Vernez ER (see VERNEZ_GEOMETRY_MODEL.not_covered).
      (2) THE OTHER DIRECTION EXISTS: Weihs 2013 reports ERs "between 0.05 and
      1" across six body sites and four activities, all in continuous direct sun
      at 46-64 deg elevation -- a 20-fold spread that straddles 0.35 in BOTH
      directions. Its walking shoulders:forehead contrast is 1.70 against 2.52
      for jogging over the same elevations, and the site ORDERING itself changes
      with posture (lower legs lead while lying and sitting up, shoulders while
      walking). ACTIVITY AND POSTURE DOMINATE. The measured spread across
      activities and sites is wider than the distance from 0.35 to either study,
      so no single measured value replaces a fallback whose whole job is to
      answer when the activity is unknown.
      [CORRECTED 2026-08-20] Clause (2) previously cited per-site walking means
      digitized from Weihs's Figure 6 (an unweighted "~0.26", lower leg "0.10",
      and a claimed 5x calves disagreement). That figure cannot be read to that
      precision in the copy held here and the digitization is WITHDRAWN; the
      restatement above uses only ratios and ranges the paper prints as text.
      The approval, the conclusion and the value are unchanged -- only the
      evidence cited for them. Also corrected in the first sentence: the jogging
      range is 0.29-0.82, not 0.32-0.82 (the forehead series reaches 0.29).
      Pinned by
      tests/test_physiology.py::TestPersonalGeometryFactor::test_flat_fallback_is_still_0_35_after_the_2025_papers
      so it cannot be quietly undone in either direction.
    double_counting_with_E_source: >-
      RESOLVED BY CONSTRUCTION, WITH ONE NAMED RESIDUAL. The risk was that ERTA
      and the vitamin-D-to-erythema ratio (SOURCE_CALIBRATION_TABLE, Webb 2021)
      both depend on solar zenith angle, so multiplying them might apply the
      same physics twice. They do not: ERTA is erythemal-on-body over
      erythemal-on-horizontal, both measured with CIE-erythema-matched
      detectors, so the action spectrum CANCELS and only the angle between skin
      and sky survives; VDE:EE is two different action spectra applied to the
      SAME irradiance, so only spectral composition survives. Geometry and
      spectrum, orthogonal, both legitimately elevation-dependent.
      THE RESIDUAL, NOT CORRECTED: E_source is measured on a HORIZONTAL plane
      while ERTA moves the dose onto a TILTED surface seeing a different
      direct:diffuse mix, which differs in UVB:UVA. The correction is
      VDE:EE(site) / VDE:EE(horizontal) and NO source in this repo measures it
      -- Webb 2021 reports horizontal only, and Schmalwieser used erythemal
      detectors, never a spectroradiometer at the skin. Second-order and carried
      by any absolute D prediction that uses activity ERTA. Written out in full
      above vitd_physiology.activity_erta, with the operational rule: never let
      a falling ERTA at high sun be "compensated" by a rising VDE:EE. They are
      not offsetting corrections to one quantity.
    not_covered: >-
      (1) n = 1. ONE subject, ONE posture (the textbook jogging forward lean),
      ONE city, ONE ground albedo (asphalt/grass, 5-11%). The +/-15% interval
      from activity_erta_interval() is MOUNTING uncertainty only; between-subject
      variance is unmeasured and larger.
      (2) NOT TRANSFERABLE BETWEEN ACTIVITIES. activity_erta() raises on any
      activity it has no table for rather than substituting jogging. Weihs et
      al. 2024 (Atmosphere, cycling, SZA to 65 deg) would be the obvious next
      acquisition and is still not in the repo.
      (3) ABOVE 60 DEG IS REFUSED, NOT EXTRAPOLATED. The authors state the
      results "may not be necessarily applicable at higher solar elevations as
      found at subtropical and tropical latitudes" -- exactly where four of the
      seven series are still falling when the data runs out. activity_erta()
      clamps with a warning, which under dark_skin_priority matters: the
      latitudes this table cannot reach are disproportionately the ones where
      FST V-VI populations live.
      (4) ERYTHEMAL, NOT VITAMIN-D WEIGHTED. See double_counting_with_E_source.
      (5) 'mean_measured_sites' IS NOT A WHOLE-BODY RATIO. It counts the
      shoulders -- ~2% of BSA and the most exposed site -- equally with
      everything else, and represents the trunk not at all, because the sternum
      was tested and dropped as a mounting position. A real whole-body number
      needs the BSA weighting in vitd_exposure.py over the sites a person
      actually leaves bare. The geometry x BSA coupling flagged in
      VERNEZ_GEOMETRY_MODEL.not_covered (3) is NOT closed by this entry.
      (6) WEIHS 2013 CONTRIBUTES NO PREDICTIVE CONSTANT, AND THE REASON CHANGED
      ON 2026-08-20. It is NOT that the paper contradicts itself -- this entry
      previously said that, on the strength of a Figure 6 digitization that has
      since been withdrawn as unreadable. The paper's Results prose and its
      Discussion agree with each other, and are transcribed into
      vitd_physiology.WEIHS_2013_PROSE_SITE_RATIOS. The real limitation is that
      the prose gives RATIOS BETWEEN SITES ONLY: no absolute ER for any single
      site, and no elevation resolution (all six sequences fall in one 46-64 deg
      band, reported as single random-orientation means). An
      ACTIVITY_ERTA_TABLES entry needs absolute, elevation-resolved values, so
      scaling these ratios against an assumed anchor site would invent the one
      number the paper never states. That is a calibration decision, not a
      transcription, and it is NOT approved here. See open_items below.
    consequence: >-
      NONE to any reported number. No default changed, no existing call site
      passes activity=, and the full suite is green (558 tests on 2026-08-20;
      567 after the Weihs prose-ratio transcription added
      tests/test_physiology.py::TestWeihs2013ProseRatios, still all passing).
      What changed is
      what a caller CAN ask for: a jogger at a known solar elevation can now get
      a measured, site-resolved geometry ratio with a published uncertainty
      interval instead of a behaviourally-averaged scalar. Worked contrast at
      40 deg elevation: shoulders 0.82, across-site mean 0.51, forehead 0.34,
      against the flat 0.35 -- i.e. up to 2.3x the dose per minute depending
      only on WHICH SKIN IS BARE.
    open_items:
      # Forward-looking. NOT approved -- filed so a later session finds the
      # condition and the required approval step instead of re-deriving both.
      - marker: WEIHS-2013-VOR
        date: 2026-08-20
        status: BLOCKED_ON_SOURCE
        blocked_on: >-
          The Weihs et al. 2013 PDF in Research_Papers/ is the "Accepted
          Article" early-view proof and prints its own warning about
          "differences between this version and the Version of Record". Its
          Figure 6 is a grouped range-bar chart -- six sites x four activities,
          min-max bars with a black dot for the mean, series separated only by
          grayscale hatching, shoulders and lower legs hatched identically in
          opposite directions -- and at that resolution it CANNOT be read to
          per-site precision. This is a legibility limit of the copy held, not
          a defect in the paper. The repository owner may be able to obtain the
          Version of Record.
        what_unblocks_it: >-
          A VoR that renders Figure 6 in colour, at higher resolution, or ships
          a supplementary data table with the per-site means.
        then_do: >-
          Re-digitize Figure 6 and attempt a full per-site quantitative entry in
          vitd_physiology.ACTIVITY_ERTA_TABLES for 'walking' / 'sitting' /
          'lying' / 'sitting_up', cross-validating every series against
          WEIHS_2013_PROSE_SITE_RATIOS exactly the way Schmalwieser 2025's
          Figure 5 was cross-validated against its Results text. The prose
          ratios are the acceptance test: a digitization that does not
          reproduce walking shoulders/forehead = 1.70, sitting thighs/forehead =
          1.60, sitting-up lower_legs/forehead = 2.15 and lying
          lower_legs/forehead = 1.55 has been misread again.
        approval_required: >-
          YES. A new predictive per-activity ERTA table is a CALIBRATION, not a
          documentation fix, and needs its own parameter_approvals entry. It
          must NOT be added on the strength of this open item. Anchoring the
          existing ratios to an assumed absolute ER, without a VoR figure, is
          the specific thing this item exists to prevent.
        grep_for: >-
          WEIHS-2013-VOR. The other end of this marker is the [TODO 2026-08-20]
          block in vitd_physiology.py, section "WEIHS et al. 2013 --
          PROSE-SOURCED SITE RATIOS".
    gap_26_status: >-
      PARTIALLY CLOSED, NOT CLOSED. The elevation dependence withdrawn on
      2026-08-16 as unsourced now HAS a source -- for one activity, at seven
      sites, from one subject. Schmalwieser & Siani 2018's actual objection was
      coverage ("for most activities, we still lack the possibility to predict
      the UV exposure of exposed body sites under any condition because ERTAs
      are not fully available") and that objection stands in full: what exists
      is still piecemeal per-activity curves, not a general model. The comment
      block in vitd_physiology section 2b was updated to say exactly this and
      must not be upgraded to "closed" on the strength of one activity.

# Live status. Regenerate with: PYTHONIOENCODING=utf-8 python3 run_all.py
current_validation:
  required: "9 / 10"
  warning_only: "2 / 3"
  total: "12 / 15"
  last_verified: 2026-08-17
  note: >-
    REFRESHED 2026-08-17 from an actual `PYTHONIOENCODING=utf-8 python3
    run_all.py` run. The previous block (2/2, 13/14, last_verified 2026-08-09)
    was stale: it predated the Kallioglu 2024 held-out check being added, so
    the denominators had moved. No parameter changed between those two runs.
    Sanity 3 moved from FAIL to PASS on 2026-08-09 by repairing the guard, NOT
    by changing any parameter -- K_ATTEN remains 0.00. See pending_approvals
    below: half of that repair still needs sign-off, and the repaired check is
    a drift guard rather than evidence.
  failing:
    - name: "NHANES K_ATTEN seasonal amplitude"
      detail: >-
        Model White:Black amplitude ratio 0.17 vs observed 1.449 (inverted).
        Diagnosed: NHANES baselines differ by group (White ~62.5, Black ~40.0
        nmol/L), and the baseline-dependent terms predict a LARGER seasonal
        rise for the darker-skin group. Two contributors, in order: the
        Datta 2017 state-dependent clearance t_half = 2953 * D**-0.72, giving
        daily clearance proportional to D**1.72, so the higher-baseline group
        clears several-fold faster; and the linear (1 - D/D_max) feedback term.
        CORRECTED 2026-08-09: an earlier version of this entry attributed the
        inversion partly to the melanin penalty being absent. That is wrong.
        Swept across K_ATTEN in [0.00, 1.00] the model ratio stays at ~0.17 --
        under these protocols the facultative excess is at most ~0.035, so
        exp(-K_ATTEN * dM) spans only 1.000-0.966 and cannot move a ratio by a
        factor of eight. This is a feedback/clearance-SHAPE problem and is
        independent of K_ATTEN. Do not archive it -- it is the most informative
        feedback-shape diagnostic available, and per the D_max negative result
        (MODEL_AND_EVIDENCE.md section 7, next-step 3) long-horizon seasonal
        data is the ONLY kind that can identify D_max at all.


pending_approvals:
  # Changes made in the working tree that are NOT covered by the file-level
  # approval above, because they postdate it.
  - name: "Sanity 3 acceptance band 10-30% -> 0-10%"
    date: 2026-08-09
    status: NEEDS_VERIFICATION
    what: >-
      sanity_photoadaptation_reduction in vitd_validation.py received two edits
      at once. (1) The test point moved from a hardcoded M = 0.70 to
      p.M_ceiling(fst). That is a BUG FIX and is not gated: M = 0.70 is above
      the structural ceiling of 0.41 for FST III, so the check was evaluating a
      state the melanin ODE cannot produce at any dose. (2) The acceptance band
      was changed from 10-30% to 0-10%. That is NOT a bug fix -- it changes what
      the model is required to satisfy -- and is what this entry gates.
    consequence: >-
      With K_ATTEN = 0.00 the measured reduction is 0.0%, which sits inside the
      new band by construction. The check now crosses its 10% ceiling only at
      K_ATTEN > 0.53, so it is a one-sided guard against upward drift, not
      evidence that photoadaptation reduces synthesis. It should not be counted
      as literature support, and the 9/10 figure should be read knowing one of
      the nine cannot fail at the current parameter value.
    note: >-
      No parameter changed. K_ATTEN remains 0.00, and the proposal to raise it
      to 0.40 was rejected: it would have moved final D by <0.6% while flipping
      the reported score, and the value was inconsistent with the model's own
      default feedback_mode = 'linear' (whose Matsuoka deconvolution gives
      ~1.00, which FAILS even the widened band).

  - name: "M_TAN_HEADROOM 0.20 -> 0.238 (melanin ceiling)"
    date: 2026-08-25
    status: APPROVED
    approved_by: User (repository owner), 2026-08-25
    value_adopted: 0.238
    value_rationale: >-
      0.238 is the largest tan Ravnbak actually measured (dM = 0.237724 exactly,
      rounded up at the third decimal), so the ceiling accommodates every
      observed tan. It sits inside the free-fit range [0.230880, 0.268013]
      spanned by the three candidate scale maps. Chosen by the repository owner
      in preference to the power-map point estimate 0.230880, which would have
      left the two largest Ravnbak tans unrepresentable.
    derivation: scripts/fit_melanin_kinetics.py
    sources:
      - >-
        Ravnbak MH, Philipsen PA, Wulf HC. Skin pigmentation kinetics after UVB
        exposure. Acta Derm Venereol 2008; 88:223-228. PMID 18480919.
        Table II (absolute pigmentation-% increase, 6 and 12 exposures at
        0.8/0.6/0.4 MMD) and Table I (per-FST pre-exposure pigmentation-% and
        single-exposure MMD in SED).
      - >-
        Miyamura Y, Coelho SG, Schlenz K, et al. The deceptive nature of UVA
        tanning versus the modest protective effects of UVB tanning on human
        skin. Pigment Cell Melanoma Res 2011; 24(1):136-147. PMID 20979596.
        Used as the UVA negative control and as an out-of-sample check; NOT
        pooled into the fit.
      - >-
        Ravnbak MH, Philipsen PA, Wulf HC. Skin pigmentation kinetics after
        exposure to ultraviolet A. Acta Derm Venereol 2009; 89:357-363.
        NEGATIVE CONTROL ONLY -- see not_covered.
    what: >-
      M_TAN_HEADROOM is the facultative tanning headroom above constitutive
      pigment, on the model 0-1 melanin index. It is currently 0.20 and is
      flagged [PRIOR] in vitd_model.py with no independent source; the stated
      rationale is structural ("keeps FST I-III behaviour close to the old
      global 0.95 ceiling while making tanning monotone for every FST").
      Ravnbak 2008 Table II, converted onto the model index through a map
      anchored on the four per-FST pre-exposure pigmentation-% values, gives
      measured tans of dM = 0.192 to 0.238. Several of those EXCEED the entire
      shipped headroom, so the model cannot represent Ravnbak tans at any
      alpha. Refitting with headroom free returns 0.231 (power map), 0.265
      (quadratic) and 0.268 (linear), and the value is stable at 0.221-0.229
      across a four-decade profile of alpha.
    consequence: >-
      Raises the melanin ceiling reachable by tanning, which increases
      facultative self-shielding at high cumulative dose and therefore
      slightly reduces synthesis late in long protocols. Interacts with
      K_ATTEN (facultative attenuation, active at 0.288972). Downstream effect on
      headline numbers is NOT yet quantified -- run_all.py has not been re-run
      against this value.
    not_covered: >-
      This entry does NOT approve any change to alpha, alpha_by_FST,
      alpha_max or UV_halfmax. The same fit shows those are NOT IDENTIFIABLE
      from this evidence: profiling alpha from 0.0025 to 1.0 moves the weighted
      residual by under 25%, because Ravnbak used only two exposure counts
      (6 and 12) and the tan is already near plateau at 6. They stay PRIOR at
      their shipped values.
      It also does NOT approve pooling Ravnbak 2009 (UVA) into any melanin
      fit. Miyamura 2011 Table 1 shows UVA raises epidermal melanin content
      not at all (8.62 vs 9.03 a.u., NS) while producing a comparable visible
      tan; fitting the model ATTENUATING melanin to UVA reflectance data would
      credit the model with photoprotection that does not exist.

  - name: "SC_max_by_FST I-III 0.23 -> 0.24 (stratum corneum ceiling)"
    date: 2026-08-25
    status: APPROVED
    approved_by: User (repository owner), 2026-08-25
    derivation: scripts/fit_melanin_kinetics.py  (sec. 6)
    value_adopted: 0.24
    sources:
      - >-
        de Boer 2025 Supplementary Table S1. FP I-III stratum corneum
        5.6 -> 6.9 um, i.e. +23%. This was the sole basis for SC_max until now.
      - >-
        Miyamura Y, Coelho SG, Schlenz K, et al. Pigment Cell Melanoma Res
        2011; 24(1):136-147. PMID 20979596. Table 1: stratum corneum
        16.6 -> 20.7 um in FST II-III after 10 suberythemal UVB exposures over
        2 weeks, i.e. +24.6988%. Independent cohort, protocol and measurement
        method (histology of formalin-fixed biopsies vs de Boer's technique).
    what: >-
      Two independent studies now bracket the FST I-III stratum corneum
      thickening ceiling at +23% and +24.6988%. 0.24 sits between them. The
      midpoint is 0.238494; 0.24 was chosen by the repository owner as the
      round value inside the bracket.
    consequence: >-
      Slightly increases SC attenuation at full adaptation for FST I-III,
      reducing synthesis late in long protocols. FST IV-VI unchanged at 0.36.
      The SC_max scalar default (0.30) is unchanged and remains the I-III /
      IV-VI midpoint to within 0.0.
    not_covered: >-
      Does NOT tighten SC_max from prior to calibrated. Miyamura reports SEM
      with n=6 and did not measure vitamin D, so this corroborates MAGNITUDE
      only. CLAUDE.md still requires SC_max be flagged as an uncalibrated prior
      whenever absolute D predictions are presented.
      Does NOT extend to FST IV-VI: Miyamura enrolled FST II-III only, so the
      0.36 value still rests on de Boer alone. Per the dark-skin priority
      directive this is the gap that matters most and it remains open.
      Does NOT touch alpha_SC, k_decay_SC, K_SC or k_damage.

  - name: "beta provenance upgrade (NO value change)"
    date: 2026-08-25
    status: NOT_GATED
    derivation: scripts/fit_melanin_kinetics.py
    what: >-
      beta stays at ln(2)/56 per day. What changed is where it comes from.
      It was previously a stated guess ("a mid-range estimate compatible with
      Ravnbak 2008 if complete fading requires ~3 e-folding times",
      RESULTS.md:445). Ravnbak's Methods specify that "days to total fading"
      was produced by fitting a LINEAR regression to pigmentation at 1 week,
      2 months and 4 months and extrapolating to zero. That procedure is fully
      specified and therefore invertible: assuming exponential decay, sampling
      it on Ravnbak's timepoints, fitting OLS and taking the x-intercept
      reproduces their 132-175 d for any true half-life in roughly 40-70 d.
      The shipped 56 d sits near the middle of that band.
    not_covered: >-
      No point estimate is adopted. Ravnbak mixed 2-point and 3-point
      regressions in unreported proportion (2-point was used "when fading was
      completed at the 4 months control"), and that choice alone moves the
      inverted half-life from ~48 d to ~74 d. Quoting a single fitted beta
      would over-read the data. The manuscript status flag "VERIFIED" for beta
      should be softened to DERIVED with the 40-70 d range quoted.

standing_directives:
  # Cross-cutting instructions from the repository owner, 2026-08-17. These
  # govern HOW every entry below is to be executed, not any single parameter.
  dark_skin_priority:
    date: 2026-08-17
    directive: >-
      This is a DARK-SKIN-PRIORITY model. Where evidence exists for FST V-VI,
      prefer it. Where a number is derived from light-skinned participants and
      extrapolated to darker skin, FLAG IT EXPLICITLY at the point of use. Do
      not privilege UK/British-population data merely because it is abundant.
    known_light_skin_extrapolations:
      - >-
        Young 2021 revised vitamin D action spectrum: derived from FST I-II
        volunteers ONLY (n = 75, mean age 26.5). Verified 2026-08-17 by reading
        the full text in Research_Papers/. Any E_source derived from it is a
        light-skin extrapolation when applied to FST V-VI.
      - >-
        CIE erythemal weighting (which defines the UV Index itself) is anchored
        to light skin. Any ambient-UVI input path inherits this.
      - >-
        Webb 2018 'Colour Counts' (Nutrients 10:457) IS an FST V study, but at
        UK latitudes. Its FST V physiological targets are among the very few
        naturalistic dark-skin numbers in existence and are retained; its UK UV
        climatology is deprioritised as geographically narrow.
  grounding_requirement:
    date: 2026-08-17
    directive: >-
      Every number, formula and choice must be traceable to a printed source.
      Mark anything estimated, approximated or chosen with an explicit
      [ESTIMATE] or [CHOICE] tag at the point of use. Do not invent
      coefficients; report what a source does not provide rather than filling
      it in.

decisions_2026_08_17:
  # Direction decisions that are NOT parameter calibrations, recorded here
  # because they determine what the model reports.
  - name: "A1 melanin penalty -- DIAGNOSE FIRST, do not recalibrate yet"
    date: 2026-08-17
    decided_by: User (repository owner)
    status: DIAGNOSIS_IN_PROGRESS
    decision: >-
      Three independent sources say the between-skin-type penalty is 2-3x too
      weak (Webb/Kift 2.5-3.0x vs model 1.40x; Kallioglu VI:I 5.00x vs 1.62x
      and V:II 2.40x vs 1.43x; NHANES Part B within-change contrast). The owner
      explicitly chose NOT to change K_const or K_ATTEN yet, and to first
      quantify how much of the gap is OPTICAL (belongs in K_const/K_ATTEN) and
      how much is BEHAVIOURAL/EXPOSURE (belongs in a separate term).
    rationale: >-
      CORRECTED 2026-08-17, same day it was written. The original rationale
      recorded here said "Gap 23 establishes that Webb/Kift's 2.5-3.0x is not
      purely optical -- it bundles clothing, time outdoors and geography".
      THAT IS THE INVERSE OF WHAT GAP 23 SAYS, and gap 23 is explicitly a
      correction of that same belief. Webb/Kift's 2.5-3.0x is Farrar 2013
      simulated sunlight at matched ~35% BSA: lamp-based, matched-dose, NO
      behaviour. The original rationale also cited Kallioglu as "a pure
      simulation containing no behaviour" -- true, but irrelevant, because
      Kallioglu was withdrawn entirely on 2026-08-17 as an erythema MED table.
      THE DECISION TO DIAGNOSE BEFORE RECALIBRATING STANDS, on better grounds:
      the separation is measurable, and it was measured. Two independent
      routes -- within-study matched-dose lab trials (Felton 2016, Young 2020)
      and field personal-dosimetry inversion (Kift 2013, Darling 2013) --
      converge on an OPTICAL ratio of 1.7-2.7x, against an incumbent K_const
      delivering 1.26x and a behaviour-blind figure of 4.3-5.7x. Attributing
      the whole gap to pigment would overshoot every matched-dose measurement
      in existence.
    not_covered: >-
      No parameter value is approved for change by this entry. A separate
      approval is required once the diagnosis lands.
  - name: "A3 primary scheduling metric"
    date: 2026-08-17
    decided_by: User (repository owner)
    status: APPROVED_PENDING_IMPLEMENTATION
    decision: >-
      Primary: minimum dose/sessions required to REACH AND HOLD sufficiency --
      i.e. how little exposure is actually needed. gross_synth_per_SED is
      retained as a BACKGROUND/secondary metric only. Additionally requested: a
      formulation for best SED at least spacing and fewest sessions while
      accounting for skin-cancer risk.
    rationale: >-
      gross_synth_per_SED has no interior optimum (gap 19) -- it rises
      monotonically as dosing approaches zero, and at its reported 21-30 d
      'optima' final D is BELOW the starting baseline, a net loss. It cannot be
      the primary metric. MODEL_AND_EVIDENCE.md section 5.3 already recommended
      the minimum-sessions-to-hold-sufficiency formulation.
    not_covered: >-
      The tri-objective form (dose x spacing x cancer risk) is a NEW objective,
      not a re-weighting of an existing one. The FST susceptibility term in
      vitd_physiology.cancer_risk remains an order-of-magnitude prior and is NOT
      anchored by Elwood & Jopson, so cross-skin-type comparisons of risk index
      VALUES stay unreliable even though interval and minutes columns do not
      depend on it.

a1_diagnosis_result_2026_08_17:
  # OUTCOME of the "diagnose first" decision above. The diagnosis is COMPLETE.
  # Reproduce with: PYTHONIOENCODING=utf-8 python3 scripts/fst_gap_decomposition.py  (~12 min)
  status: DIAGNOSIS_COMPLETE_CALIBRATION_APPROVED
  approved_by: User (repository owner)
  approval_date: 2026-08-17
  finding: >-
    The model's FST V:II OPTICAL ratio should be 1.7-2.7x. Two INDEPENDENT
    routes converge there: within-study matched-dose lab trials (Felton 2016,
    Young 2020) give 1.5-2.9x; field personal-dosimetry inversion with
    behaviour removed (Kift 2013, Darling 2013) gives 1.7-2.7x. The incumbent
    K_const = 0.33 delivers 1.26x -- too weak by 1.4-2.1x, NOT by the 2-3x that
    MODEL_AND_EVIDENCE.md gap 22 claimed. Attributing the whole observed gap to
    pigment would require 4.3-5.7x, above every matched-dose measurement that
    exists.
  sign_error: >-
    SHARPEST RESULT, and it is a direction error rather than a magnitude one.
    Felton et al. 2016 (Br J Dermatol 175:1320-1328) is within-study, matched
    dose (1.3 SED x3/wk x6 wk), matched BSA (~35%), same cabinet both arms:
    phototype II 36.5 -> 54.3 (+17.8), phototype V 17.2 -> 25.5 (+8.3),
    observed ratio 2.14x. AT THE INCUMBENT K_const THE MODEL PREDICTS FST V
    GAINING MORE THAN FST II (0.96x) -- the opposite direction. Mechanism:
    FST V's lower baseline buys more headroom under the (1 - D/D_max) feedback
    term than the incumbent melanin term removes. Verified from the paper's own
    abstract; note its PDF text layer drops decimal points ("365" = 36.5).
  three_lines_collapsed: >-
    The "three independent converging lines" of gap 22 do not survive audit.
    (1) Kallioglu 2024 WITHDRAWN -- its Table 3 is an erythema MED table and its
    published minutes are exactly 5.05 * MED/200. (2) Webb/Kift COUNTS ONE
    NUMBER TWICE -- Webb 2018 set FST V's cap at 2.75 SED and 25 min is simply
    the time to reach it, so the minutes ratio 2.78x IS the dose-cap ratio;
    vitd_benchmark_webbkift.py asserted on both as if independent. (3) NHANES
    Part B forces the behavioural share to 1.0 by construction and constrains
    only the product, so it cannot separate optics from behaviour.
    The decomposition does NOT rest on any of these three -- it rests on Felton
    2016 + Young 2020 (lab) and Kift 2013 + Darling 2013 (field), all four of
    which were already in the repo.
  behaviour_is_real_and_separate: >-
    The behavioural share is 2.1-2.4x and is SHADE AND CLOTHING, not posture.
    Kift's cohorts spent equal or MORE time outdoors (69 vs 63 min/d) yet
    received personal doses of 0.9-2.9% of ambient -- one to two orders of
    magnitude below any unshaded Vernez sky-visibility value. This is why it
    must live in its own term and NOT be absorbed into K_const: a scheduling
    tool exists to ask people to change their behaviour, so behaviour baked
    into a pigment constant would make the model wrong for exactly the users
    who act on it.
  cannot_be_resolved: >-
    (1) FST VI -- every FST VI datapoint in the repo is lamp-based; no field
    dosimetry exists in FST VI or in African-ancestry populations. Every V:II
    figure here is FST V South Asian at UK latitude. (2) Whether the 1.7-2.7x
    residual is optics or unmeasured exposure -- the field inversion cannot
    separate them; it is bounded above by the lab bracket, which is why the
    overlap carries the result. (3) Rhodes 2010's pre-course 25(OH)D is still
    unobtained; it is no longer load-bearing but would narrow the cross-trial
    estimate more than any other single acquisition.

approved_2026_08_17_pending_implementation:
  # Blanket approval given 2026-08-17 ("my approvals: everything"), conditional
  # on the grounding_requirement above. NONE of these are implemented yet; each
  # needs its own parameter_approvals entry with a real derivation when it is.
  - id: A2
    name: "D_max = 150 -> saturating feedback form"
    why: >-
      Gap 19/20: the feedback term sets the interval ranking, making this the
      most influential number in the model, and its origin was never found
      (not in Bogh 2010; PMID 19812604 max was 116 nmol/L). Real 25(OH)D
      regulation acts on 1,25(OH)2D via CYP24A1 induction, not a hard ceiling.
  - id: A4
    name: "A = 2.353 recalibration toward Young 2021 midpoint"
    why: >-
      Model gives ~1.85 nmol/L per SED at 85% BSA against Young 2021's reported
      fair-skin 2.0-5.0. Shifts absolute D roughly 50%; scheduling rankings
      unchanged. NOTE: Young 2021 is FST I-II only -- see dark_skin_priority.
  - id: A5
    name: "Vitamin D action spectrum: CIE-174 vs Young 2021"
    why: >-
      CLARIFIED 2026-08-17: neither spectrum is currently in force. The core
      model does not compute spectral integrals at all -- E_source values are
      direct table reads from Webb 2021. Only scripts/bogh2012_ablation.py (a
      retired sensitivity tool) and vitd_dose_conversion.py (which takes the
      name as an argument) load the CSVs. This choice becomes live only when
      E_source is derived as a function of solar zenith angle. Defer to that
      point rather than deciding it in the abstract.
  - id: A6
    name: "Retire K_ATTEN as a free parameter"
    why: >-
      It is 0.00, swings steady-state D by 0.3% across its full plausible range,
      and is jointly unidentifiable with both K_SC and K_const (gap 25).
      Reporting it as separately calibrated overstates the evidence.
  - id: A7
    name: "Sanity 3 acceptance band 10-30% -> 0-10%"
    why: >-
      Resolves the outstanding NEEDS_VERIFICATION entry in pending_approvals
      above. Read it together with that entry's consequence clause: the check
      cannot fail at the current parameter value.

