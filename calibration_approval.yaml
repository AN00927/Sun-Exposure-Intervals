  failing:
    - name: "NHANES K_ATTEN seasonal amplitude"
      detail: >-
        Model White:Black amplitude ratio 0.17 vs observed 1.449 (inverted).
        Diagnosed: NHANES baselines differ by group (White ~62.5, Black ~40.0
        nmol/L), and the baseline-dependent terms predict a LARGER seasonal
        rise for the darker-skin group. Two contributors, in order: the
        Datta 2017 state-dependent clearance t_half = 2953 * D**-0.72, giving
        daily clearance proportional to D**1.72, so the higher-baseline group
        clears several-fold faster; and the linear (1 - D/D_max) feedback term.
        CORRECTED 2026-08-09: an earlier version of this entry attributed the
        inversion partly to the melanin penalty being absent. That is wrong.
        Swept across K_ATTEN in [0.00, 1.00] the model ratio stays at ~0.17 --
        under these protocols the facultative excess is at most ~0.035, so
        exp(-K_ATTEN * dM) spans only 1.000-0.966 and cannot move a ratio by a
        factor of eight. This is a feedback/clearance-SHAPE problem and is
        independent of K_ATTEN. Do not archive it -- it is the most informative
        feedback-shape diagnostic available, and per the D_max negative result
        (now recorded in scripts/dmax_identifiability_gallagher2012.py, which
        concludes D_max is a BOUNDED RIDGE rather than a point; the register
        that carried it as section 7, next-step 3 was purged 2026-09-19)
        long-horizon seasonal data is the ONLY kind that can identify D_max at
        all.


