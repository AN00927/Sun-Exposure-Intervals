notes: |
  Bogh 2012 now PASSES (+56.0 vs observed +55.8) after a dose-unit correction,
  not a calibration change: absolute J/cm2 had been passed to simulate() as
  erythemal SED, dropping the ~5.5x TL-01 conversion, and the 35% reference BSA
  was used for a documented whole-body protocol. No parameter was tuned.

  Young 2020 remains a calibration CHECK, not independent validation.

  INTERMITTENT_BURN_EXPONENT (2026-08-08): the Elwood & Jopson anchoring did NOT
  change the value. It replaced an unjustified constant with a documented
  derivation, a stated bracket, and a regression test
  (tests/test_physiology.py::TestElwoodIntermittencyAnchor) that fails if the
  exponent moves outside the anchored interval. Treat this as a provenance
  upgrade, not a recalibration -- no model output changed.

  Skin-cancer risk model (2026-08-09): unlike the entry above, these DID change
  model output. Three changes, two calibrations and one bug fix:
    1. SCC_DOSE_EXPONENT 1.0 (implicit) -> 1.7. Cumulative dose now costs more
       than proportionally.
    2. FST susceptibility: prior -> derived basal-layer damage fraction.
    3. BUG FIX, not gated: the intermittent index normalised by a per-FST
       reference that ALSO contained the susceptibility factor, so both
       cancelled. The index was exactly 1.0 for every skin type on the
       reference schedule -- contradicting this module's own docstring -- and
       ranked a FST VI person at 0.5 MED as ~380x riskier than a FST I person
       at 0.5 MED, which is backwards relative to Shih 2018, the model's own
       MED source. Fixed to a fixed reference; FST I still scores exactly 1.0.
  Recommended SCHEDULES are unchanged by all three (interval, minutes and SED
  per session are identical). What changed is the index VALUES, which is what
  the C9 risk cap and every cross-skin-type comparison read.

  Open blockers:
  - D_max = 150.0 origin unconfirmed -- CLOSED 2026-08-18 by RETIREMENT, not by
    measurement. The linear feedback form was withdrawn as the default
    (parameter_approvals.feedback_mode), so D_max is out of force and no longer
    drives the interval ranking. The ranking is now measured to come from
    having a DECREASING feedback factor at all, not from this particular one.
    (The cross-reference this line used to carry pointed at MODEL_AND_EVIDENCE.md,
    which was purged from the repo on 2026-08-18. Facts live in the
    vitd_model.py docstring and in this file.)
  - K_ATTEN is fitted to the Young 2020 per-person dataset (n=23, TL01 arm),
    NOT to Matsuoka. Two earlier statements here were wrong and are corrected:
    (a) Matsuoka 1990 (PMID 2165512) IS in the repo -- the abstract carries the
    complete n=7 dataset, under a filename that once read "NO PAPER FOUND";
    (b) the fitted value sits BELOW the Matsuoka-implied facultative range, a
    documented divergence between a constitutive between-subject fit and a
    within-subject facultative measurement, not a blocker. It is immaterial
    (~1% swing in steady-state D) and enforced by
    tests/test_matsuoka1990.py::TestConsistencyWithModel.
    SUPERSEDED 2026-08-18: K_ATTEN is no longer a fitted parameter at all. It
    was retired to a structural constant -- see parameter_approvals.K_ATTEN --
    on the grounds that it is jointly unidentifiable with K_SC and K_const and
    that the flat objective which produced 0.00 was never an estimate.
    SUPERSEDED AGAIN 2026-08-21 (user-approved): K_ATTEN was reinstated as an
    active, calibrated parameter (K_ATTEN = 0.34, anchored to Matsuoka 1990
    under biphasic feedback). RETIRED_PARAMETERS is now empty -- see the
    K_ATTEN entry in the vitd_model.py module docstring for the live value and
    derivation.
    UPDATED 2026-08-25: M_TAN_HEADROOM moved 0.20 -> 0.238 and derive_K_ATTEN's
    excess_M now reads it live, so K_ATTEN moved to 0.288972 (see the
    parameter_approvals.K_ATTEN entry above). The 2026-08-18 retirement entry above is a historical record
    of the state at that date, not current.
  - No genuine held-out validation study exists; every study is a calibration
    or debug target.

phase4_results_2026_08_18:
  # Phase 4 outcomes that are NOT single-parameter changes. The three parameter
  # changes (A, feedback_mode, K_ATTEN) live under parameter_approvals.
  status: IMPLEMENTED
  approved_by: User (repository owner)
  approval_date: 2026-08-17

  a3_metric_hierarchy:
    change: >-
      The scheduling metrics were an unranked pile in which a DIAGNOSTIC metric
      could be, and was, read as advice. They are now an explicit three-tier
      hierarchy declared once in vitd_objectives.OBJECTIVE_HIERARCHY, with
      exactly ONE primary objective enforced in code (a second PRIMARY entry
      raises).
    primary: >-
      min_dose_min_sessions_to_hold_sufficiency -- "what is the LEAST I have to
      do, fewest sessions and smallest dose, to reach 50 nmol/L and then stay
      there?" Minimises (n_sessions, total_sed) subject to C3 (floor holds
      every day after ramp-in), C1 (per-session dose <= GAMMA_MED * MED(FST))
      and C7 (dose deliverable within PRACTICAL_MAX_MINUTES). Implemented by
      vitd_optimization.minimum_schedule_for_sufficiency. EVERYTHING REPORTED
      AS ADVICE COMES FROM THIS TIER, and infeasible cells -- dark skin at low
      session budgets -- are a RESULT, not a gap to be filled by relaxing
      C1 or C7.
    secondary: >-
      (rank 2) tri_objective_sessions_spacing_risk -- the frontier over
      n_sessions x max_gap_days x combined_risk, among schedules that already
      work. A frontier, NOT advice; the three axes genuinely conflict, because
      fewer sessions forces both longer gaps and a larger per-session dose,
      which the intermittency term punishes cubically.
      (rank 3) min_risk_at_fixed_session_budget -- conditional on a budget the
      user supplies.
    demoted_to_diagnostic: >-
      gross_synth_per_SED, for a demonstrated reason rather than a stylistic
      one: it has NO interior optimum. It rises monotonically as dosing
      approaches zero, so its argmax merely tracks the search bound, and at its
      previously reported 21-30 day "optima" the trajectory ENDS BELOW its own
      starting 25(OH)D. It scored a NET LOSS of vitamin D as maximal
      efficiency. vitd_optimization.gross_synth_per_SED_diagnostic() recomputes
      that failure from the CURRENT parameters instead of quoting the
      historical figure, so the demotion cannot silently rot.
      net_final_D_change_per_SED is also diagnostic: being signed, it repairs
      the net-loss failure, but it is still a ratio with no floor constraint and
      can therefore still prefer a schedule that never reaches sufficiency.
    status: >-
      [CHOICE, NOT A RESULT] The ordering is a decision about what this project
      is FOR. It is recorded in one place so that it is arguable in one place,
      instead of being implied differently by each section of the report.

  # --- k_decay_SC sourcing correction (2026-08-25, user-approved) ---
  # NO VALUE CHANGE. This is a documentation/citation correction, not a
  # parameter change. k_decay_SC = ln(2)/28.0 is unchanged.
  # Old inline citation: "Pearse 1987 (P23) measured SC after 6 weeks of
  #   3x/week UVB. Epidermal turnover literature: 26-28 days."
  # Corrected citation: Weinstein & Van Scott 1965 (J Invest Dermatol
  #   45:257-262, PMID 5837896) via Rothberg 1961: 26-27 d total
  #   epidermal transit time. Converted to exponential half-life via
  #   ln(2)/T -- a modeling choice, not a measured rate constant.
  # Pearse 1987 is cited for SC thickening levels only, never for this
  #   number. Post-1972 literature revises whole-epidermis turnover to
  #   40-56 d; 21-28 d retained as plausible lower bound for SC regression.
  # Rationale for correction: vitd_model.py:826 previously attributed the
  #   figure to Pearse 1987 and "epidermal turnover literature" without
  #   specifying source. The number traces to Weinstein & Van Scott 1965
  #   (turnover time) + ln(2)/T conversion (modeling choice).
  outstanding: >-
    The COMBINED K_const + A feasibility map is the honest artefact and
    supersedes the K_const-only consequence recorded under
    parameter_approvals.K_const.consequence, which was explicitly flagged
    PROVISIONAL there pending the A recalibration. Raising A increases
    synthesis per SED and therefore pulls some cells back to feasible.
    Until the combined map is recorded here, the K_const-only feasibility
    table must NOT be presented as final.
