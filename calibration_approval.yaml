  - id: A7
    name: "Sanity 3 acceptance band 10-30% -> 0-10%"
    why: >-
      Resolves the outstanding NEEDS_VERIFICATION entry in pending_approvals
      above. Read it together with the circularity finding above
      (w_z_verdict_2026_09_22): the band and the K_ATTEN parameter it
      guards are anchored to the SAME Matsuoka 1990 (n=7) deconvolution,
      read under different feedback-form assumptions. Not independent
      evidence; a real, non-vacuous structural bound.
    status: APPROVED_2026_09_22_STRUCTURAL_KEEP_WITH_REDESIGN
    resolution: >-
      2026-09-22 (decision A6). RETROACTIVE APPROVAL. Authority: the
      user's A6 answer, 2026-09-21 -- "revisit the check
      along with revisiting the numbers; number changes are approved by me
