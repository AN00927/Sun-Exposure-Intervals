    scope: NO VALUE CHANGE. Annotation of an existing approval.
    parameter: vitd_model.BSA_EXP
    finding: >-
      scripts/bsa_exp_recalibration.py does not reproduce the value recorded
      in this file's BSA_EXP entry, and W-W section 7 logged that as a
      defect. INVESTIGATED: it is not a defect and there is nothing to fix
      in the script. The derivation is a DECONVOLUTION AGAINST THE MODEL --
      it asks what BSA_EXP makes THIS MODEL, at ITS CURRENT PARAMETER SET,
      reproduce each source's observed response ratio -- so its output is a
      function of A, K_const, the feedback form, k_decay_D,
      M_baseline_by_FST and, since today, the body-weight term. All of those
      have moved since 2026-09-06.
    measured_trajectory_of_the_same_method:
      "2026-09-06 (the approval)": 0.3281
      "2026-09-22, before the A3 / K_const change": 0.3577
      "2026-09-22, after it": 0.3537
    resolution: >-
      The approved value is relabelled as "this derivation's output AT THE
      2026-09-06 TREE STATE" rather than presented as a tree-independent
      constant, in this file, in vitd_model.py's BSA_EXP entry and in the
      script's own header. No script that inverts a model can reproduce an
      output frozen against a superseded tree state.
    not_re_adopted_and_why: >-
      A deliberate conservative choice, not an oversight. Adopting 0.3537
      would require a THIRD parameter in the already-coupled (A, K_const)
      fixed-point iteration, and bsa_factor(0.85) is a term in A's own
      anchor kernel, so A would absorb most of the change at 85% BSA and the
      residual would land on every OTHER exposed-BSA value in the model --
      moving every validation check for a 7.8% shift in an exponent whose
      own sensitivity sweep over two unsourced protocol assumptions (the
      script's Step 2c) spans 0.3046 to 0.3895, WIDER than the drift being
      chased. Recommended as a follow-up only if the (A, K_const, BSA_EXP)
      triple is ever re-fitted jointly in one pass.

