      It is an ERYTHEMA ratio, not a vitamin D ratio. This repository already
      holds a cautionary case: Felton 2016's MEASURED erythema MED ratio of
      3.95x sits far above every matched-dose vitamin D estimate, and
      Kallioglu 2024's "V:II = 2.40" was WITHDRAWN from the held-out scoring
      set precisely because it turned out to be an erythema MED table. An
      erythema ratio scores a vitamin D calibration at best; it never sets
      one.
