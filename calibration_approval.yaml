  K_const_weighting_2026_09_22:
    superseded_2026_09_22: >-
      SUPERSEDED THE SAME DAY by K_const_random_effects_2026_09_22, which replaces fixed-effect inverse-variance with random effects as the default. The reason is in this entry's own evidence: the routes are not noisy reads of one number (I^2 = 83.255346%), so a fixed-effect pool reports a precision the evidence does not have. The four schemes this entry added remain selectable and computable. NOT DELETED.
    approved_by: User (repository owner)
    approval_date: 2026-09-21
    implemented_date: 2026-09-22
    memo: (workstream W-W, retired 2026-09-23 -- see this entry's own fields, which restate the finding in full)
    supersedes_proposal: >-
      K_const_weighting_2026_09_20 (workstream W-J section 6), which
      was PROPOSED and NOT APPROVED. This entry is that proposal's approved,
      implemented successor. W-J declined to compute the estimate because it
      believed routes 2-4 had no published variance; W-W establishes that
      Young 2020's variance IS measurable from individual-level data already
      in this repository, so the estimate is now computable.
    scope: METHODOLOGY ONLY -- NO PARAMETER VALUE CHANGED
    parameter: K_const (estimator weighting; the VALUE is untouched)
    change: >-
      scripts/kconst_recalibration.py's DEFAULT weighting scheme moved from
      one-vote-per-study to 'inverse_variance'. Four schemes are now named,
      selectable (--scheme) and computed in a single run:
      one_vote_per_study (the incumbent, RETAINED so every previously
      published figure stays reproducible); inverse_variance (new default);
      inverse_variance_complete_case; inverse_variance_within_study.
      New sections S3c (variance-availability audit) and S3d (all schemes
      side by side) print the evidence the weighting rests on.
    approval_basis: >-
      User's answer to decision A4 (K_const envelope, 2026-09-21):
      "both can be done. carry the envelope, but do that after and ONLY IF
      still needed after doing the inverse variance waiting [weighting]
      movement throughout the repo." The weighting movement is the approved,
      unconditional half of that answer and is what this entry records.
    what_inverse_variance_means_here: >-
      Routes are inverse-variance weighted WHERE A MEASURED VARIANCE EXISTS
      and equally weighted where none does, INSIDE the lab/field method tiers
      the incumbent estimator already implied. The 50/50 lab:field tier split
      is INHERITED, not invented: under one-vote-per-study two lab studies
      and two field studies already carried 50% each. The only weight that
      moves is the split WITHIN the lab tier, which is the one place a
      variance is published. Effective weights: Felton 25.0% -> 1.4%,
      Young 25.0% -> 48.6%, Kift 25.0% -> 25.0%, Darling 25.0% -> 25.0%.
    variance_provenance: >-
      Felton 2016 (BJD 175:1320, Results, "Serum 25-hydroxyvitamin D gain"):
      PUBLISHED SDs on the gain, +17.8 +/- 4.8 (n=10, phototype II) and
      +8.3 +/- 10.5 (n=6, phototype V). Delta-method SE on the log gain ratio
      0.523451409390530; dK/d(ln r) 1.631199252058861; SE(K) 0.853853547486989.
      Young 2020 (JID 140:1418): MEASURED from the individual-level workbook
      in Papers_and_Datasets/. Per-subject slope SDs by FST by arm give
      SE(ln r) 0.133448531297507 (Arimed B) and 0.198696425983737 (TL-01),
      SE(K) 0.167885925788282 and 0.241318438203153, study-level SE(K)
      0.146986625832589. Applied to Young's ANCOVA-ADJUSTED point estimate
      while the SD is on RAW slopes, which makes it CONSERVATIVE -- Young is
      handed LESS precision than it has, not more.
      Kift 2013 and Darling 2013: NO VARIANCE ON THE INVERTED QUANTITY, and
      none was imputed. See no_variance_handling below.
    no_variance_handling: >-
      STATED RULE, APPLIED CONSISTENTLY: a route with no usable variance is
      never assigned an invented one. It keeps a plain vote inside its method
      tier, and the gap is PRINTED by the estimator (S3c) rather than
      smoothed over. Excluding such routes was considered and REJECTED as the
      default: complete-case inverse-variance weighting drops Kift AND
      Darling, i.e. both field routes, which are the only sun-exposure
      evidence in the estimator and the only routes measured outside a
      cabinet. CLAUDE.md prefers sun exposure for clinical conclusions;
      discarding it to satisfy an estimator would be the tail wagging the
      dog. The complete-case value is reported as the strict-IV bound
      (K_const 0.409244, FST V:II 1.2691x) rather than adopted.
    correction_to_the_repo_record: >-
      W-J section 6 recorded that "routes 2-4 have no published variance on
      the inverted quantity". Verified against the PDFs 2026-09-22, that is
      TOO STRONG in one place. Kift 2013 (BJD 169:1272) DOES publish
      dispersion: IQRs on 25(OH)D by month and cohort, and a 95% CI of 37-53%
      on the diet-adjusted South Asian:white serum ratio (point 45%, i.e.
      white:SA = 2.2222222222222222, CI 1.886792452830188-2.702702702702703,
      SE(ln) = 0.091678725666031). It is still NOT USABLE here, for a
      different and better reason than "absent": that CI is on the RAW serum
      contrast, while the route inverts the contrast AFTER the measured
      behavioural dose difference has been removed, and the behaviour-removal
      step carries no quantified uncertainty anywhere in this repo. A partial
      variance used as a full one would UNDERSTATE the route's uncertainty
      and OVER-weight it -- worse than none, because it is confidently wrong.
      Darling 2013 remains a true absence: the paper is not held in this
      repository and no dispersion of any kind reaches us for it.
    movement:
      K_const_one_vote_per_study: 1.167794276773869
      K_const_inverse_variance: 0.748371880484260
      delta: -0.419422396289609
      FST_V_II_optical_one_vote: 1.974121297699874
      FST_V_II_optical_inverse_variance: 1.546279593141604
      FST_V_II_optical_delta: -0.427841704558269
      K_const_inverse_variance_complete_case: 0.409243760968520
      K_const_inverse_variance_within_study: 1.161932509994152
      shipped_ModelParams_K_const: 1.17   # UNCHANGED by this entry
    consequence: >-
      NOT A CLEAN WIN, AND RECORDED AS SUCH -- and it is WORSE than W-J
      predicted. W-J expected inverse-variance weighting to pull the estimate
      "toward the field pair" (1.0875) and flagged that only the
      leave-Felton-out VARIANT (0.844) would fall outside the approved
      1.7-2.7x band. In fact the PRIMARY inverse-variance estimate itself
      falls outside it, at FST V:II = 1.546280x, because down-weighting Felton
      collapses the lab tier onto Young (0.358), which sits BELOW the field
      pair rather than beside it. Adopting the value would therefore require
      re-opening a1_diagnosis_result_2026_08_17's approved band -- the same
      discipline applied at the Bogh/Farrar PASS->FAIL precedent, where
      checks were allowed to fail rather than be engineered green.
      THAT VALUE CHANGE IS NOT TAKEN BY THIS ENTRY.
    not_covered: >-
      (1) THE VALUE. ModelParams.K_const stays at the user-approved 2026-09-21
      figure under the RETAINED one-vote scheme. Adopting the
      inverse-variance estimate is a SECOND, separate approval, because it
      re-opens the approved 1.7-2.7x optical band; the user asked to see the
      numbers before that band is re-opened and this entry exists so they
      can. A ready-to-merge diff and YAML for that step were prepared in the
      now-retired workstream W-W memo and deliberately NOT applied; if this
      second approval is ever sought, the `movement:` block above already
      carries the numbers needed to redo it from scratch.
      (2) BSA_EXP. The repo's only other cross-study equal-weight pool
      (scripts/bsa_exp_recalibration.py, Young 2021 + Vahavihu/Jager 2018)
      was audited and inverse-variance weighting is NOT COMPUTABLE there:
      Young 2021 Table 1 publishes SDs (All FB 36.1 +/- 19.8, n=40; All PB
      11.0 +/- 7.8, n=35; SE(ln ratio) 0.147941401107289) but Jager 2018
      Table III publishes no SD, SE, CI or per-row n for the Vahavihu triple.
      A two-route pool with one variance is undefined. BSA_EXP is UNCHANGED
      and the audit is recorded in that script's new STEP 2d.
      (3) SOURCE_CALIBRATION_TABLE. Its lamp midpoints (tl01_nb_uvb, and
      inertly tl12_bb_uvb / uv6_broadband) are an equal-weight two-source
      pool, audited and found NOT APPLICABLE: these are deterministic
      spectral-integral unit conversions with no sample statistic behind
      them, and the low/high entries are a range across sources, not a
      dispersion. UNCHANGED; note added in vitd_model.py.
      (4) No validation check, pinned test value, or headline count moves,
      because no parameter value moved. run_all.py was NOT re-run.
    dark_skin_flag: >-
      UNCHANGED AND MORE LOAD-BEARING. Both variance-bearing routes are LAB
      routes; NEITHER field route has one, and the field pair is the only
      sun-exposure evidence in this estimator. Inverse-variance weighting
      therefore systematically shifts weight from field to lab, i.e. away
      from real sun and toward cabinets, purely because cabinets report
      better statistics. The scheme's tier structure is what stops that from
      running to completion. Young 2020's TL-01 arm -- the only all-African
      n=11 FST VI cell in this repository -- still has NO objective pigment
      measurement for any of its 23 subjects, and now carries substantially
      MORE weight than before. There is still no field dosimetry in FST VI
      anywhere in this repo, and every VI:* ratio remains an extrapolation
      onto M_baseline(VI) = 1.00.

  A:
    approved_by: User (repository owner)
    approval_date: 2026-08-17
    change: >-
      2.353 -> 3.114. Whole-model synthesis scale. Phase 4 item A4, implemented
      2026-08-18. Canonical derivation, with every intermediate factor written
      out, is the `A` entry of the vitd_model.py module docstring; it is not
      restated here.
    source: >-
      Young et al. 2021, PNAS 118:e2015867118, Fig. 4B -- the FULL-BODY arm at
      85% BSA, three lamps, regressions of delta-25(OH)D3 on ERYTHEMAL SED not
      forced through zero: UV6 4.97 (n=10), Arimed B 3.18 (n=19), PUVA 1.99
      (n=11). Range midpoint 3.48 nmol/L per SED. Independently cross-checked
      against the n-weighted pooled FB arm (Table 1, n=40): 34.6 -> 70.7 on a
      cumulative 10 SED = 3.61 per SED, 3.7% above the midpoint, so the two
      readings of "midpoint" agree.
    derivation: >-
      A is set so the model's MARGINAL yield for one 1 SED exposure equals
      3.48 nmol/L under the study's own conditions (FST II, exposed_bsa 0.85,
      D = 34.6, SC = 0, untanned, E_source = 1.89). Reproduced by
      vitd_validation.young2021_A_anchor() and pinned by
      tests/test_vitd_model.py::TestYoung2021AAnchor.
    status: >-
      CENTRE OF A WIDE, SOURCE-DEPENDENT RANGE, NOT A MEASURED CONSTANT. Read
      3.114 as the centre of roughly 2.9-5.1. Young's three FB slopes span 2.5x
      and that spread is the paper's OWN headline finding -- SED is a poor
      spectral predictor of vitamin D synthesis. Pairing each arm with its own
      E_source from SOURCE_CALIBRATION_TABLE gives A = 2.90 (Arimed B) and
      A = 5.06 (UV6): a 1.74x disagreement, and in the WRONG ORDER, since those
      E_source values predict UV6 slightly weaker than Arimed B while Young
      measures it 56% stronger.
      WHAT THE OLD 2.353 WAS: it preserved a 1.27 nmol/L rise for 1 SED in
      untanned FST III at 35% BSA, D = 25, computed at K_const = 0.33. That
      reference stopped being reproducible when K_const moved to 0.98 on
      2026-08-17 (the same expression now returns 1.11), so 2.353 was an
      ORPHANED constant before this change.
      AND THE GAP THAT MOTIVATED THIS WAS PARTLY SPECTRAL, NOT BIOLOGICAL: the
      "~1.85 vs 2.0-5.0" figure was computed at the DEPRECATED E_source = 1.00.
      At the current solar default the incumbent A already yielded 2.63, i.e.
      already inside Young's band. This is a x1.32 move, not the x1.5-1.9 the
      pre-2026-08-16 framing implied.
    dark_skin_flag: >-
      REQUIRED AT POINT OF USE (standing_directives.dark_skin_priority). Young
      2021 is FST I-II ONLY (n = 75; 6x I, 69x II, ZERO FST III-VI) and its
      authors explicitly disclaim generalisation: "The results from this study
      only apply to FST I/II". A is applied at every FST, so using it for
      FST V-VI is a LIGHT-SKIN EXTRAPOLATION. Mitigated but NOT removed by the
      fact that the between-FST gradient (K_const) is anchored separately on
      matched-dose FST V data, so what is extrapolated is the overall LEVEL and
      not the skin-type gradient. Any absolute 25(OH)D prediction for FST V-VI
      must carry this flag.
    consequence: >-
      Farrar 2013 (FST V -- the ONLY dark-skin quantitative check in the suite)
      moves FAIL -> PASS: delta +8.7 -> +11.2 against an observed +21.7, band
      10-35. Bogh 2012 stays PASS: +48.0 -> +51.6 against +55.8, band
      45.8-65.8. Karppinen 2017 passes in the DEFAULT feedback mode, so its
      experimental-mode override was removed. Required validation 8/10 -> 10/10.
      It also RAISES synthesis per SED and therefore partially offsets the
      K_const feasibility result; see phase4_results_2026_08_18.
    not_covered: >-
      A cannot reproduce Young's FB protocol END-TO-END. Simulating the actual
      5 x 2 SED protocol needs A ~ 8.3 (Arimed B) to reach the observed +38.6,
      and the 3.7%-BSA arms need more still; the model under-predicts Young's
      absolute rises by 2.7x (FB) to 6.2x (PB) at any A that keeps Bogh 2012
      and Farrar 2013 in band. Young 2021 and Bogh 2012 are MUTUALLY
      INCOMPATIBLE inside this dose-response structure: Bogh delivered ~6.7x
      Young's D3-effective dose from a LOWER baseline and produced only 1.45x
      the rise. This calibration matches Young's per-SED SLOPE, which is what
      the approval asked for; it does not resolve that conflict and NO value of
      A can. Young's own within-study BSA contrast (85% vs 3.7% BSA, 3.28x
      response for a 23x area ratio) also implies BSA_EXP ~ 0.38 against the
      model's 0.50 -- RECORDED, NOT ACTED ON.

  feedback_mode:
    approved_by: User (repository owner)
    approval_date: 2026-08-17
    change: >-
      'linear' -> 'biphasic'. Phase 4 item A2, implemented 2026-08-18. The hard
      synthesis ceiling max(0, 1 - D/D_max) is WITHDRAWN as the default and
      replaced by a saturating form. Full reasoning and the adopted expression
      are in the vitd_model.py module docstring, feedback_mode entry.
    source: >-
      Scholze et al. 2026, Commun Med 6:105. With bimonthly sampling they
      report that conversion of cutaneous D3 to plasma 25(OH)D3 is efficient at
      low 25(OH)D3 and "decreases markedly" above an inflection at 56 nmol/L.
      Implemented as vitd_physiology.hydroxylation_efficiency.
    why_the_linear_form_went: >-
      It asserted that cutaneous synthesis STOPS OUTRIGHT at D = D_max. No such
      switch exists -- 25(OH)D homeostasis is exerted downstream, on
      1,25(OH)2D, by CYP24A1 induction and substrate-driven catabolism, the
      latter already carried by the state-dependent k_decay_D. AND D_max = 150.0
      never had a source: it is NOT in Bogh 2010, and PMID 19812604's observed
      maximum was 116 nmol/L. This was a structural bug fix as much as a
      calibration.
    estimation_flags: >-
      [ESTIMATE] D_inflect = 56.0 is an OUTPUT of a breakpoint fitted on the
      vitamin D3 axis, not a regressor, so it carries that breakpoint's own
      (unpublished) width.
      [CHOICE] n = 2.0 is NOT fittable from a single reported breakpoint. It is
      chosen as the gentlest integer knee: g = 0.5 at the inflection, 0.80 at
      half of it, 0.20 at twice it. g(D) is never exactly zero, which is the
      entire point of the change.
    rejected_alternative: >-
      feedback_mode='saturating', g(D) = exp(-ln2 * D / D_half_feedback),
      already existed and was used only inside the Karppinen check. Rejected on
      two grounds. (1) Its scale parameter has no source: the default 50.0 is
      unattributed and the 90.0 used in the Karppinen check was FITTED to
      Karppinen, so adopting it would have made that check CIRCULAR. (2) An
      exponential is at its steepest fractional decline as D -> 0, which
      contradicts Scholze's finding that hydroxylation is EFFICIENT below the
      inflection. Measured cost of adopting it anyway, at the A the Young 2021
      anchor then requires (3.641): the Karppinen check FAILS. Mode retained
      unchanged for sensitivity work.
    consequence: >-
      REPORTED IN FULL BECAUSE IT MOVES THE HEADLINE. The interval optimum
      under net_final_D_change_per_SED (FST III, 1 SED, 84 d, D0 = 25) goes
      3 d -> 5 d and the within-5%-of-peak band goes [2,3,4] -> [3,4,5,6].
      DECOMPOSED: the feedback form ALONE (biphasic at the old A) leaves the
      FST III optimum at 3 d; the A recalibration ALONE (linear at A = 2.930)
      also leaves it at 3 d. The shift to 5 d is their INTERACTION -- more
      synthesis per session raises steady-state D, which then sits further up
      the feedback curve. The optimum stays graded by pigmentation and gets
      SHORTER with darker skin: FST I-II 5 d, III 5 d, IV 4 d, V-VI 2 d
      (incumbent 3/3/3/2/2/1 d). Interval ORDERING is near-invariant (Spearman
      rho 0.964-0.999 across FST II/III/V/VI); it is the ARGMAX that moves. So
      "recalibrating A leaves scheduling rankings unchanged" is TRUE for the
      ordering and FALSE for the reported optimum.
    correction_to_an_earlier_claim: >-
      run_all.py section 17 said the interval ordering "comes from the
      (1 - D/D_max) feedback term". That is now MEASURED to be too specific.
      The ordering comes from having a DECREASING feedback factor at all: at
      the incumbent A the argmax is 3 d under linear, biphasic and both
      saturating variants alike.
    d_max_status: >-
      D_max = 150.0 is NOT deleted -- 'linear' and 'power' still read it and
      vitd_sensitivity/scripts still sweep it -- but it is OUT OF FORCE in the
      default model. `D_max_override=` is INERT unless feedback_mode is
      explicitly set to 'linear' or 'power'. ANY sensitivity result reporting
      D_max as influential is describing a NON-DEFAULT configuration.

  K_ATTEN:
    approved_by: User (repository owner)
    approval_date: 2026-08-21
    change: >-
      REINSTATED AS ACTIVE CALIBRATED PARAMETER, 2026-08-21 (user-approved).
      Value set to 0.34, anchored to Matsuoka 1990 (PMID 2165512, n=7 within-subject
      tanned-vs-untanned arm synthesis) with biphasic feedback g(D) deconvolved
      (residual melanin attenuation 6.6%, K_ATTEN = 0.34; plausible range across
      feedback forms: [0.34, 1.00]). Removed from RETIRED_PARAMETERS.
      UPDATED 2026-08-25: M_TAN_HEADROOM moved 0.20 -> 0.238 (Ravnbak 2008) and
      derive_K_ATTEN's excess_M now reads M_TAN_HEADROOM live instead of a
      hardcoded 0.20, so K_ATTEN moved with it to 0.288972 (plausible range
      [0.288972, 0.838389]). The residual melanin attenuation percentages
      (6.6%/18.1%) are unchanged -- they do not depend on excess_M.
    mechanism: >-
      exp(-K_ATTEN * max(0, M - M_baseline)) is evaluated on every session.
      A full tan (excess_M = M_TAN_HEADROOM = 0.238) provides 6.6% attenuation
      at K_ATTEN = 0.288972 and 18.1% at K_ATTEN = 0.838389.
    source: >-
      Matsuoka et al. 1990 (J Lab Clin Med 116:87-90, PMID 2165512). Within-subject
      tanned-vs-untanned arm synthesis with biphasic feedback deconvolved.
    derivation: vitd_calibration.derive_K_ATTEN('biphasic')
    status: >-
      ANCHORED TO MATSUOKA 1990 DECONVOLUTION. Deconvolving baseline feedback
      (tanned baseline 92.1 nmol/L vs untanned 56.2 nmol/L) under the default biphasic
      mode yields residual melanin attenuation of 6.6%, implying K_ATTEN = 0.288972
      (range [0.288972, 0.838389]) at the live M_TAN_HEADROOM = 0.238.
    not_covered: >-
      Matsuoka 1990 is n=7. K_ATTEN is collinear with K_SC; this calibration provides
      the evidence-based lower bound from the only within-subject trial in existence.
      Across annual scheduling, this parameter swings steady-state 25(OH)D by ~0.3-1.0%.

  E_SOURCE_SOLAR_DEFAULT:
    approved_by: User (repository owner)
    approval_date: 2026-08-16
    change: >-
      Sun-facing entry points move from an implicit E_source = 1.00 to
      'solar_summer' = 1.89. New constant vitd_model.E_SOURCE_SOLAR_DEFAULT.
      Affects minutes_for_target() when params is not supplied, and
      vitd_analyses.analysis_sun_exposure. Roughly HALVES every recommended
      minutes figure for sun.
    source: >-
      Webb, Alghamdi, Kift & Rhodes 2021, Endocrine Connections 10:R248-R266,
      Table 1: VDE:EE for sun = 1.89 (Manchester summer), 2.01 (NZ summer),
      1.22 (NZ winter). Full text in Papers_and_Datasets/.
    derivation: >-
      None -- this is a direct table read, not a fit. The change is better
      characterised as removing an artefact than as calibrating: 1.00 was the
      backward-compatibility default when E_source was introduced under audit
      tag [C2] ("so all existing scenarios are unchanged") and was later
      retro-labelled "solar broadband reference". No solar spectrum has
      VDE:EE = 1.00; Webb's lowest published sun value is 1.22, in NEW ZEALAND
      WINTER. The old default therefore under-weighted solar vitamin D
      effectiveness by ~1.9x at every latitude and season.
    status: >-
      APPROVED WITH A KNOWN COST, ACCEPTED EXPLICITLY. See not_covered.
      Independent evidence that the direction is right: against the only
      external absolute anchor in the repo (Webb/Kift 2018, ~9 min/day for
      white Caucasians) the model moves from 49.7 min to 25.3 min. Still
      2.8x too long, but 2x closer.
      A is NOT refitted and does not need to be: it is anchored by Bogh 2012,
      which runs at the TL-01 E_source of 2.44 and passes to 0.2 nmol/L. The
      "1.27 nmol/L per SED" figure sometimes described as A's calibration
      target is computed FROM the parameters in vitd_validation.py and is a
      regression test, not an external anchor.
    not_covered: >-
      SOLAR E_source IS NOT IDENTIFIABLE FROM THIS REPO'S SOLAR CHECKS, and this
      approval does not pretend otherwise. Every solar validation supplies an
      ASSUMED daily SED that nobody measured (NHANES _SIM_SED = 0.333; Kift
      0.333 3x/week), so that assumed dose absorbs any E_source change exactly.
      Measured consequence: NHANES Part B drops from 6/6 to 4/6. The assumed
      dose was deliberately NOT retuned to keep the check green -- doing so
      would be calibration through an ungated back door. Closing this properly
      requires a real ambient UV climatology so the dose becomes derived rather
      than assumed; that is FUTURE WORK. (The 'Open decisions' register that
      recorded it as item 12(b) was purged 2026-09-19 with zero commits and is
      unrecoverable. This entry is now the only record of that decision --
      README.md's "Known deliberate test failure" note and
      vitd_model.E_SOURCE_SOLAR_DEFAULT's comment both point here.) Until then
      the 1.89 value is a literature read
      applied on top of unmeasured doses, and absolute 25(OH)D predictions for
      solar scenarios should be read with that in mind.
      Also not covered: the seasonal variation of solar VDE:EE (1.22-2.01 across
      Webb's three entries) is NOT modelled -- one summer value is used
      year-round.

  VERNEZ_GEOMETRY_MODEL:
    approved_by: User (repository owner)
    approval_date: 2026-08-16
    change: >-
      vitd_physiology.personal_geometry_factor: the elevation-only form
      0.15 + 0.30*cos(theta) is WITHDRAWN and replaced by Vernez 2015 Eq. 1,
      exposed as vernez_exposure_ratio(vis_percent, sza_deg). The 0.35 Cockell
      scalar remains the default when sky visibility is unknown, so DEFAULT
      MODEL OUTPUT IS UNCHANGED by this entry.
    source: >-
      Vernez, Milon, Vuilleumier, Bulliard, Koechlin, Boniol & Dore 2015,
      J Expo Sci Environ Epidemiol 25:113-118, doi 10.1038/jes.2014.6,
      Equation 1. Full text now in Papers_and_Datasets/. This CLOSES data
      request #13, which this repository twice recorded as "paywalled,
      confirmed unobtainable" -- exactly the failure mode CLAUDE.md warns about.
    derivation: >-
      None -- coefficients transcribed verbatim from the paper and pinned by
      tests/test_physiology.py::TestPersonalGeometryFactor against two values
      computable from the printed equation.
    status: >-
      SOURCED, replacing an acknowledged PLACEHOLDER whose cited support was
      found on full-text read to contradict it (gap 26, assumption A23).
      Vernez fit R^2 = 0.988 (n=8515, 3 postures), held out R^2 = 0.972
      (n=5672, 2 unseen postures). The substantive finding is that sky
      visibility moves the ratio ~11.6x while solar zenith angle moves it
      ~1.18x -- the withdrawn form modelled the small term and had no posture
      argument at all.
    not_covered: >-
      (1) Vernez ER assumes UNPROTECTED SKIN, NO SHADE and CONTINUOUS EXPOSURE.
      The authors say so and show their model overpredicting farmers' faces
      (15-55% modelled vs 11-15% measured). These are ceilings for deliberate
      unshaded exposure, NOT interchangeable with behaviourally-averaged
      dosimeter numbers such as Cockell's 0.35.
      (2) Supplementary Table S1 (typical Vis by posture and body site) is NOT
      in the obtained PDF -- data request #13b. The VIS_PRESETS_PLACEHOLDER
      values in vitd_physiology.py are BACK-DERIVED by inverting Eq. 1 against
      the mean ERs printed in the Results text. They are consistent with the
      paper's outputs but are NOT its inputs and must never be cited as such.
      Any user-facing number derived from them must be labelled a placeholder.
      (3) Geometry x BSA are coupled and the model treats them as independent:
      which sites are uncovered sets BOTH the exposed area and the mean ER.
      Not addressed.

  PERSONAL_DOSE_GEOMETRY_FACTOR:
    approved_by: User (repository owner)
    approval_date: 2026-08-20
    change: >-
      value UNCHANGED at 0.35; a THIRD, measured, activity-specific and
      elevation-resolved route is added ALONGSIDE it. New in vitd_physiology:
      SCHMALWIESER_2025_JOGGING_ERTA (7 body sites x 5 solar elevations),
      ACTIVITY_ERTA_TABLES, activity_erta(), activity_erta_interval(); and new
      `activity=` / `body_site=` arguments on personal_geometry_factor(),
      vitd_objectives.sed_from_minutes() and minutes_for_target(). Nothing
      selects the new route unless a caller names an activity, so DEFAULT MODEL
      OUTPUT IS UNCHANGED by this entry.
    source: >-
      Schmalwieser, Danhel, Schmalwieser, Reimoser, Rummel, Loy, Heydenreich &
      Weihs 2025, "Erythemal UV radiation exposure during jogging", Photochem
      Photobiol, doi 10.1111/php.14114. Full text in
      Research_Papers/Schmalwieser_2025_Photo.pdf. ONE volunteer, 12 SunSaver
      dosimeters at 7 sites, cloud-free Vienna (48.247 N), 18-19 June 2025,
      solar elevations 20/30/40/50/60 deg, four cardinal-direction runs averaged
      per elevation. Corroborated on the shoulder finding, and CONTRADICTED on
      magnitude, by Weihs et al. 2013 (Photochem Photobiol 89:1004), also in
      Research_Papers/ -- see not_covered.
    derivation: >-
      None -- no fit. The paper prints no ERTA table, so Figure 5 was DIGITIZED
      from the published raster at 4x zoom (read precision ~+/-0.02, rounded to
      2 dp, already finer than the authors' own +/-15%) and every series was
      then cross-checked against the values the paper states in prose:
      shoulders "0.8 with no dependence on solar elevation" (table mean 0.808,
      spread 0.02); forearms and forehead "0.5 and 0.3" (0.484, 0.320); upper
      arms, calves, nape and thighs "starting with a value of 0.5 at 20 deg down
      to around 0.4 and 0.3 at 60 deg" (in that site order, 0.55/0.50/0.50/0.49
      at 20 deg and 0.35/0.42/0.35/0.34 at 60 deg). Pinned prose-fact by prose-fact in
      tests/test_physiology.py::TestSchmalwieser2025JoggingERTA. If the numbers
      are ever disputed, re-digitize Figure 5 -- do not re-fit.
    status: >-
      SOURCED AND MEASURED, BUT DELIBERATELY NOT PROMOTED TO THE DEFAULT, and
      that non-promotion is the substance of this approval. Every jogging site
      ERTA (0.29-0.82) sits ABOVE the 0.35 Cockell scalar, which looks like a
      case for raising it. It is not, for two reasons that only appear once both
      papers are read. (1) DIFFERENT REGIMES: Schmalwieser measures continuous,
      deliberate, unshaded exposure in one posture; Cockell's 0.35 is a
      behaviourally-averaged dosimeter number, and this repo already refuses the
      same substitution for Vernez ER (see VERNEZ_GEOMETRY_MODEL.not_covered).
      (2) THE OTHER DIRECTION EXISTS: Weihs 2013 reports ERs "between 0.05 and
      1" across six body sites and four activities, all in continuous direct sun
      at 46-64 deg elevation -- a 20-fold spread that straddles 0.35 in BOTH
      directions. Its walking shoulders:forehead contrast is 1.70 against 2.52
      for jogging over the same elevations, and the site ORDERING itself changes
      with posture (lower legs lead while lying and sitting up, shoulders while
      walking). ACTIVITY AND POSTURE DOMINATE. The measured spread across
      activities and sites is wider than the distance from 0.35 to either study,
      so no single measured value replaces a fallback whose whole job is to
      answer when the activity is unknown.
      [CORRECTED 2026-08-20] Clause (2) previously cited per-site walking means
      digitized from Weihs's Figure 6 (an unweighted "~0.26", lower leg "0.10",
      and a claimed 5x calves disagreement). That figure cannot be read to that
      precision in the copy held here and the digitization is WITHDRAWN; the
      restatement above uses only ratios and ranges the paper prints as text.
      The approval, the conclusion and the value are unchanged -- only the
      evidence cited for them. Also corrected in the first sentence: the jogging
      range is 0.29-0.82, not 0.32-0.82 (the forehead series reaches 0.29).
      Pinned by
      tests/test_physiology.py::TestPersonalGeometryFactor::test_flat_fallback_is_still_0_35_after_the_2025_papers
      so it cannot be quietly undone in either direction.
    double_counting_with_E_source: >-
      RESOLVED BY CONSTRUCTION, WITH ONE NAMED RESIDUAL. The risk was that ERTA
      and the vitamin-D-to-erythema ratio (SOURCE_CALIBRATION_TABLE, Webb 2021)
      both depend on solar zenith angle, so multiplying them might apply the
      same physics twice. They do not: ERTA is erythemal-on-body over
      erythemal-on-horizontal, both measured with CIE-erythema-matched
      detectors, so the action spectrum CANCELS and only the angle between skin
      and sky survives; VDE:EE is two different action spectra applied to the
      SAME irradiance, so only spectral composition survives. Geometry and
      spectrum, orthogonal, both legitimately elevation-dependent.
      THE RESIDUAL, NOT CORRECTED: E_source is measured on a HORIZONTAL plane
      while ERTA moves the dose onto a TILTED surface seeing a different
      direct:diffuse mix, which differs in UVB:UVA. The correction is
      VDE:EE(site) / VDE:EE(horizontal) and NO source in this repo measures it
      -- Webb 2021 reports horizontal only, and Schmalwieser used erythemal
      detectors, never a spectroradiometer at the skin. Second-order and carried
      by any absolute D prediction that uses activity ERTA. Written out in full
      above vitd_physiology.activity_erta, with the operational rule: never let
      a falling ERTA at high sun be "compensated" by a rising VDE:EE. They are
      not offsetting corrections to one quantity.
    not_covered: >-
      (1) n = 1. ONE subject, ONE posture (the textbook jogging forward lean),
      ONE city, ONE ground albedo (asphalt/grass, 5-11%). The +/-15% interval
      from activity_erta_interval() is MOUNTING uncertainty only; between-subject
      variance is unmeasured and larger.
      (2) NOT TRANSFERABLE BETWEEN ACTIVITIES. activity_erta() raises on any
      activity it has no table for rather than substituting jogging. Weihs et
      al. 2024 (Atmosphere, cycling, SZA to 65 deg) would be the obvious next
      acquisition and is still not in the repo.
      (3) ABOVE 60 DEG IS REFUSED, NOT EXTRAPOLATED. The authors state the
      results "may not be necessarily applicable at higher solar elevations as
      found at subtropical and tropical latitudes" -- exactly where four of the
      seven series are still falling when the data runs out. activity_erta()
      clamps with a warning, which under dark_skin_priority matters: the
      latitudes this table cannot reach are disproportionately the ones where
      FST V-VI populations live.
      (4) ERYTHEMAL, NOT VITAMIN-D WEIGHTED. See double_counting_with_E_source.
      (5) 'mean_measured_sites' IS NOT A WHOLE-BODY RATIO. It counts the
      shoulders -- ~2% of BSA and the most exposed site -- equally with
      everything else, and represents the trunk not at all, because the sternum
      was tested and dropped as a mounting position. A real whole-body number
      needs the BSA weighting in vitd_exposure.py over the sites a person
      actually leaves bare. The geometry x BSA coupling flagged in
      VERNEZ_GEOMETRY_MODEL.not_covered (3) is NOT closed by this entry.
      (6) WEIHS 2013 CONTRIBUTES NO PREDICTIVE CONSTANT, AND THE REASON CHANGED
      ON 2026-08-20. It is NOT that the paper contradicts itself -- this entry
      previously said that, on the strength of a Figure 6 digitization that has
      since been withdrawn as unreadable. The paper's Results prose and its
      Discussion agree with each other, and are transcribed into
      vitd_physiology.WEIHS_2013_PROSE_SITE_RATIOS. The real limitation is that
      the prose gives RATIOS BETWEEN SITES ONLY: no absolute ER for any single
      site, and no elevation resolution (all six sequences fall in one 46-64 deg
      band, reported as single random-orientation means). An
      ACTIVITY_ERTA_TABLES entry needs absolute, elevation-resolved values, so
      scaling these ratios against an assumed anchor site would invent the one
      number the paper never states. That is a calibration decision, not a
      transcription, and it is NOT approved here. See open_items below.
    consequence: >-
      NONE to any reported number. No default changed, no existing call site
      passes activity=, and the full suite is green (558 tests on 2026-08-20;
      567 after the Weihs prose-ratio transcription added
      tests/test_physiology.py::TestWeihs2013ProseRatios, still all passing).
      What changed is
      what a caller CAN ask for: a jogger at a known solar elevation can now get
      a measured, site-resolved geometry ratio with a published uncertainty
      interval instead of a behaviourally-averaged scalar. Worked contrast at
      40 deg elevation: shoulders 0.82, across-site mean 0.51, forehead 0.34,
      against the flat 0.35 -- i.e. up to 2.3x the dose per minute depending
      only on WHICH SKIN IS BARE.
    open_items:
      # Forward-looking. NOT approved -- filed so a later session finds the
      # condition and the required approval step instead of re-deriving both.
      - marker: WEIHS-2013-VOR
        date: 2026-08-20
        status: BLOCKED_ON_SOURCE
        blocked_on: >-
          The Weihs et al. 2013 PDF in Research_Papers/ is the "Accepted
          Article" early-view proof and prints its own warning about
          "differences between this version and the Version of Record". Its
          Figure 6 is a grouped range-bar chart -- six sites x four activities,
          min-max bars with a black dot for the mean, series separated only by
          grayscale hatching, shoulders and lower legs hatched identically in
          opposite directions -- and at that resolution it CANNOT be read to
          per-site precision. This is a legibility limit of the copy held, not
          a defect in the paper. The repository owner may be able to obtain the
          Version of Record.
        what_unblocks_it: >-
          A VoR that renders Figure 6 in colour, at higher resolution, or ships
          a supplementary data table with the per-site means.
        then_do: >-
          Re-digitize Figure 6 and attempt a full per-site quantitative entry in
          vitd_physiology.ACTIVITY_ERTA_TABLES for 'walking' / 'sitting' /
          'lying' / 'sitting_up', cross-validating every series against
          WEIHS_2013_PROSE_SITE_RATIOS exactly the way Schmalwieser 2025's
          Figure 5 was cross-validated against its Results text. The prose
          ratios are the acceptance test: a digitization that does not
          reproduce walking shoulders/forehead = 1.70, sitting thighs/forehead =
          1.60, sitting-up lower_legs/forehead = 2.15 and lying
          lower_legs/forehead = 1.55 has been misread again.
        approval_required: >-
          YES. A new predictive per-activity ERTA table is a CALIBRATION, not a
          documentation fix, and needs its own parameter_approvals entry. It
          must NOT be added on the strength of this open item. Anchoring the
          existing ratios to an assumed absolute ER, without a VoR figure, is
          the specific thing this item exists to prevent.
        grep_for: >-
          WEIHS-2013-VOR. The other end of this marker is the [TODO 2026-08-20]
          block in vitd_physiology.py, section "WEIHS et al. 2013 --
          PROSE-SOURCED SITE RATIOS".
    gap_26_status: >-
      PARTIALLY CLOSED, NOT CLOSED. The elevation dependence withdrawn on
      2026-08-16 as unsourced now HAS a source -- for one activity, at seven
      sites, from one subject. Schmalwieser & Siani 2018's actual objection was
      coverage ("for most activities, we still lack the possibility to predict
      the UV exposure of exposed body sites under any condition because ERTAs
      are not fully available") and that objection stands in full: what exists
      is still piecemeal per-activity curves, not a general model. The comment
      block in vitd_physiology section 2b was updated to say exactly this and
      must not be upgraded to "closed" on the strength of one activity.

  BODY_WEIGHT_DILUTION_EXPONENT:
    approved_by: User (repository owner)
    approval_date: 2026-09-22
    approval_basis: >-
      User's answer to decision A5 (body-weight dilution exponent), "i approve the change",
      given during the round answered 2026-09-21/22. Read as approving the
      EXPONENT change only, which is what A5 is named for and the change W-Q
      routed to the user. The companion finding in the SAME diagnostic --
      BMI outperforming weight as the covariate -- is a structural change to
      which covariate the term uses, not to this exponent's value, and is
      NOT covered by this approval. See BMI_predictor_proposal_2026_09_22
      below.
    change: >-
      Body-weight dilution scaling exponent in
      vitd_physiology.body_weight_dilution_factor, as called from
      vitd_model.py's synthesis function (vitd_model.BODY_WEIGHT_DILUTION_
      EXPONENT). Was IMPLICIT 1.0 (exact hyperbolic factor = 70/weight_kg).
      Now 0.24226563069970553 (factor = (ref_kg/weight_kg)**
      0.24226563069970553), i.e. the model's own dilution term moved from
      d(ln D)/d(ln weight_kg) = -1 to -0.24226563069970553.
    source: >-
      scripts/nhanes_weight_dilution_check.py (RECURRING diagnostic).
      Survey-weighted log-log regression, ln(25(OH)D) ~ gamma*ln(weight_kg)
      + age + female, Taylor-linearized design SEs (PSU within stratum),
      NHANES cycles 2001-2023 pooled, LC-MS/MS-harmonized 25(OH)D. Found by
      the NHANES weight-dilution diagnostic (2026-09-21, formerly tracked as
      workstream W-Q step 8); implemented 2026-09-22 (formerly tracked as
      workstream W-X).
    measurement: >-
      Primary row "Adults, unsupplemented (UV+food)" (excludes the
      supplemented dietary_source_flag, to isolate endogenous/dietary
      dynamics, per the script's own stated design): n_unweighted = 29,505,
      design_df = 109. gamma_ln_weight_kg = -0.24226563069970553,
      se = 0.015492158419161762, 95% CI
      [-0.27297058503233146, -0.2115606763670796]. Full precision from
      tables/nhanes_weight_dilution_check.csv. The all-adults row (incl.
      supplemented, n=52,456) gives a close but not identical
      -0.25326055019047544, 95% CI [-0.27575413829351, -0.23076696208744094]
      -- not used, because the script's own docstring designates the
      unsupplemented row as primary.
    recovery_method: >-
      Full-precision value read directly from the existing artifact
      tables/nhanes_weight_dilution_check.csv (written 2026-09-21 10:23,
      confirmed unmodified since via `git status` before use) -- the
      diagnostic was NOT re-run to obtain this value. It WAS re-run
      afterward, unchanged, to confirm reproducibility and to refresh
      nhanes_macro_validation.py per CLAUDE.md's post-calibration-change
      guidance.
    tension_with_prior_evidence: >-
      The replaced exponent (1.0) was never itself a fitted measurement; it
      was a design choice consistent with the FORM Drincic 2012 (Obesity
      20:1444-8, N=686) found -- hyperbolic in total body weight beats
      linear and BMI models -- cross-checked in vitd_physiology.py's own
      comment against Ekwaru 2014's oral-dosing finding (obese need 2-3x,
      overweight ~1.5x the D3 dose; 70/100 = 0.70x there implies exponent
      1). The NHANES check is a DIFFERENT kind of evidence: a cross-sectional
      population association adjusted only for age and sex (not weight
      history, supplementation, sun-seeking behaviour, or any interventional
      design), and it measures a materially smaller exponent than either
      prior source implies. This entry implements the user-approved value;
      it does not adjudicate which evidence is more relevant to this
      model's cutaneous-synthesis dilution mechanism. Recorded, not
      resolved.
    implementation: >-
      vitd_model.BODY_WEIGHT_DILUTION_EXPONENT = 0.24226563069970553, passed
      explicitly as `exponent=` at vitd_model.py's one call site of
      vitd_physiology.body_weight_dilution_factor. That function's own
      default exponent (1.0) is UNCHANGED, so every other caller --
      including tests/test_physiology.py's TestBodyWeightDilution suite,
      which validates the function against the Drincic/Ekwaru literature --
      keeps its previous behaviour untouched. New tests
      (TestBodyWeightDilutionExponentCalibration) validate the new
      `exponent=` parameter and the calibrated constant directly.
    consequence: >-
      ModelParams.body_weight_kg defaults to None and is not set anywhere in
      run_all.py or scripts/ -- only in tests/test_physiology.py.
      body_weight_dilution_factor(None, ...) returns 1.0 regardless of
      exponent. THIS CHANGE THEREFORE HAS ZERO EFFECT ON ANY CURRENT
      HEADLINE OUTPUT, RESULTS.md figure, or NHANES macro-validation result.
      It only changes behaviour for a caller that explicitly sets
      body_weight_kg, which nothing shipped does today. Recorded so a
      future workstream that wires body_weight_kg into a scenario inherits
      the approved exponent rather than the old implicit one.
    dark_skin_direction: >-
      NOT APPLICABLE at present -- see consequence above: the term is inert
      in every current scenario, including every FST V-VI one, so there is
      no FST V-VI burden to move in either direction today. If
      body_weight_kg is wired into a scenario later, the direction depends
      entirely on the weight assumed for that scenario relative to
      BODY_WEIGHT_REF_KG = 70.0, not on skin type -- the mechanism carries
      no FST term.
    not_covered: >-
      BMI as the preferred predictor (9 of 9 strata; see
      BMI_predictor_proposal_2026_09_22 below) is NOT approved by this entry.

  BMI_predictor_proposal_2026_09_22:
    status: NEEDS_APPROVAL
    proposed_by: W-X workstream agent
    date: 2026-09-22
    memo: (workstream W-X, retired 2026-09-23 -- see this entry's own fields, which restate the finding in full)
    parameter_changes: NONE -- prepared, not applied
    what_the_diagnostic_found: >-
      scripts/nhanes_weight_dilution_check.py's model-comparison table: BMI
      beats weight (lower AIC) in 9 of 9 strata (overall unsupplemented, all
      adults, 5 NHANES race/ethnicity groups, 2 exam seasons). dAIC
      (BMI minus weight): overall unsupplemented -453.956948001578; all
      adults -844.2327872032911; Mexican American -68.58163071659419; Other
      Hispanic -32.01988171756693; NH White -93.67261543757195; NH Black
      -0.07256675582902972 (~indistinguishable, |dAIC|<2); NH Asian
      -4.456487488822859; winter/spring -184.35870070183955; summer/autumn
      -234.4598627607411. R^2 rises from the weight model to the BMI model
      in every stratum (e.g. overall unsupplemented 0.048796769119527905 ->
      0.06331974689861275).
    what_is_proposed: >-
      Replace body_weight_kg/body_weight_dilution_factor's covariate with
      BMI: a new ModelParams.bmi field (or a body_weight_kg -> bmi
      conversion requiring height_cm), a body_bmi_dilution_factor() in
      vitd_physiology.py of the same (ref/x)**gamma form, and a BMI-fitted
      exponent from the same NHANES row (gamma_ln_bmi =
      -0.3492674232363697, unsupplemented adults row) in place of
      gamma_ln_weight_kg.
    dark_skin_direction: >-
      NH Black -- the stratum closest to this project's FST V-VI priority
      cohort -- is the ONE stratum where BMI does NOT clearly beat weight
      (dAIC -0.07, ~indistinguishable), unlike every other group. Adopting
      BMI as a universal covariate would therefore be adopting a predictor
      whose advantage is weakest, not strongest, in the priority cohort's
      nearest available NHANES proxy. This does not by itself argue against
      BMI (R^2 still rises slightly, 0.07756741241362886 ->
      0.07757867566984333, and NH Black's own weight-model gamma,
      -0.23562811755138569, is close to the pooled estimate), but it means
      the case for switching is NOT uniformly stronger for the priority
      cohort, and should not be presented as if it were.
    cost: >-
      Requires either collecting/estimating BMI (weight + height) in every
      scenario that would set this term, versus weight alone today; a new
      ModelParams field and a second dilution-factor function; and its own
      calibration_approval.yaml entry once a value is chosen, since this is
      a covariate change, not merely an exponent refit. Because the term is
      currently inert in every shipped scenario (see
      BODY_WEIGHT_DILUTION_EXPONENT.consequence above), there is no headline
      number this would move today -- the cost is entirely in future
      scenario-authoring effort, not in reopening any current result.
    not_covered: >-
      This entry approves nothing. It exists so the proposal is ready to
      merge if the user separately approves it, and so it is not re-derived
      from scratch later. This entry's own fields above (what_the_diagnostic_
      found, what_is_proposed, dark_skin_direction, cost) are the full
      writeup.

  K_const_random_effects_2026_09_22:
    approved_by: user delegation 2026-09-22
    delegation_quote: >-
      "i trust you so everything logical, anything you would actually
      recommend to make this model more accurate, i give u permissions to
      approve in the yaml"
    approval_date: 2026-09-22
    supersedes:
      - K_const_recalibration_2026_09_21
      - K_const_weighting_2026_09_22
    parameter: ModelParams.K_const
    old_value: 1.17
    new_value: 2.10
    estimator_output_full_precision: 2.095887850
    superseded_2026_09_23: >-
      THE ROUNDING ONLY, by K_const_A_full_precision_2026_09_23. The
      estimator, the evidence and the routes are unchanged and everything
      else in this entry stands. The shipped value is now
      2.096070737357932, which is this same pooled estimate re-evaluated at
      the joint (K_const, A) fixed point instead of at the rounded pair, and
      it is carried at full precision. The `rounding` field below records
      the decision that was taken on 2026-09-22 and then withdrawn; it is
      kept, not deleted, because it is why every 2026-09-22 pin reads 2.10.
    rounding: >-
      [WITHDRAWN 2026-09-23, see superseded_2026_09_23 above.]
      2 decimal places, the derivation script's own long-standing
      convention. The rounding is a decision, so it is recorded as one: the
      unrounded pooled estimate is 2.095887850 and the SD across the four
      routes is 1.267, so a third decimal would imply a precision the
      evidence does not carry.
    reproduce_with: >-
      PYTHONIOENCODING=utf-8 python3 scripts/kconst_recalibration.py
      (sections S3b through S4). The joint (A, K_const) fixed-point
      iteration is described in A_reanchor_2026_09_22.
    change: >-
      THREE separate changes compound in this one move and must not be read
      as one recalibration.
      (1) BUG FIX, needing no approval under CLAUDE.md's bug-fix clause: the
      two FIELD routes were a CACHE taken 2026-08-17 (Kift 0.788, Darling
      1.387) and carried through two refits on the stated belief -- written
      into vitd_model.py's own K_const entry until today -- that they are
      "computed independently of M_baseline_by_FST". That belief is FALSE;
      fst_gap_decomposition._invert_cohort_pair calls simulate(). Re-inverted
      live the routes are Kift 2.000652839 and Darling 3.177220715.
      (2) The ITA -> M re-scaling of decision A3 (see
      ita_to_M_clip_release_2026_09_22). It compresses the FST V:II M-gap
      0.582400 -> 0.409091, which raises K_const by 1.4237x for an EXACTLY
      UNCHANGED optical factor -- a reparameterisation, not new evidence.
      (3) The pooling scheme moves from fixed-effect inverse-variance to
      RANDOM EFFECTS (DerSimonian-Laird).
    why_random_effects: >-
      A fixed-effect pool asserts the four routes estimate one common
      K_const and differ only by sampling error. Section S3 of the
      derivation script measures that assertion and rejects it: the two lab
      routes miss in opposite directions by about 40% each, and Young 2020's
      published FST II:VI ratio (1.29-1.43) is SMALLER than Felton 2016's
      FST II:V (2.14) in the same class of cabinet, which is impossible
      under any monotone pigment penalty. Heterogeneity at the shipped
      point: Q = 11.944110 on 2 df, I^2 = 83.255346%. Reporting that under
      fixed effects states a precision the evidence does not have.
    routes_at_the_shipped_point:
      Felton2016: {K_const: 3.194593257, se: 1.213467450, in_pool: true}
      Young2020: {K_const: 0.517394258, se: 0.199219911, in_pool: true}
      Kift2013: {K_const: 2.000652839, se: null, in_pool: false}
      Darling2013: {K_const: 3.177220715, se: 0.944538516, in_pool: true}
    tau2_estimators:
      DL: {tau2: 2.910733275, tau: 1.706087124, pooled_K: 2.095887850,
           se: 1.097619676, ci95: [-0.055407, 4.247183], shipped: true}
      PM: {tau2: 1.960645580, tau: 1.400230545, pooled_K: 2.017021696,
           se: 0.935877092, ci95: [0.182736, 3.851307]}
      REML: {tau2: 2.260287503, tau: 1.503425257, pooled_K: 2.047887634,
             se: 0.990197171, ci95: [0.107137, 3.988638]}
    tau2_estimator_range_on_pooled_K: [2.017021696, 2.095887850]
    hksj_interval_not_adopted: >-
      [-1.8938, 6.0856] at k = 3, t(2) multiplier 4.302653. Computed and
      printed for completeness and deliberately NOT adopted: at k = 3 it
      spans more than the whole physically admissible range of K_const and
      carries no information. Do not quote it.
    kift_exclusion: >-
      Kift 2013 is EXCLUDED from the random-effects pool because it
      publishes no variance ON THE QUANTITY THIS ROUTE INVERTS. It does
      publish a 95% CI on the RAW diet-adjusted serum ratio, but this route
      inverts the contrast AFTER behaviour removal, whose uncertainty is
      unquantified anywhere in this repository; a partial variance used as a
      full one would over-weight the route. NO VARIANCE IS IMPUTED. The
      max-admissible-weight probe re-admits Kift at assumed SEs from 8x down
      to 1x the most precise route's SE: the largest movement in the pooled
      value across the whole sweep is 0.184995537 in K_const (about 8.8% of
      the pooled value), well inside the tau^2-driven interval. NOTE this
      supersedes an earlier unpublished estimate of "<0.01" for the same
      quantity; that figure was computed on the stale field routes and does
      not reproduce.
    darling_now_has_a_variance: >-
      Darling 2013 could not enter any variance-weighted pool before today,
      because this repository's own VARIANCE_PROVENANCE register said the
      paper was "NOT HELD IN THIS REPOSITORY". It is held -- the University
      of Surrey author's accepted manuscript,
      Research_Papers/Vitamin_D_deficiency_Osteoporosis_International_2012.pdf
      -- and its Table 3 prints mean, SD and a per-season n for every one of
      the six cells the field inversion consumes. SE(K) = 0.944538516 by
      delta method (numerical Jacobian through the inversion), cells treated
      as INDEPENDENT, which is the wider and therefore conservative choice
      given Darling's own Table 4 puts a positive between-individual
      variance share on repeated measures.
    darling_n_inconsistency: >-
      The n in Darling is internally inconsistent and the repository had
      been carrying one figure without saying which: abstract 105 Caucasian
      / 35 South Asian; Methods and Table 1, 135 / 46 recruited; Study Power
      section, "39 Asian premenopausal women were recruited"; four-visit
      completers 90 / 35 (the pair Webb 2021 Table 5 labels the route with).
      NONE of those is the right n for this route's variance. Table 3 prints
      its own per-season cell n -- white 113 / 128 / 80, South Asian
      18 / 43 / 26 -- and those are what the SE is built from.
    darling_veiling_flag_dark_skin_priority: >-
      Darling's Discussion states that 75% of the South Asian arm "were of
      Pakistani origin and were partly veiled (showing hands and face
      only)". Darling publishes no exposed-BSA figure, so the inversion
      equates its cohorts' exposed BSA to Kift 2013's diary percentages; for
      a veiled arm that is too high, the badge dose is spread over more skin
      than was exposed, and the shortfall is charged to PIGMENT. This route's
      K_const is therefore BIASED UPWARD. Darling is KEPT in the pool -- it
      is one of only two field routes and the only one outside Manchester --
      with the flag carried at every point of use and a sensitivity variant
      reported beside the headline.
    darling_veiling_sensitivity:
      headline: {exposed_bsa: 0.14, K_const: 3.177220715,
                 fst_V_II_optical: 3.668460570}
      veiling_variant: {exposed_bsa: 0.1025, K_const: 2.906476277,
                        fst_V_II_optical: 3.283838533}
      how_0_1025_was_chosen: >-
        "Hands and face only" converted by the Wallace rule of nines --
        anterior head about 4% BSA plus two hands about 5% (2 x 2.5%,
        palmar and dorsal) = 0.09 -- applied to the 75% who were partly
        veiled, with the remaining 25% left at Kift's 0.14:
        0.75 * 0.09 + 0.25 * 0.14 = 0.1025. THE RULE-OF-NINES CONVERSION IS
        THIS REPOSITORY'S GEOMETRIC ASSUMPTION, NOT DARLING'S; the paper
        prints no BSA at all, so the variant BOUNDS the veiling bias rather
        than measuring it.
    darling_never_uses_fitzpatrick: >-
      The words "Fitzpatrick", "phototype" and "skin type" do not appear
      anywhere in Darling 2012 (verified by full-text search of the accepted
      manuscript). Its groups are "Caucasian" and "Asian". The FST II and
      FST V labels this repository attaches to them are INFERRED FROM
      ETHNICITY here, and that inference is what lets an ethnicity contrast
      be read as a pigment contrast. Recorded because it is load-bearing for
      two of the four routes this parameter rests on.
    six_route_values_verified: >-
      All six Darling cells the inversion reads were checked against the
      primary source and match what the repository carried via Webb 2021
      Table 5 exactly: white 6.39 SED/week summer, 72.1 summer 25(OH)D,
