combined_feasibility_map_2026_09_21:
  status: RECORDED
  parameter_changes: NONE
  recorded_by: W-Q workstream agent
  date: 2026-09-21
  supersedes: parameter_approvals.K_const.consequence (the K_const-only map)
  before_set: "K_const = 0.33, A = 2.353 (BEFORE_SETS['combined'])"
  after_set: "live ModelParams() -- K_const = 1.15, A = 4.125, biphasic"
  constraints_unchanged: >-
    50 nmol/L floor held every day from day 90 to 365, uniform dosing,
    D0 = 25.0 nmol/L, 70% MED per session (C1), 120 min per session at UV
    index 6 (C7). Nothing was relaxed; the map measures where they bind.

  why_the_combined_map_differs: >-
    The K_const-only map reports FOUR cells lost and NONE gained, which
    reads as a uniform tightening. The combined map reports TWO lost and
    THREE gained, and the gains and the losses fall on opposite ends of the
    pigmentation range. K_const and A move feasibility in opposite
    directions and are not separable, so the single-parameter slice both
    overstates the loss at FST IV and conceals the gain at FST I-III. That
    is precisely the failure mode the `outstanding:` clause was guarding
    against.

  what_moved_combined:
    lost:
      - "FST V,  N=104 -- now blocked by C7 session length (>120 min)"
      - "FST VI, N=146 -- now blocked by C7 session length (>120 min)"
    gained:
      - "FST I,   N=104 -- was C1-infeasible, now 0.84 SED / 27 min"
      - "FST II,  N=104 -- was C1-infeasible, now 1.05 SED / 33 min"
      - "FST III, N=104 -- was C1-infeasible, now 1.39 SED / 44 min"

  minimum_feasible_and_under_120min_budget:
    grid: "(52, 104, 146, 183, 260, 365)"
    before_combined: "I 146 | II 146 | III 146 | IV 104 | V 104 | VI 146"
    after:            "I 104 | II 104 | III 104 | IV 104 | V 146 | VI 183"
    note: >-
      The AFTER row reproduces
      tests/test_vitd_optimization.py::TestRecalibratedFeasibility exactly
      (104/104/104/104/146/183), and its minutes/day at N=365 reproduce that
      class's pinned table to the rounding the script prints. The map is
      therefore consistent with the suite, not an independent third number.

  minutes_per_day_at_uvi6_n365:
    before_combined: "I 11 | II 12 | III 13 | IV 15 | V 17 | VI 19"
    after:            "I  6 | II  7 | III  9 | IV 13 | V 18 | VI 27"

  dark_skin_priority_reading: >-
    [FST V-VI, the priority cohort] The combined move makes sun-alone
    sufficiency EASIER for FST I-III and HARDER for FST V-VI. FST VI's
    daily requirement at UV index 6 rises from 19 to 27 min/day, and its
    minimum feasible-and-under-120-min budget rises from N=146 to N=183
    (alternate days). FST V loses N=104 (twice weekly) to the session-length
    ceiling. Read the infeasible cells as "sun alone, at this latitude proxy
    and this session budget, does not hold 50 nmol/L year-round without
    exceeding a non-burning dose" -- the same conclusion Webb 2018 and
    Kift 2013 reach for FST V in the UK from measured data.

  attribution_full_factorial: >-
    K_const x A x feedback_mode at N=104, from --factorial. The
    non-separability is visible directly: at FST VI, N=104, the cell is
    feasible at (0.33, 2.353, linear) at 3.499 SED / 111.1 min, C7-infeasible
    at (0.33, 2.353, biphasic) at 4.515 SED / 143.3 min, feasible again at
    (0.33, 4.125, biphasic) at 1.438 SED / 45.6 min, and C7-infeasible at the
