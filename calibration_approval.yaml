  - name: "M_TAN_HEADROOM 0.20 -> 0.238 (melanin ceiling)"
    date: 2026-08-25
    status: APPROVED
    approved_by: User (repository owner), 2026-08-25
    value_adopted: 0.238
    value_rationale: >-
      0.238 is the largest tan Ravnbak actually measured (dM = 0.237724 exactly,
      rounded up at the third decimal), so the ceiling accommodates every
      observed tan. It sits inside the free-fit range [0.230880, 0.268013]
      spanned by the three candidate scale maps. Chosen by the repository owner
      in preference to the power-map point estimate 0.230880, which would have
      left the two largest Ravnbak tans unrepresentable.
    derivation: scripts/fit_melanin_kinetics.py
    sources:
      - >-
        Ravnbak MH, Philipsen PA, Wulf HC. Skin pigmentation kinetics after UVB
        exposure. Acta Derm Venereol 2008; 88:223-228. PMID 18480919.
        Table II (absolute pigmentation-% increase, 6 and 12 exposures at
        0.8/0.6/0.4 MMD) and Table I (per-FST pre-exposure pigmentation-% and
        single-exposure MMD in SED).
      - >-
        Miyamura Y, Coelho SG, Schlenz K, et al. The deceptive nature of UVA
        tanning versus the modest protective effects of UVB tanning on human
        skin. Pigment Cell Melanoma Res 2011; 24(1):136-147. PMID 20979596.
        Used as the UVA negative control and as an out-of-sample check; NOT
        pooled into the fit.
      - >-
        Ravnbak MH, Philipsen PA, Wulf HC. Skin pigmentation kinetics after
        exposure to ultraviolet A. Acta Derm Venereol 2009; 89:357-363.
        NEGATIVE CONTROL ONLY -- see not_covered.
    what: >-
      M_TAN_HEADROOM is the facultative tanning headroom above constitutive
      pigment, on the model 0-1 melanin index. It is currently 0.20 and is
      flagged [PRIOR] in vitd_model.py with no independent source; the stated
      rationale is structural ("keeps FST I-III behaviour close to the old
      global 0.95 ceiling while making tanning monotone for every FST").
      Ravnbak 2008 Table II, converted onto the model index through a map
      anchored on the four per-FST pre-exposure pigmentation-% values, gives
      measured tans of dM = 0.192 to 0.238. Several of those EXCEED the entire
      shipped headroom, so the model cannot represent Ravnbak tans at any
      alpha. Refitting with headroom free returns 0.231 (power map), 0.265
      (quadratic) and 0.268 (linear), and the value is stable at 0.221-0.229
      across a four-decade profile of alpha.
    consequence: >-
      Raises the melanin ceiling reachable by tanning, which increases
      facultative self-shielding at high cumulative dose and therefore
      slightly reduces synthesis late in long protocols. Interacts with
      K_ATTEN (facultative attenuation, active at 0.288972). Downstream effect on
      headline numbers is NOT yet quantified -- run_all.py has not been re-run
      against this value.
    not_covered: >-
      This entry does NOT approve any change to alpha, alpha_by_FST,
      alpha_max or UV_halfmax. The same fit shows those are NOT IDENTIFIABLE
      from this evidence: profiling alpha from 0.0025 to 1.0 moves the weighted
      residual by under 25%, because Ravnbak used only two exposure counts
      (6 and 12) and the tan is already near plateau at 6. They stay PRIOR at
      their shipped values.
      It also does NOT approve pooling Ravnbak 2009 (UVA) into any melanin
      fit. Miyamura 2011 Table 1 shows UVA raises epidermal melanin content
      not at all (8.62 vs 9.03 a.u., NS) while producing a comparable visible
      tan; fitting the model ATTENUATING melanin to UVA reflectance data would
      credit the model with photoprotection that does not exist.

  - name: "SC_max_by_FST I-III 0.23 -> 0.24 (stratum corneum ceiling)"
    date: 2026-08-25
    status: APPROVED
    approved_by: User (repository owner), 2026-08-25
    derivation: scripts/fit_melanin_kinetics.py  (sec. 6)
    value_adopted: 0.24
    sources:
      - >-
        de Boer 2025 Supplementary Table S1. FP I-III stratum corneum
        5.6 -> 6.9 um, i.e. +23%. This was the sole basis for SC_max until now.
      - >-
        Miyamura Y, Coelho SG, Schlenz K, et al. Pigment Cell Melanoma Res
        2011; 24(1):136-147. PMID 20979596. Table 1: stratum corneum
        16.6 -> 20.7 um in FST II-III after 10 suberythemal UVB exposures over
        2 weeks, i.e. +24.6988%. Independent cohort, protocol and measurement
        method (histology of formalin-fixed biopsies vs de Boer's technique).
    what: >-
      Two independent studies now bracket the FST I-III stratum corneum
      thickening ceiling at +23% and +24.6988%. 0.24 sits between them. The
      midpoint is 0.238494; 0.24 was chosen by the repository owner as the
      round value inside the bracket.
    consequence: >-
      Slightly increases SC attenuation at full adaptation for FST I-III,
      reducing synthesis late in long protocols. FST IV-VI unchanged at 0.36.
      The SC_max scalar default (0.30) is unchanged and remains the I-III /
      IV-VI midpoint to within 0.0.
    not_covered: >-
      Does NOT tighten SC_max from prior to calibrated. Miyamura reports SEM
      with n=6 and did not measure vitamin D, so this corroborates MAGNITUDE
      only. CLAUDE.md still requires SC_max be flagged as an uncalibrated prior
      whenever absolute D predictions are presented.
      Does NOT extend to FST IV-VI: Miyamura enrolled FST II-III only, so the
      0.36 value still rests on de Boer alone. Per the dark-skin priority
      directive this is the gap that matters most and it remains open.
      Does NOT touch alpha_SC, k_decay_SC, K_SC or k_damage.

  - name: "beta provenance upgrade (NO value change)"
    date: 2026-08-25
    status: NOT_GATED
    derivation: scripts/fit_melanin_kinetics.py
    what: >-
      beta stays at ln(2)/56 per day. What changed is where it comes from.
      It was previously a stated guess ("a mid-range estimate compatible with
      Ravnbak 2008 if complete fading requires ~3 e-folding times",
      RESULTS.md:445). Ravnbak's Methods specify that "days to total fading"
      was produced by fitting a LINEAR regression to pigmentation at 1 week,
      2 months and 4 months and extrapolating to zero. That procedure is fully
      specified and therefore invertible: assuming exponential decay, sampling
      it on Ravnbak's timepoints, fitting OLS and taking the x-intercept
      reproduces their 132-175 d for any true half-life in roughly 40-70 d.
      The shipped 56 d sits near the middle of that band.
    not_covered: >-
      No point estimate is adopted. Ravnbak mixed 2-point and 3-point
      regressions in unreported proportion (2-point was used "when fading was
      completed at the 4 months control"), and that choice alone moves the
      inverted half-life from ~48 d to ~74 d. Quoting a single fitted beta
      would over-read the data. The manuscript status flag "VERIFIED" for beta
      should be softened to DERIVED with the 40-70 d range quoted.

standing_directives:
  # Cross-cutting instructions from the repository owner, 2026-08-17. These
  # govern HOW every entry below is to be executed, not any single parameter.
  dark_skin_priority:
    date: 2026-08-17
    directive: >-
      This is a DARK-SKIN-PRIORITY model. Where evidence exists for FST V-VI,
      prefer it. Where a number is derived from light-skinned participants and
      extrapolated to darker skin, FLAG IT EXPLICITLY at the point of use. Do
      not privilege UK/British-population data merely because it is abundant.
    known_light_skin_extrapolations:
      - >-
        Young 2021 revised vitamin D action spectrum: derived from FST I-II
        volunteers ONLY (n = 75, mean age 26.5). Verified 2026-08-17 by reading
        the full text in Research_Papers/. Any E_source derived from it is a
        light-skin extrapolation when applied to FST V-VI.
      - >-
        CIE erythemal weighting (which defines the UV Index itself) is anchored
        to light skin. Any ambient-UVI input path inherits this.
      - >-
        Webb 2018 'Colour Counts' (Nutrients 10:457) IS an FST V study, but at
        UK latitudes. Its FST V physiological targets are among the very few
        naturalistic dark-skin numbers in existence and are retained; its UK UV
        climatology is deprioritised as geographically narrow.
  grounding_requirement:
    date: 2026-08-17
    directive: >-
      Every number, formula and choice must be traceable to a printed source.
      Mark anything estimated, approximated or chosen with an explicit
      [ESTIMATE] or [CHOICE] tag at the point of use. Do not invent
      coefficients; report what a source does not provide rather than filling
      it in.

decisions_2026_08_17:
  # Direction decisions that are NOT parameter calibrations, recorded here
  # because they determine what the model reports.
  - name: "A1 melanin penalty -- DIAGNOSE FIRST, do not recalibrate yet"
    date: 2026-08-17
    decided_by: User (repository owner)
    status: DIAGNOSIS_IN_PROGRESS
    decision: >-
      Three independent sources say the between-skin-type penalty is 2-3x too
      weak (Webb/Kift 2.5-3.0x vs model 1.40x; Kallioglu VI:I 5.00x vs 1.62x
      and V:II 2.40x vs 1.43x; NHANES Part B within-change contrast). The owner
      explicitly chose NOT to change K_const or K_ATTEN yet, and to first
      quantify how much of the gap is OPTICAL (belongs in K_const/K_ATTEN) and
      how much is BEHAVIOURAL/EXPOSURE (belongs in a separate term).
    rationale: >-
      CORRECTED 2026-08-17, same day it was written. The original rationale
      recorded here said "Gap 23 establishes that Webb/Kift's 2.5-3.0x is not
      purely optical -- it bundles clothing, time outdoors and geography".
      THAT IS THE INVERSE OF WHAT GAP 23 SAYS, and gap 23 is explicitly a
      correction of that same belief. Webb/Kift's 2.5-3.0x is Farrar 2013
      simulated sunlight at matched ~35% BSA: lamp-based, matched-dose, NO
      behaviour. The original rationale also cited Kallioglu as "a pure
      simulation containing no behaviour" -- true, but irrelevant, because
      Kallioglu was withdrawn entirely on 2026-08-17 as an erythema MED table.
      THE DECISION TO DIAGNOSE BEFORE RECALIBRATING STANDS, on better grounds:
      the separation is measurable, and it was measured. Two independent
      routes -- within-study matched-dose lab trials (Felton 2016, Young 2020)
      and field personal-dosimetry inversion (Kift 2013, Darling 2013) --
      converge on an OPTICAL ratio of 1.7-2.7x, against an incumbent K_const
      delivering 1.26x and a behaviour-blind figure of 4.3-5.7x. Attributing
      the whole gap to pigment would overshoot every matched-dose measurement
      in existence.
    not_covered: >-
      No parameter value is approved for change by this entry. A separate
      approval is required once the diagnosis lands.
  - name: "A3 primary scheduling metric"
    date: 2026-08-17
    decided_by: User (repository owner)
    status: PRIMARY_HALF_IMPLEMENTED_2026_09_19__TRI_OBJECTIVE_ROUTED_TO_W_R
    decision: >-
      Primary: minimum dose/sessions required to REACH AND HOLD sufficiency --
      i.e. how little exposure is actually needed. gross_synth_per_SED is
      retained as a BACKGROUND/secondary metric only. Additionally requested: a
      formulation for best SED at least spacing and fewest sessions while
      accounting for skin-cancer risk.
    rationale: >-
      gross_synth_per_SED has no interior optimum (gap 19) -- it rises
      monotonically as dosing approaches zero, and at its reported 21-30 d
      'optima' final D is BELOW the starting baseline, a net loss. It cannot be
      the primary metric. The minimum-sessions-to-hold-sufficiency formulation
      is the one now bound as TIER_PRIMARY in
      vitd_objectives.OBJECTIVE_HIERARCHY; the register that first recommended
      it (section 5.3) was purged 2026-09-19.
    not_covered: >-
      The tri-objective form (dose x spacing x cancer risk) is a NEW objective,
      not a re-weighting of an existing one. The FST susceptibility term in
      vitd_physiology.cancer_risk remains an order-of-magnitude prior and is NOT
      anchored by Elwood & Jopson, so cross-skin-type comparisons of risk index
      VALUES stay unreliable even though interval and minutes columns do not
      depend on it.
    implementation_status_2026_09_19: >-
      W-E bookkeeping pass (status as of 2026-09-19). PRIMARY
      HALF IS IMPLEMENTED, not merely planned. Evidence: `vitd_objectives.py`
      defines `OBJECTIVE_HIERARCHY`, a machine-readable ranking with
      `TIER_PRIMARY` bound to `minimum_schedule_for_sufficiency` -- "least
      dose and fewest sessions that reach and hold `target`"
      (vitd_optimization.py:1403-1416) -- and `TIER_DIAGNOSTIC` bound to
      `gross_synth_per_SED`, whose own diagnostic function asserts its tier at
      runtime (`assert objective_tier("gross_synth_per_SED") ==
      TIER_DIAGNOSTIC`, vitd_optimization.py:1776) rather than merely
      documenting it. Enforcement is structural:
      `vitd_objectives.assert_reportable_as_headline()` raises rather than
      prints if a DIAGNOSTIC-tier metric is presented as advice.
      `run_all.py`'s section 0 ("Which number is the answer — the objective
      hierarchy", run_all.py:716-739) is generated FROM
      `OBJECTIVE_HIERARCHY` rather than hand-written, and states exactly this
      decision's ranking: PRIMARY = minimum dose/sessions to reach and hold
      sufficiency; SECONDARY = the tri-objective frontier and fixed-budget
      risk minimisation; DIAGNOSTIC = `gross_synth_per_SED` and
      `net_final_D_change_per_SED`, barred from being reported as advice.
      CLOSING the primary-metric half of this entry as done; no further
      action needed on it. The tri-objective half (`not_covered` above,
      dose x spacing x cancer risk as a genuinely new objective function) is
      OUT OF SCOPE for this bookkeeping pass and is ROUTED to the A3
      tri-objective workstream (approved 2026-09-22, entry
      a3_tri_objective_2026_09_21 below).

a1_diagnosis_result_2026_08_17:
  # OUTCOME of the "diagnose first" decision above. The diagnosis is COMPLETE.
  # Reproduce with: PYTHONIOENCODING=utf-8 python3 scripts/fst_gap_decomposition.py  (~12 min)
  status: DIAGNOSIS_COMPLETE_CALIBRATION_APPROVED
  approved_by: User (repository owner)
  approval_date: 2026-08-17
  finding: >-
    The model's FST V:II OPTICAL ratio should be 1.7-2.7x. Two INDEPENDENT
    routes converge there: within-study matched-dose lab trials (Felton 2016,
    Young 2020) give 1.5-2.9x; field personal-dosimetry inversion with
    behaviour removed (Kift 2013, Darling 2013) gives 1.7-2.7x. The incumbent
    K_const = 0.33 delivers 1.26x -- too weak by 1.4-2.1x, NOT by the 2-3x that
    the purged gap-22 record claimed (the live decomposition is
    vitd_benchmark_webbkift.py and scripts/fst_gap_decomposition.py S1b).
    Attributing the whole observed gap to
    pigment would require 4.3-5.7x, above every matched-dose measurement that
    exists.
  sign_error: >-
    SHARPEST RESULT, and it is a direction error rather than a magnitude one.
    Felton et al. 2016 (Br J Dermatol 175:1320-1328) is within-study, matched
    dose (1.3 SED x3/wk x6 wk), matched BSA (~35%), same cabinet both arms:
    phototype II 36.5 -> 54.3 (+17.8), phototype V 17.2 -> 25.5 (+8.3),
    observed ratio 2.14x. AT THE INCUMBENT K_const THE MODEL PREDICTS FST V
    GAINING MORE THAN FST II (0.96x) -- the opposite direction. Mechanism:
    FST V's lower baseline buys more headroom under the (1 - D/D_max) feedback
    term than the incumbent melanin term removes. Verified from the paper's own
    abstract; note its PDF text layer drops decimal points ("365" = 36.5).
  three_lines_collapsed: >-
    The "three independent converging lines" of gap 22 do not survive audit.
    (1) Kallioglu 2024 WITHDRAWN -- its Table 3 is an erythema MED table and its
    published minutes are exactly 5.05 * MED/200. (2) Webb/Kift COUNTS ONE
    NUMBER TWICE -- Webb 2018 set FST V's cap at 2.75 SED and 25 min is simply
    the time to reach it, so the minutes ratio 2.78x IS the dose-cap ratio;
    vitd_benchmark_webbkift.py asserted on both as if independent. (3) NHANES
    Part B forces the behavioural share to 1.0 by construction and constrains
    only the product, so it cannot separate optics from behaviour.
    The decomposition does NOT rest on any of these three -- it rests on Felton
    2016 + Young 2020 (lab) and Kift 2013 + Darling 2013 (field), all four of
    which were already in the repo.
  behaviour_is_real_and_separate: >-
    The behavioural share is 2.1-2.4x and is SHADE AND CLOTHING, not posture.
    Kift's cohorts spent equal or MORE time outdoors (69 vs 63 min/d) yet
    received personal doses of 0.9-2.9% of ambient -- one to two orders of
    magnitude below any unshaded Vernez sky-visibility value. This is why it
    must live in its own term and NOT be absorbed into K_const: a scheduling
    tool exists to ask people to change their behaviour, so behaviour baked
    into a pigment constant would make the model wrong for exactly the users
    who act on it.
  cannot_be_resolved: >-
    (1) FST VI -- every FST VI datapoint in the repo is lamp-based; no field
    dosimetry exists in FST VI or in African-ancestry populations. Every V:II
    figure here is FST V South Asian at UK latitude. (2) Whether the 1.7-2.7x
    residual is optics or unmeasured exposure -- the field inversion cannot
    separate them; it is bounded above by the lab bracket, which is why the
    overlap carries the result. (3) Rhodes 2010's pre-course 25(OH)D is still
    unobtained; it is no longer load-bearing but would narrow the cross-trial
    estimate more than any other single acquisition.
  cannot_be_resolved_correction_2026_09_22: >-
    CORRECTION to clause (3) above, left in place per this file's own
    "record of past decisions" convention (do not overwrite history here).
    Verified FALSE by a full-text read (2026-09-21) of
    Research_Papers/PMID 20072137.pdf, confirmed Rhodes et al. 2010, J Invest
    Dermatol 130(5):1411-1418). Two things in clause (3) do not hold: (a)
    "still unobtained" is stale -- the paper is in the repo and has now been
    read in full; (b) "would narrow the cross-trial estimate more than any
    other single acquisition" is not just unconfirmed, it is impossible as
    stated. Rhodes 2010 enrolled 120 white Caucasians, FST I-IV only (Table
    1: I 7.3%, II 55.0%, III 36.7%, IV 0.9%) -- ZERO FST V or VI subjects --
    and its own multiple regression on post-course 25(OH)D (Table 2) does not
    include skin type as a covariate at all; it reports one pooled
    cohort-level delta, not a per-FST breakdown. The K_const cross-trial
    estimate is built entirely from within-study FST CONTRASTS (W-J sec 1);
    Rhodes 2010 contains no between-phototype contrast of any kind, so there
    is no ratio for it to narrow. It cannot enter as a fifth route. (Rhodes
    2010 remains useful for other things -- a large light-skin absolute
    dose-response record and circumstantial corroboration of Felton 2016's
    cabinet (see docs/SOURCES.md); just not this.)
  cannot_be_resolved_correction_2026_09_23: >-
    CORRECTION to clause (1) above, decision C5(ii), left in place per this
    file's "record of past decisions" convention. "No field dosimetry exists
    in FST VI or in African-ancestry populations" is true of THIS REPOSITORY,
    not of the literature. Personal electronic-dosimeter studies of deeply
    pigmented South African outdoor workers exist (Nkogatse et al. 2018,
    Photochem Photobiol 95(1):439-445, PMID 30183090: personal daily dose 24%
    of ambient, behaviour-inclusive; Blesic et al. 2016, PMID 27553989;
    Blesic et al. 2019, PMID 31830694), plus Fajuyigbe et al. 2018 Photochem
    Photobiol (PMID 29869793) for erythema in black West African skin. All
    four are in paper/references.bib as read-but-not-cited; none is obtained
    in full text and none feeds a parameter. Every other statement in clause
    (1) stands: every FST VI datapoint IN THE REPO is lamp-based.

approved_2026_08_17_pending_implementation:
  # Blanket approval given 2026-08-17 ("my approvals: everything"), conditional
  # on the grounding_requirement above.
  # STATUS AS OF 2026-09-19 (W-E bookkeeping pass):
  # the header comment above used to read "NONE of these are implemented yet"
  # -- no longer accurate for three of the five. A2 deferred to Wave 2
  # workstream W-F (the D_max source hunt). A4 superseded twice over by later,
  # already-approved entries (see its `status` below). A5 re-scoped
  # DEFERRED_BY_DESIGN, per its own text. A6 is factually stale and rewritten
  # SUPERSEDED: K_ATTEN was reinstated 2026-08-21 and is not 0.00. A7's band
  # change turns out to be ALREADY SHIPPED in vitd_validation.py -- see its
  # `status` below and the corrected "Sanity 3 acceptance band" entry under
  # pending_approvals, which this pass reconciled but did NOT approve.
  - id: A2
    name: "D_max = 150 -> saturating feedback form"
    why: >-
      Gap 19/20: the feedback term sets the interval ranking, making this the
      most influential number in the model, and its origin was never found
      (not in Bogh 2010; PMID 19812604 max was 116 nmol/L). Real 25(OH)D
      regulation acts on 1,25(OH)2D via CYP24A1 induction, not a hard ceiling.
    status: IMPLEMENTED_2026_08_18__CLOSED_2026_09_20
    resolution: >-
      2026-09-20 (W-F). SUPERSEDES the 2026-09-19 W-E note, which deferred this
      item on the premise that building a saturating form "would bake in the
      unsourced 150.0". That premise was wrong in both directions. A2 had
      ALREADY shipped on 2026-08-18: the default feedback_mode became
      'biphasic' (Scholze et al. 2026), and the biphasic form REMOVES D_max
      from the default path rather than baking it in. Verified 2026-09-20 by
      direct simulation: final D at FST VI is bit-identical
      (49.37876085210202) for D_max = 116, 150, 250 and 1e9, delta exactly 0.0.
      tests/test_vitd_model.py::test_D_max_override_is_inert_in_the_default_mode
      asserts the same thing, and RESULTS.md reports D_max one-at-a-time
      sensitivity as 0.00 / 0.0% at both FST 5 and FST 6.
      Likely cause of the confusion: 'saturating' is ALSO a literal
      feedback_mode name in this repo -- an exponential variant that was
      investigated and explicitly NOT adopted. A2's prose sense and that mode
      literal are different things.
      CONSEQUENCE for the A~D_max ridge reported at 1.0000: it is a rank-1
      DEGENERACY, not a confounding. D_max contributes zero sensitivity, so the
      pair's reported ss_D spread is A's own one-at-a-time swing. The same
      applies to alpha_SC~SC_max. Both exactly-1.0000 pairs pair a live
      parameter with a dead one; the informative ridges are those BELOW 1.0000.
      No parameter value changed by this entry.
  - id: A4
    name: "A = 2.353 recalibration toward Young 2021 midpoint"
    why: >-
      Model gives ~1.85 nmol/L per SED at 85% BSA against Young 2021's reported
      fair-skin 2.0-5.0. Shifts absolute D roughly 50%; scheduling rankings
      unchanged. NOTE: Young 2021 is FST I-II only -- see dark_skin_priority.
    status: SUPERSEDED
    resolution: >-
      2026-09-19 (W-E bookkeeping pass). Overtaken twice over; not
      implemented as written and no longer actionable as written. The `A`
      entry above (approved 2026-08-17, implemented 2026-08-18) already moved
      A past this item's starting point of 2.353, to 3.114, on the same Young
      2021 3.48 nmol/L/SED anchor this item cites. `A_reanchor_2026_09_06`
      then moved it again, 3.114 -> 4.125 (A = 3.48 / 0.843668 =
      4.124845215356494, rounded to 4.125), recomputed on the identical
      anchor because BSA_EXP and K_const changed under it in the same
      commit. Shipped value: A = 4.125 (vitd_model.py:1378). This item's
      dark_skin_priority caveat -- Young 2021 is FST I-II only -- is
      preserved and, per A_reanchor_2026_09_06's own not_covered clause, is
      now MORE load-bearing than when this item was written: A is larger, so
      more of the model's absolute level rests on an FST I-II anchor.
      No further action; closed.
  - id: A5
    name: "Vitamin D action spectrum: CIE-174 vs Young 2021"
    why: >-
      CLARIFIED 2026-08-17: neither spectrum is currently in force. The core
      model does not compute spectral integrals at all -- E_source values are
      direct table reads from Webb 2021. Only scripts/bogh2012_ablation.py (a
      retired sensitivity tool) and vitd_dose_conversion.py (which takes the
      name as an argument) load the CSVs. This choice becomes live only when
      E_source is derived as a function of solar zenith angle. Defer to that
      point rather than deciding it in the abstract.
    status: DEFERRED_BY_DESIGN
    trigger: >-
      Becomes live only when E_source is derived as a function of solar
      zenith angle, i.e. if/when the core model starts computing spectral
      integrals instead of reading E_source as a direct table lookup from the
      Webb 2021 SOURCE_CALIBRATION_TABLE. Re-verified 2026-09-19 (W-E
      bookkeeping pass): still true today -- no spectral-integral code path
      exists in the core pipeline; scripts/bogh2012_ablation.py (retired
      sensitivity tool) and vitd_dose_conversion.py (spectrum name as an
      explicit argument) remain the only CSV consumers. Re-open this item at
      the trigger point rather than deciding the spectrum question in the
      abstract now. No change made.
  - id: A6
    name: "Retire K_ATTEN as a free parameter"
    why: >-
      It is 0.00, swings steady-state D by 0.3% across its full plausible range,
      and is jointly unidentifiable with both K_SC and K_const (gap 25).
      Reporting it as separately calibrated overstates the evidence.
    status: SUPERSEDED
    resolution: >-
      2026-09-19 (W-E bookkeeping pass). Factually stale and contradicts the
      shipped model: K_ATTEN is not 0.00. It was reinstated as an active,
      calibrated parameter on 2026-08-21 (user-approved) and re-derived to
      K_ATTEN_DEFAULT = 0.288972 on 2026-08-25 (vitd_model.py:1264, module
      docstring line ~526; M_TAN_HEADROOM 0.20 -> 0.238, Ravnbak 2008).
      RETIRED_PARAMETERS is now {} (vitd_model.py:1267) -- nothing is
      retired. Retiring K_ATTEN is therefore not a live bookkeeping item; a
      fresh case would have to be made against the reinstated, calibrated
      value, which this item does not make and this pass does not attempt.
      REPORTED, NOT REMOVED (per this wave's file ownership -- W-C owns
      comments/strings in vitd_*.py this wave): orphaned retirement
      machinery this reinstatement leaves behind --
      `RETIRED_PARAMETERS: Dict[str, str] = {}` (vitd_model.py:1267), the
      `__setattr__` retirement guard (vitd_model.py:1751, a no-op today since
      the dict it checks is empty), `allow_retired_parameter_sweep()`
      (vitd_model.py:1280, has nothing left to sweep), and the downstream
      `vm.RETIRED_PARAMETERS`-conditioned branches in
      spacing_study/run_spacing_study.py. [RE-VERIFIED 2026-09-23: the
      formerly-flagged unconditional "K_ATTEN is retired at zero" prose
      blocks no longer exist as unconditional text -- every live mention
      found by grepping the current file for "retired at zero"/"pinned at
      zero"/"is retired" (lines 843, 974, 1024, 1119, 1124, 1165, 1251) is
      now either gated on a runtime flag (`_katten_retired`, `h_mel_dead`,
