    change: >-
      BOTH figures are recorded, with the discrepancy flagged rather than
      resolved. Fajuyigbe et al. 2018 states an erythema-slope ratio of 8.4x
      between extreme skin colours; recomputing that ratio from the paper's
      own printed slopes gives 7.59x. The repository does not know which is
      right -- the difference could be rounding in the printed slopes, a
      different pair of slopes than the recomputation assumes, or an error
      in the text -- so both are carried with their provenance and neither
      is presented as "the" value.
