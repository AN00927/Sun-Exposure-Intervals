# Calibration governance.
#
# Distinguishes two things the previous version conflated:
#   - CALIBRATION: changing a scientific parameter to improve agreement with
#     data. Still gated -- requires human approval.
#   - BUG FIXES: correcting code that does not implement the documented model
#     (unit errors, state-update errors, inverted signs). NOT gated. Refusing
#     to fix a known defect because "parameters are locked" freezes in the
#     error, and the old freeze flags did exactly that.

calibration_allowed: true
bug_fixes_allowed: true

human_approved: true
approved_by: User (repository owner)
approval_date: 2026-08-09
approval_scope: >-
  Covers every entry in parameter_approvals below, each of which was reviewed
  against its own stated source, derivation function and not_covered clause.
  It does NOT extend to future parameter changes: a new entry starts at
  NEEDS_VERIFICATION regardless of this file-level flag.

allowed_calibration_parameters:
  - INTERMITTENT_BURN_EXPONENT
  - SCC_DOSE_EXPONENT
  - MELANIN_ATTENUATION_KAPPA
calibration_set:
  - Elwood & Jopson 1997 (Int J Cancer 73:198) odds ratios
  - Moan et al. 1989 (Cancer Res 49:5207) biological amplification factors
  - Fajuyigbe et al. 2018 (FASEB J 32:3700) basal:whole CPD protection ratio
validation_set:
  # Held out from every fit above. Used only to score the result.
  - Gandini et al. 2005 III (Eur J Cancer 41:2040) melanoma RR by skin type
  - Shih et al. 2018 (J Invest Dermatol 138:2244) pooled basal:whole CPD slopes
  - Shih et al. 2018 MED table vs Fajuyigbe whole-epidermis protection factor

# Per-parameter approvals. Each entry carries its own sign-off, so a later
# parameter cannot inherit approval from an earlier one. The file-level flag
# above summarises these; it does not substitute for them.
parameter_approvals:
  INTERMITTENT_BURN_EXPONENT:
    approved_by: User (repository owner)
    approval_date: 2026-08-08
    change: "value UNCHANGED at 3.0; provenance changed from an underived
      modelling choice to OR-anchored"
    source: >-
      Elwood & Jopson 1997 melanoma odds ratios (intermittent 1.71, sunburn
      1.91, heavy occupational 0.86). Cited values only -- the paper itself is
      NOT in Papers_and_Datasets/ (see MODEL_AND_EVIDENCE.md gap 15).
    derivation: vitd_calibration.elwood1997_intermittency_check()
    status: >-
      OR-ANCHORED TO AN INTERVAL, NOT FITTED TO A POINT. At equal cumulative SED
      the burst:continuous index ratio is C**(k-1), so
      k = 1 + ln(OR_burst/OR_occupational)/ln(C). That is one equation in two
      unknowns: C, the burst:continuous per-session dose contrast in fractions
      of MED, is never reported by the exposure-pattern literature, which
      classifies by pattern rather than by dose. Anchoring C to this model's own
      cited doses (erythema threshold vs sub-erythemal ceiling GAMMA_MED)
      produces an interval that contains the incumbent value, so the value was
      RETAINED rather than moved. Two biases oppose and neither is quantified:
      a wider true contrast lowers the implied exponent, while the non-matched
      cumulative dose between Elwood's arms raises it.
    not_covered: >-
      The FST susceptibility decay in cancer_risk() is deliberately untouched
      and remains an order-of-magnitude prior. Elwood & Jopson do not stratify
      by skin type, so there is no dose-response in that source to fit it to.
      Within-skin-type schedule rankings do not depend on it; cross-skin-type
      comparisons of absolute index values do.
    superseded_note: >-
      The 'not_covered' clause above was CLOSED on 2026-08-09 by the
      MELANIN_ATTENUATION_KAPPA entry below, which anchors that axis to
      measured basal-layer DNA damage rather than to an odds ratio. The Elwood
      anchoring itself is unchanged. Also corrected: this entry previously said
      the Elwood & Jopson paper was NOT in Papers_and_Datasets/. It is now, and
      all four odds ratios were verified against the full text, which also
      supplied a number the model had been missing -- TOTAL sun exposure
      OR = 1.18 (1.02-1.38), i.e. melanoma is almost purely a pattern effect.

  SCC_DOSE_EXPONENT:
    approved_by: User (repository owner)
    approval_date: 2026-08-09
    change: "NEW parameter, value 1.7. The SCC term was previously LINEAR in
      cumulative dose, i.e. an implicit exponent of 1.0 that no source supports."
    source: >-
      Moan, Dahlback, Henriksen & Magnus 1989, Cancer Res 49:5207-12 (PMID
      2766289): biological amplification factor Ab = 1.6-1.8 for SCC and
      2.1-2.3 for BCC, ERYTHEMALLY weighted -- the same weighting this model's
      SED carries. Corroborated by Moan 2015 (Photodermatol Photoimmunol
      Photomed 31:26-35), which fits the same power law across SCC, BCC and
      melanoma; Green 1976 (~1.8); Jones 1992 (3.0 SCC, 1.7 BCC).
    derivation: vitd_calibration.moan1989_scc_exponent_check()
    status: >-
      LITERATURE-ANCHORED to the midpoint of the only source that reports SCC
      and BCC separately, uses erythemal weighting, and cross-checks the action
      spectrum (Moan found erythemal and basal-layer-mutagenesis spectra agree
      within ~10%, which is what licenses using erythemal SED here). The wider
      literature brackets Ab at 1.3-3.0.
    not_covered: >-
      Ab is measured across AMBIENT-dose gradients between regions and is
      applied here to a personal annual cumulative dose. That transfer is an
      assumption. The epidemiology constrains the SHAPE -- super-linear, well
      above 1 -- not the transfer.

  MELANIN_ATTENUATION_KAPPA:
    approved_by: User (repository owner)
    approval_date: 2026-08-09
    change: "NEW parameter, value 0.0536715. Replaces the FST susceptibility
      prior exp(-0.45*(fst-1)), which was an admitted order-of-magnitude guess
      and was wrong in both directions: too steep across FST I-IV (3.9 against
      Gandini's measured 2.09) and too shallow across I-VI."
    source: >-
      Fajuyigbe et al. 2018, FASEB J 32:3700-3706 (PMID 29394104), ABSTRACT
      ONLY: CPD protection factors in FST VI vs fair Europeans by epidermal
      depth -- whole epidermis 8.0x, upper 5.0x, middle 16.5x, basal 59.0x.
      Fitted to the basal:whole ratio 59.0/8.0 = 7.375 and nothing else. That
      ratio is taken on the SAME subjects at the SAME exposures, so it is
      independent of whether the arms were matched on physical dose or on
      fractional MED -- an ambiguity that would otherwise disqualify the source.
      Melanin content by skin type from Shih et al. 2018 Table 1.
    derivation: vitd_calibration.skin_type_susceptibility_check()
    status: >-
      DERIVED from a Beer-Lambert depth model of CPD induction, with ONE fitted
      number, and scored against three sources it was not fitted to, all of
      which it passes: (1) Gandini 2005 III melanoma RR for skin type I vs IV,
      measured 2.09 (1.67-2.58), predicted 2.12; (2) the construction's own
      premise -- Shih's MED ratio VI:I of 7.24 must equal Fajuyigbe's measured
      equal-dose whole-epidermis protection of 8.0, and does, within 10%;
      (3) Shih's pooled basal:whole slope ratio 0.615, predicted 0.701, inside
      the interval the two wide CIs permit.
    not_covered: >-
      No epidemiological RR per erythemal episode BY SKIN TYPE exists -- a
      literature search on 2026-08-09 found the per-sunburn meta-analyses either
      pool skin types or restrict to FST I-IV. Substituting a DNA-damage
      biomarker for that missing RR is the central assumption of this axis, and
      it is an assumption, not a measurement. Fajuyigbe is abstract-only and
      carries the entire calibration (data request #12). Shih's FST V and VI
      melanin means rest on n=3 and n=1. Population incidence ratios (Ahmed
      2025: White:Black 13.1-25.8) are used as a DIRECTION check only, never as
      a target, because they confound phenotype with behaviour and
      ascertainment; the derived constitutive factor is 7.3, correctly below
      them.

  K_const:
    approved_by: User (repository owner)
    approval_date: 2026-08-17
    change: >-
      0.33 -> 0.98. Constitutive (baseline) melanin inhibition coefficient.
      Delivers an FST V:II optical factor of 2.01x and VI:I of 2.66x, against
      1.26x and 1.40x before.
    source: >-
      FOUR independent WITHIN-STUDY estimates of the same quantity -- two lab
      matched-dose, two field personal-dosimetry with the measured behavioural
      dose difference removed: Felton et al. 2016 (Br J Dermatol 175:1320-1328)
      1.473; Young et al. 2020 both arms 0.278; Kift et al. 2013 0.788;
      Darling et al. 2013 1.387. All four were already in the repo.
    derivation: >-
      scripts/kconst_recalibration.py -- equal-weight least squares in LOG
      RATIO space across the four routes. The diagnosis it rests on is
      scripts/fst_gap_decomposition.py. Consequence map:
      scripts/feasibility_map_kconst.py.
    status: >-
      CENTRAL ESTIMATE OF A RANGE, NOT A MEASURED CONSTANT. SD across the four
      routes is 0.56, so 0.98 should be read as the centre of roughly 0.3-1.5.
      It sits inside the 1.7-2.7x optical band that two independent routes
      agree on (lab matched-dose 1.5-2.9x; field-with-behaviour-removed
      1.7-2.7x).
      WHAT THE OLD 0.33 WAS: ln(1.36)/(M_VI - M_II), a static-optics inversion
      of a single Young 2020 ratio that ignored feedback and protocol entirely.
      On Felton 2016's within-study matched-dose protocol it did not merely
      under-predict the skin-type gap, it INVERTED it -- model FST II:V 0.96
      against an observed 2.14, because FST V's lower baseline (17.2 vs 36.5
      nmol/L) buys more headroom under (1 - D/D_max) than the melanin term
      removed. That inversion is gone at 0.98 (model 1.49) on every
      matched-dose contrast in the repo. Fixing a SIGN error was the primary
      justification; the magnitude change is secondary.
    not_covered: >-
      (1) BEHAVIOUR. Shade, clothing and time outdoors are a SEPARATE 2.1-2.4x
      factor living in vitd_behaviour.py, defaulting to 1.0 in scheduling mode.
      Folding them in here would require 4.3-5.7x, above every matched-dose
      measurement in existence, and would make the model wrong for exactly the
      users who act on its advice by changing their behaviour.
      (2) FST VI. Every FST V datapoint behind this number is
      Indian-subcontinent ancestry at UK latitude; every FST VI datapoint is
      lamp-based. All VI:* ratios are extrapolations onto M_baseline(VI) = 1.00,
      itself an unvalidated group-level prior. No field dosimetry exists in
      FST VI or in African-ancestry populations.
      (3) A is NOT yet recalibrated. Raising A (Phase 4, approved) increases
      synthesis per SED and will make some cells feasible again, so the
      feasibility consequence below is PROVISIONAL until the combined
      K_const + A map is re-run.
    consequence: >-
      SEVEN (skin type, session budget) cells moved from feasible to
      INFEASIBLE under the standing constraints; NONE moved the other way.
      FST III/IV/V/VI at N=104 are now blocked by the C1 erythema cap (70% MED);
      FST V at N=146 and FST VI at N=146/183 by the C7 session-length ceiling
      (144, 243 and 140 min respectively). Required minutes per day at UV index
      6 and N=365: FST I 10, II 10, III 12, IV 19, V 30, VI 42. Required dose
      inflation is graded by pigmentation: FST I x1.00, II x1.06-1.08,
      III x1.19-1.24, IV x1.47-1.67, V x2.05-2.76, VI x2.60-4.09.
      This is a RESULT, not a regression -- no constraint was relaxed, and it
      is asserted in tests/test_vitd_optimization.py::TestRecalibratedFeasibility
      so it cannot be quietly undone. It independently reproduces the
      conclusion Webb 2018 and Kift 2013 reach for FST V in the UK from
      MEASURED data: sun alone does not hold sufficiency. The model was not
      fitted to that conclusion.

  A:
    approved_by: User (repository owner)
    approval_date: 2026-08-17
    change: >-
      2.353 -> 3.114. Whole-model synthesis scale. Phase 4 item A4, implemented
      2026-08-18. Canonical derivation, with every intermediate factor written
      out, is the `A` entry of the vitd_model.py module docstring; it is not
      restated here.
    source: >-
      Young et al. 2021, PNAS 118:e2015867118, Fig. 4B -- the FULL-BODY arm at
      85% BSA, three lamps, regressions of delta-25(OH)D3 on ERYTHEMAL SED not
      forced through zero: UV6 4.97 (n=10), Arimed B 3.18 (n=19), PUVA 1.99
      (n=11). Range midpoint 3.48 nmol/L per SED. Independently cross-checked
      against the n-weighted pooled FB arm (Table 1, n=40): 34.6 -> 70.7 on a
      cumulative 10 SED = 3.61 per SED, 3.7% above the midpoint, so the two
      readings of "midpoint" agree.
    derivation: >-
      A is set so the model's MARGINAL yield for one 1 SED exposure equals
      3.48 nmol/L under the study's own conditions (FST II, exposed_bsa 0.85,
      D = 34.6, SC = 0, untanned, E_source = 1.89). Reproduced by
      vitd_validation.young2021_A_anchor() and pinned by
      tests/test_vitd_model.py::TestYoung2021AAnchor.
    status: >-
      CENTRE OF A WIDE, SOURCE-DEPENDENT RANGE, NOT A MEASURED CONSTANT. Read
      3.114 as the centre of roughly 2.9-5.1. Young's three FB slopes span 2.5x
      and that spread is the paper's OWN headline finding -- SED is a poor
      spectral predictor of vitamin D synthesis. Pairing each arm with its own
      E_source from SOURCE_CALIBRATION_TABLE gives A = 2.90 (Arimed B) and
      A = 5.06 (UV6): a 1.74x disagreement, and in the WRONG ORDER, since those
      E_source values predict UV6 slightly weaker than Arimed B while Young
      measures it 56% stronger.
      WHAT THE OLD 2.353 WAS: it preserved a 1.27 nmol/L rise for 1 SED in
      untanned FST III at 35% BSA, D = 25, computed at K_const = 0.33. That
      reference stopped being reproducible when K_const moved to 0.98 on
      2026-08-17 (the same expression now returns 1.11), so 2.353 was an
      ORPHANED constant before this change.
      AND THE GAP THAT MOTIVATED THIS WAS PARTLY SPECTRAL, NOT BIOLOGICAL: the
      "~1.85 vs 2.0-5.0" figure was computed at the DEPRECATED E_source = 1.00.
      At the current solar default the incumbent A already yielded 2.63, i.e.
      already inside Young's band. This is a x1.32 move, not the x1.5-1.9 the
      pre-2026-08-16 framing implied.
    dark_skin_flag: >-
      REQUIRED AT POINT OF USE (standing_directives.dark_skin_priority). Young
      2021 is FST I-II ONLY (n = 75; 6x I, 69x II, ZERO FST III-VI) and its
      authors explicitly disclaim generalisation: "The results from this study
      only apply to FST I/II". A is applied at every FST, so using it for
      FST V-VI is a LIGHT-SKIN EXTRAPOLATION. Mitigated but NOT removed by the
      fact that the between-FST gradient (K_const) is anchored separately on
      matched-dose FST V data, so what is extrapolated is the overall LEVEL and
      not the skin-type gradient. Any absolute 25(OH)D prediction for FST V-VI
      must carry this flag.
    consequence: >-
      Farrar 2013 (FST V -- the ONLY dark-skin quantitative check in the suite)
      moves FAIL -> PASS: delta +8.7 -> +11.2 against an observed +21.7, band
      10-35. Bogh 2012 stays PASS: +48.0 -> +51.6 against +55.8, band
      45.8-65.8. Karppinen 2017 passes in the DEFAULT feedback mode, so its
      experimental-mode override was removed. Required validation 8/10 -> 10/10.
      It also RAISES synthesis per SED and therefore partially offsets the
      K_const feasibility result; see phase4_results_2026_08_18.
    not_covered: >-
      A cannot reproduce Young's FB protocol END-TO-END. Simulating the actual
      5 x 2 SED protocol needs A ~ 8.3 (Arimed B) to reach the observed +38.6,
      and the 3.7%-BSA arms need more still; the model under-predicts Young's
      absolute rises by 2.7x (FB) to 6.2x (PB) at any A that keeps Bogh 2012
      and Farrar 2013 in band. Young 2021 and Bogh 2012 are MUTUALLY
      INCOMPATIBLE inside this dose-response structure: Bogh delivered ~6.7x
      Young's D3-effective dose from a LOWER baseline and produced only 1.45x
      the rise. This calibration matches Young's per-SED SLOPE, which is what
      the approval asked for; it does not resolve that conflict and NO value of
      A can. Young's own within-study BSA contrast (85% vs 3.7% BSA, 3.28x
      response for a 23x area ratio) also implies BSA_EXP ~ 0.38 against the
      model's 0.50 -- RECORDED, NOT ACTED ON.

  feedback_mode:
    approved_by: User (repository owner)
    approval_date: 2026-08-17
    change: >-
      'linear' -> 'biphasic'. Phase 4 item A2, implemented 2026-08-18. The hard
      synthesis ceiling max(0, 1 - D/D_max) is WITHDRAWN as the default and
      replaced by a saturating form. Full reasoning and the adopted expression
      are in the vitd_model.py module docstring, feedback_mode entry.
    source: >-
      Scholze et al. 2026, Commun Med 6:105. With bimonthly sampling they
      report that conversion of cutaneous D3 to plasma 25(OH)D3 is efficient at
      low 25(OH)D3 and "decreases markedly" above an inflection at 56 nmol/L.
      Implemented as vitd_physiology.hydroxylation_efficiency.
    why_the_linear_form_went: >-
      It asserted that cutaneous synthesis STOPS OUTRIGHT at D = D_max. No such
      switch exists -- 25(OH)D homeostasis is exerted downstream, on
      1,25(OH)2D, by CYP24A1 induction and substrate-driven catabolism, the
      latter already carried by the state-dependent k_decay_D. AND D_max = 150.0
      never had a source: it is NOT in Bogh 2010, and PMID 19812604's observed
      maximum was 116 nmol/L. This was a structural bug fix as much as a
      calibration.
    estimation_flags: >-
      [ESTIMATE] D_inflect = 56.0 is an OUTPUT of a breakpoint fitted on the
      vitamin D3 axis, not a regressor, so it carries that breakpoint's own
      (unpublished) width.
      [CHOICE] n = 2.0 is NOT fittable from a single reported breakpoint. It is
      chosen as the gentlest integer knee: g = 0.5 at the inflection, 0.80 at
      half of it, 0.20 at twice it. g(D) is never exactly zero, which is the
      entire point of the change.
    rejected_alternative: >-
      feedback_mode='saturating', g(D) = exp(-ln2 * D / D_half_feedback),
      already existed and was used only inside the Karppinen check. Rejected on
      two grounds. (1) Its scale parameter has no source: the default 50.0 is
      unattributed and the 90.0 used in the Karppinen check was FITTED to
      Karppinen, so adopting it would have made that check CIRCULAR. (2) An
      exponential is at its steepest fractional decline as D -> 0, which
      contradicts Scholze's finding that hydroxylation is EFFICIENT below the
      inflection. Measured cost of adopting it anyway, at the A the Young 2021
      anchor then requires (3.641): the Karppinen check FAILS. Mode retained
      unchanged for sensitivity work.
    consequence: >-
      REPORTED IN FULL BECAUSE IT MOVES THE HEADLINE. The interval optimum
      under net_final_D_change_per_SED (FST III, 1 SED, 84 d, D0 = 25) goes
      3 d -> 5 d and the within-5%-of-peak band goes [2,3,4] -> [3,4,5,6].
      DECOMPOSED: the feedback form ALONE (biphasic at the old A) leaves the
      FST III optimum at 3 d; the A recalibration ALONE (linear at A = 2.930)
      also leaves it at 3 d. The shift to 5 d is their INTERACTION -- more
      synthesis per session raises steady-state D, which then sits further up
      the feedback curve. The optimum stays graded by pigmentation and gets
      SHORTER with darker skin: FST I-II 5 d, III 5 d, IV 4 d, V-VI 2 d
      (incumbent 3/3/3/2/2/1 d). Interval ORDERING is near-invariant (Spearman
      rho 0.964-0.999 across FST II/III/V/VI); it is the ARGMAX that moves. So
      "recalibrating A leaves scheduling rankings unchanged" is TRUE for the
      ordering and FALSE for the reported optimum.
    correction_to_an_earlier_claim: >-
      run_all.py section 17 said the interval ordering "comes from the
      (1 - D/D_max) feedback term". That is now MEASURED to be too specific.
      The ordering comes from having a DECREASING feedback factor at all: at
      the incumbent A the argmax is 3 d under linear, biphasic and both
      saturating variants alike.
    d_max_status: >-
      D_max = 150.0 is NOT deleted -- 'linear' and 'power' still read it and
      vitd_sensitivity/scripts still sweep it -- but it is OUT OF FORCE in the
      default model. `D_max_override=` is INERT unless feedback_mode is
      explicitly set to 'linear' or 'power'. ANY sensitivity result reporting
      D_max as influential is describing a NON-DEFAULT configuration.

  K_ATTEN:
    approved_by: User (repository owner)
    approval_date: 2026-08-17
    change: >-
      RETIRED AS A FREE PARAMETER, 2026-08-18 (Phase 4 item A6). Value fixed at
      the structural constant K_ATTEN_STRUCTURAL = 0.00 and registered in
      vitd_model.RETIRED_PARAMETERS. ModelParams now raises
      RetiredParameterError on assignment; the only route through is the
      explicitly named allow_retired_parameter_sweep() context manager, which
      exists for ablation and sensitivity work and is NOT a calibration route.
    mechanism_not_removed: >-
      exp(-K_ATTEN * excess_M) is STILL EVALUATED on every session. What is
      retired is the freedom to assign the coefficient, not the tanning term.
    why: >-
      (1) NOT IDENTIFIABLE -- jointly unidentifiable with K_SC and with K_const;
      vitd_sensitivity.py finds >99% of the response surface of each pair is
      explained by a single linear combination, so only combinations are
      constrained and reporting K_ATTEN as separately calibrated OVERSTATES the
      evidence. (2) IMMATERIAL -- across its full plausible range it swings
      steady-state D by 0.3%, against 36% for A. It is the best-cited and least
      consequential number in the model. (3) THE FIT THAT PRODUCED 0.00 IS NOT
      AN ESTIMATE -- 1D MSE minimisation on the Young 2020 per-person dataset
      (n = 23, TL-01 arm) returns 0.00 with CI [0.00, 0.00], but the objective
      is FLAT to 0.08% across K_ATTEN in [0.00, 0.33] on that acute 7.5 SED
      protocol. That CI is an artefact of bound-constrained fitting against a
      flat surface. Baseline 25(OH)D and BSA explain the trial's FST II:VI
      response with no facultative term at all.
    status: >-
      RETIREMENT IS NOT A CLAIM THAT TANNING DOES NOTHING. It is a claim that
      THIS REPOSITORY'S DATA CANNOT MEASURE IT. Matsuoka 1990 (n = 7),
      deconvolved, implies 0.34-1.00 depending on the assumed feedback form
      (vitd_calibration.derive_K_ATTEN); that divergence is documented,
      immaterial at present, and guarded by
      vitd_validation.sanity_photoadaptation_reduction and
      tests/test_matsuoka1990.py. To reinstate it as a free parameter, remove
      it from RETIRED_PARAMETERS and supply a dataset that separates it from
      K_SC.
    dark_skin_note: >-
      The facultative term is the one that would matter most for repeated
      exposure in FST IV-VI, and it is exactly the term the repo cannot
      measure. Matsuoka 1990 is n = 7 and its "51% attenuation" is NOT a clean
      melanin effect -- baseline 25(OH)D differed between arms (92.1 vs 56.2
      nmol/L), so most of that blunting is D-feedback. Retiring the coefficient
      makes that ignorance explicit instead of hiding it in a fitted number.

  E_SOURCE_SOLAR_DEFAULT:
    approved_by: User (repository owner)
    approval_date: 2026-08-16
    change: >-
      Sun-facing entry points move from an implicit E_source = 1.00 to
      'solar_summer' = 1.89. New constant vitd_model.E_SOURCE_SOLAR_DEFAULT.
      Affects minutes_for_target() when params is not supplied, and
      vitd_analyses.analysis_sun_exposure. Roughly HALVES every recommended
      minutes figure for sun.
    source: >-
      Webb, Alghamdi, Kift & Rhodes 2021, Endocrine Connections 10:R248-R266,
      Table 1: VDE:EE for sun = 1.89 (Manchester summer), 2.01 (NZ summer),
      1.22 (NZ winter). Full text in Papers_and_Datasets/.
    derivation: >-
      None -- this is a direct table read, not a fit. The change is better
      characterised as removing an artefact than as calibrating: 1.00 was the
      backward-compatibility default when E_source was introduced under audit
      tag [C2] ("so all existing scenarios are unchanged") and was later
      retro-labelled "solar broadband reference". No solar spectrum has
      VDE:EE = 1.00; Webb's lowest published sun value is 1.22, in NEW ZEALAND
      WINTER. The old default therefore under-weighted solar vitamin D
      effectiveness by ~1.9x at every latitude and season.
    status: >-
      APPROVED WITH A KNOWN COST, ACCEPTED EXPLICITLY. See not_covered.
      Independent evidence that the direction is right: against the only
      external absolute anchor in the repo (Webb/Kift 2018, ~9 min/day for
      white Caucasians) the model moves from 49.7 min to 25.3 min. Still
      2.8x too long, but 2x closer.
      A is NOT refitted and does not need to be: it is anchored by Bogh 2012,
      which runs at the TL-01 E_source of 2.44 and passes to 0.2 nmol/L. The
      "1.27 nmol/L per SED" figure sometimes described as A's calibration
      target is computed FROM the parameters in vitd_validation.py and is a
      regression test, not an external anchor.
    not_covered: >-
      SOLAR E_source IS NOT IDENTIFIABLE FROM THIS REPO'S SOLAR CHECKS, and this
      approval does not pretend otherwise. Every solar validation supplies an
      ASSUMED daily SED that nobody measured (NHANES _SIM_SED = 0.333; Kift
      0.333 3x/week), so that assumed dose absorbs any E_source change exactly.
      Measured consequence: NHANES Part B drops from 6/6 to 4/6. The assumed
      dose was deliberately NOT retuned to keep the check green -- doing so
      would be calibration through an ungated back door. Closing this properly
      requires a real ambient UV climatology so the dose becomes derived rather
      than assumed; that is FUTURE WORK, recorded as 'Open decisions' item 12(b)
      in MODEL_AND_EVIDENCE.md. Until then the 1.89 value is a literature read
      applied on top of unmeasured doses, and absolute 25(OH)D predictions for
      solar scenarios should be read with that in mind.
      Also not covered: the seasonal variation of solar VDE:EE (1.22-2.01 across
      Webb's three entries) is NOT modelled -- one summer value is used
      year-round.

  VERNEZ_GEOMETRY_MODEL:
    approved_by: User (repository owner)
    approval_date: 2026-08-16
    change: >-
      vitd_physiology.personal_geometry_factor: the elevation-only form
      0.15 + 0.30*cos(theta) is WITHDRAWN and replaced by Vernez 2015 Eq. 1,
      exposed as vernez_exposure_ratio(vis_percent, sza_deg). The 0.35 Cockell
      scalar remains the default when sky visibility is unknown, so DEFAULT
      MODEL OUTPUT IS UNCHANGED by this entry.
    source: >-
      Vernez, Milon, Vuilleumier, Bulliard, Koechlin, Boniol & Dore 2015,
      J Expo Sci Environ Epidemiol 25:113-118, doi 10.1038/jes.2014.6,
      Equation 1. Full text now in Papers_and_Datasets/. This CLOSES data
      request #13, which this repository twice recorded as "paywalled,
      confirmed unobtainable" -- exactly the failure mode CLAUDE.md warns about.
    derivation: >-
      None -- coefficients transcribed verbatim from the paper and pinned by
      tests/test_physiology.py::TestPersonalGeometryFactor against two values
      computable from the printed equation.
    status: >-
      SOURCED, replacing an acknowledged PLACEHOLDER whose cited support was
      found on full-text read to contradict it (gap 26, assumption A23).
      Vernez fit R^2 = 0.988 (n=8515, 3 postures), held out R^2 = 0.972
      (n=5672, 2 unseen postures). The substantive finding is that sky
      visibility moves the ratio ~11.6x while solar zenith angle moves it
      ~1.18x -- the withdrawn form modelled the small term and had no posture
      argument at all.
    not_covered: >-
      (1) Vernez ER assumes UNPROTECTED SKIN, NO SHADE and CONTINUOUS EXPOSURE.
      The authors say so and show their model overpredicting farmers' faces
      (15-55% modelled vs 11-15% measured). These are ceilings for deliberate
      unshaded exposure, NOT interchangeable with behaviourally-averaged
      dosimeter numbers such as Cockell's 0.35.
      (2) Supplementary Table S1 (typical Vis by posture and body site) is NOT
      in the obtained PDF -- data request #13b. The VIS_PRESETS_PLACEHOLDER
      values in vitd_physiology.py are BACK-DERIVED by inverting Eq. 1 against
      the mean ERs printed in the Results text. They are consistent with the
      paper's outputs but are NOT its inputs and must never be cited as such.
      Any user-facing number derived from them must be labelled a placeholder.
      (3) Geometry x BSA are coupled and the model treats them as independent:
      which sites are uncovered sets BOTH the exposed area and the mean ER.
      Not addressed.

