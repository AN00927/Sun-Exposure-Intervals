# W-R (2026-09-21): A3 tri-objective -- dose x spacing x cancer risk.
# DRAFT PROPOSAL. NEEDS_APPROVAL. No parameter value was changed by this work.
# ===========================================================================
a3_tri_objective_2026_09_21:
  status: APPROVED_2026_09_22
  approved_by: >-
    User answer to decision A7 (2026-09-22).
    The user asked what approving it would achieve, was told that it approves no
    parameter value, that it closes the tri-objective half of the A3 primary
    scheduling metric entry, and that it freezes the cross-skin-type guard as an
    approved structural invariant rather than removable code -- and approved on
    that basis. Parameter changes: still NONE.
  proposed_by: W-R workstream agent (2026-09-21)
  date: 2026-09-21
  closes_half_of: "A3 primary scheduling metric -> not_covered (tri-objective half)"
  memo: >-
    (workstream W-R, retired 2026-09-23 -- already-approved, no parameter
    value; this entry's own what_is_proposed field below is the full record)
  parameter_changes: NONE
  what_is_proposed: >-
    Adoption of the tri-objective (A1 n_sessions, A2 max_gap_days, A3
    skin-cancer risk), all minimised over schedules that already reach and
    hold the sufficiency floor, as the SECONDARY objective named in
    vitd_objectives.OBJECTIVE_HIERARCHY
    (key tri_objective_sessions_spacing_risk, implemented by
    vitd_optimization.tri_objective_frontier). Efficacy is a CONSTRAINT here,
    not an axis: "best SED" means the dose that constraint cost, reported as
    total_sed. What this entry adds over the pre-existing frontier code is the
    structural cross-skin-type guard and the explicit adherence framing of the
    session budget, both required by the blocker recorded in the A3 entry.
  cross_skin_type_guard: >-
    [STRUCTURAL] The A3 axis is no longer a float. tri_objective_frontier
    returns it as vitd_optimization.WithinFSTRisk, sealed to one Fitzpatrick
    skin type: float(), int(), numeric __format__ specs and arithmetic all
    raise CrossSkinTypeRiskError, and ordering against an index sealed to a
    different skin type raises. The only number published is
    risk_within_fst_ratio, normalised to that skin type's own lowest-risk
    feasible cell, so it equals 1.0 at every skin type's minimum by
    construction and carries no cross-FST magnitude. The absolute index is
    reachable only via absolute_value_for_fst(fst), which requires the caller
    to name the skin type it already holds. tables/tri_objective_frontier.csv
    therefore contains no absolute risk column at all.
  elwood_jopson_1997_finding: >-
    Read in full from Research_Papers/Elwood & Jopson.pdf (Int J Cancer
    73(2):198-203). It does NOT anchor the FST susceptibility term, and the
    reason is structural rather than a matter of the paper being unavailable:
    its Methods state that where possible the odds ratio used was one
    "adjusted for ... baseline host characteristics, such as ethnic origin,
    skin pigmentation and inherent tendency to burn or tan easily". Skin
    pigmentation is treated as a CONFOUNDER to be removed, never as an
    exposure whose effect is estimated, and no result in the paper is
    stratified by skin type or phototype. What it does anchor is the SHAPE of
    the intermittency axis: intermittent exposure OR 1.71 (95% CI 1.54-1.90,
    23 studies, 6,934 cases), heavy occupational exposure OR 0.86 (95% CI
    0.77-0.96, 20 studies, 6,517 cases), total exposure OR 1.18, and sunburn
    at all ages/adult life OR 1.91 (95% CI 1.69-2.17). That supports a
    super-linear penalty on per-session intensity at fixed cumulative dose;
    it supplies no cross-skin-type contrast.
  session_budget_status: >-
    [ASSUMPTION, NOT PHOTOBIOLOGY] Carried in code as
    vitd_optimization.SESSION_BUDGET_BASIS and returned on every
    tri_objective_frontier result. Without a budget the objective is
    degenerate: risk falls monotonically in session count to 365. No source in
    this repo fixes a budget value, so the grid (TRI_SESSION_BUDGETS) is swept
    and the assumption appears as an axis rather than as a default.
  not_covered: >-
    This entry approves no parameter value and no calibration. It does not
    make cross-skin-type risk magnitudes usable -- it makes them unreadable.
    Anchoring the FST susceptibility term would require a source reporting
    per-erythemal-episode risk BY skin type, which does not exist in this repo
    (see vitd_physiology section 4a, "HONEST LIMITS").
