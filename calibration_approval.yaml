  - id: "3a"
    name: "Webb/Kift tabulated UK UV climatology"
    status: PAPER_LOCATED_REQUEST_DEPRIORITISED
    source: >-
      Webb AR, Kazantzidis A, Kift RC, Farrar MD, Wilkinson J, Rhodes LE.
      'Colour Counts: Sunlight and Skin Type as Drivers of Vitamin D Deficiency
