key_findings:
  - "Spectral weighting is the dominant factor for dose conversion accuracy (reduces error from ~36 to <2 nmol/L)"
  - "K_ATTEN = 0.37 is a single-source prior (Matsuoka 1990 J Lab Clin Med, PMID 2165512, missing from repo)"
  - "D_max = 150.0 origin unconfirmed (not in Bogh 2010, wrong PMID cited previously)"
  - "M_baseline_by_FST are group-level priors; Datta 2019 shows pigmentation explains only 1.9-2.6% of individual variance"
  - "ArimedB II:VI ratio from raw OLS regression (1.02-1.18) differs from paper's 1.29 (possible ANCOVA methodology)"
  - "de Boer 2025 SC calibration fitted to only 3 timepoints; k_damage=0 (SC dip at week 5 not modeled)"
