notes: |
  Data extracted from PAPER_SUMMARIES.md [17] (full text retrieved).
  Full body NB-UVB (TL-01) 3×/week for 6 weeks produced +55.8 nmol/L
  from baseline ~19 nmol/L. This is the primary validation target that
  the model currently FAILS (model predicts +38.5 vs observed +55.8).
  The gap is attributed to E_source=2.5 placeholder and SC recalibration.
  Mean cumulative dose 9.0 J/cm² converts to ~23.7 SED using TL01
  conversion factor 2.63 (Webb 2021 Table 1, Grigalavicius 2015).
